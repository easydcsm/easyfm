<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EA$Y FM | CANLI</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            scroll-behavior: auto !important;
            overscroll-behavior-y: none;
        }

        body {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* ARKA PLAN CANVAS */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* DİNAMİK ARKA PLAN AMBİYANSI */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85vw;
            height: 85vh;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(100, 100, 100, 0.03) 45%, rgba(0, 0, 0, 0) 70%);
            z-index: 2;
            pointer-events: none;
            transition: transform 0.2s cubic-bezier(0.1, 0.9, 0.2, 1), opacity 0.5s ease;
            will-change: transform;
            filter: blur(20px);
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 15px 16px 30px 16px;
            gap: 16px;
            margin: 0 auto;
        }

        /* LOGO & 3D DÜNYA ALANI */
        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
        }

        /* PIRLANTA PATLAMA EFEKTİ */
        .blast-wave {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 1);
            box-shadow: 0 0 90px rgba(255, 255, 255, 1), inset 0 0 50px rgba(255, 255, 255, 0.8);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            will-change: transform, opacity;
        }

        .blast-active {
            animation: fastExplode 0.45s cubic-bezier(0.0, 0.9, 0.2, 1) forwards;
        }

        @keyframes fastExplode {
            0% {
                transform: translate(-50%, -50%) scale(0.6);
                opacity: 1;
                border-width: 10px;
            }
            100% {
                transform: translate(-50%, -50%) scale(2.8);
                opacity: 0;
                border-width: 1px;
            }
        }

        #globe-3d-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #globe-3d-container canvas {
            display: block;
            outline: none;
        }

        /* STATUS BAR (BADGES & VOLUME) */
        .status-bar {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-top: 2px;
            margin-bottom: 2px;
            width: 100%;
        }

        .badge {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
            transition: border-color 0.3s;
        }

        .badge:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px #ffffff;
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* SES KONTROL ÇUBUĞU */
        .volume-control-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(20, 20, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            transition: border-color 0.3s;
            position: relative;
            overflow: hidden;
        }

        .volume-control-box:hover {
            border-color: rgba(255, 255, 255, 0.4);
        }

        .volume-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            position: relative;
            z-index: 2;
        }

        .volume-btn:active {
            transform: scale(0.85);
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 75px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.25);
            outline: none;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px #ffffff;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* VİDEO ÇERÇEVESİ VE ÖZEL REKLAM MASKESİ */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 52%;
            height: 0;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: border-color 0.5s, box-shadow 0.5s;
            background: #000;
            margin: 0;
        }

        .video-container.playing-border {
            border-color: rgba(255, 255, 255, 0.65);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9), 0 0 45px rgba(255, 255, 255, 0.2);
        }

        #youtube-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto;
        }

        /* TAM KİLİT MASKELERİ */
        .yt-shield-top-main {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 82%;
            z-index: 15;
            background: transparent;
        }

        .yt-shield-bottom-left {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 78%;
            height: 18%;
            z-index: 15;
            background: transparent;
        }

        .yt-shield-bottom-edge {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 2%;
            height: 18%;
            z-index: 15;
            background: transparent;
        }

        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(20, 20, 20, 0.92) 0%, rgba(0, 0, 0, 0.98) 100%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .start-btn {
            background: #ffffff;
            color: #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 12px;
            padding: 14px 36px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.7);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s, background-color 0.3s;
            position: relative;
            overflow: hidden;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.95);
            background-color: #f8f8f8;
        }

        .start-btn:active {
            transform: scale(0.97);
        }

        /* NOW PLAYING CARD */
        .now-playing-card {
            width: 100%;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            padding: 16px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.75);
            margin: 0;
            position: relative;
            transition: border-color 0.3s ease;
        }

        .now-playing-card:hover {
            border-color: rgba(255, 255, 255, 0.45);
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
            max-width: 55%;
        }

        .track-label {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 2.5px;
            color: #888;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .track-title {
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
        }

        .next-track {
            font-size: 10px;
            color: #aaa;
            text-align: right;
            max-width: 42%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* DİNAMİK SES DALGASI ANIMASYONU */
        .wave-bars {
            display: flex;
            align-items: flex-end;
            gap: 2.5px;
            height: 12px;
            margin-left: 4px;
            transition: opacity 0.3s ease;
        }

        .wave-bar {
            width: 2px;
            background: #fff;
            border-radius: 1px;
            animation: waveAnim 0.8s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 30%; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 85%; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 50%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.25); }
            100% { transform: scaleY(1); }
        }

        #visualizer-canvas {
            width: 100%;
            height: 28px;
            margin: 0;
            transition: opacity 1s ease;
        }

        /* MOBİL UYUM DÜZENLEMELERİ */
        @media (max-width: 600px) {
            .main-wrapper {
                padding: 10px 12px 25px 12px;
                gap: 12px;
            }

            .logo-container {
                height: 200px;
                width: 100%;
            }

            .video-container {
                padding-bottom: 56%;
                border-radius: 16px;
            }

            .yt-shield-bottom-left {
                width: 68%;
            }

            .now-playing-card {
                padding: 12px 16px;
                border-radius: 14px;
            }

            .start-btn {
                font-size: 11px;
                padding: 12px 28px;
            }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

        </div>

        <canvas id="visualizer-canvas"></canvas>
    </div>
