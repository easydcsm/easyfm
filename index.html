<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA$Y FM - Canlı Spektrum</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: #000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 1. ÖN PLANA ÇIKARILMIŞ KANVAS */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1; /* Videonun altında ama katman olarak net görünen hiyerarşi */
            pointer-events: none;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-family: 'Anton', sans-serif;
            font-size: 58px;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #a6a6a6 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .subtitle {
            font-size: 11px;
            letter-spacing: 5px;
            margin-top: 5px;
            color: #aaa;
        }

        /* 2. ARKASINI GÖSTEREN (YARI ŞEFFAF) VİDEO/MÜZİK KUTUSU */
        .player-card {
            position: relative;
            width: 85%;
            max-width: 500px;
            background: rgba(15, 15, 15, 0.65); /* Yarı şeffaf arka plan */
            backdrop-filter: blur(12px); /* Buzlu cam efekti */
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .start-btn {
            background: #ffffff;
            color: #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 15px;
            padding: 16px 36px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
            transition: transform 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        .volume-control {
            margin-top: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .volume-slider {
            -webkit-appearance: none;
            width: 100px;
            height: 4px;
            background: #444;
            border-radius: 2px;
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="logo-container">
        <h1>EA$Y FM</h1>
        <div class="subtitle">7/24 GERÇEK ZAMANLI SPEKTRUM RADYO</div>
    </div>

    <div class="player-card">
        <button id="play-btn" class="start-btn" onclick="initAudio()">CANLI YAYINI BAŞLAT</button>
        
        <div class="volume-control" id="controls" style="display: none;">
            <span>🔊</span>
            <input type="range" id="vol-control" class="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
    </div>

    <!-- MÜZİK KAYNAĞI (HTML5 Audio Elementi) -->
    <audio id="audio-element" crossOrigin="anonymous" src="https://stream.zeno.fm/f3wvbbqmdg8uv"></audio>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        const audio = document.getElementById('audio-element');
        
        let audioCtx;
        let analyser;
        let source;
        let dataArray;
        let isPlaying = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initAudio() {
            if (isPlaying) return;

            // Web Audio API başlatma
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            
            // Gerçek zamanlı frekans çözünürlüğü (FFT Size)
            analyser.fftSize = 128; 

            source = audioCtx.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);

            audio.play();
            isPlaying = true;

            document.getElementById('play-btn').innerText = "YAYIN CANLI";
            document.getElementById('controls').style.display = 'flex';

            // Ses Slider Kontrolü
            document.getElementById('vol-control').addEventListener('input', (e) => {
                audio.volume = e.target.value;
            });

            renderFrame();
        }

        // -------------------------------------------------------------
        // GERÇEK ZAMANLI SENKRON SPEKTRUM ÇİZİMİ
        // -------------------------------------------------------------
        function renderFrame() {
            requestAnimationFrame(renderFrame);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (!isPlaying) return;

            // Anlık frekans verilerini oku
            analyser.getByteFrequencyData(dataArray);

            const isMobile = window.innerWidth < 600;
            const barWidth = isMobile ? 6 : 12;
            const barGap = isMobile ? 6 : 10;
            
            const totalBars = dataArray.length;
            const totalWidth = (totalBars * (barWidth + barGap));
            const startX = (canvas.width - totalWidth) / 2; // Çizgileri ekrana ortala
            const centerY = canvas.height / 2;

            for (let i = 0; i < totalBars; i++) {
                // Şarkının anlık dikey yüksekliği (0 - 255 arası gerçek veri)
                const value = dataArray[i];
                
                // Yüksekliği ekran boyutuna ölçekle
                const percent = value / 255;
                const barHeight = (percent * (canvas.height * 0.6)) + 6;

                const x = startX + (i * (barWidth + barGap));
                const y = centerY - (barHeight / 2); // Merkezden dikey büyütme

                // Gerçek sese duyarlı parlaklık ve netlik
                const alpha = 0.3 + (percent * 0.7);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.shadowBlur = percent * 25; // Bas vurdukça parlar
                ctx.shadowColor = 'rgba(255, 255, 255, 0.9)';

                // Sabit dikey çizgileri çiz
                ctx.fillRect(x, y, barWidth, barHeight);
            }
        }
    </script>
</body>
</html>
