<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA$Y TRAPHOUSE RADIO</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow-x: hidden;
        }

        /* BANNER RESMİ KUTUSU */
        .banner-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 25px;
            padding-bottom: 10px;
        }

        .banner-img {
            max-width: 90%;
            width: 480px;
            height: auto;
            border-radius: 12px;
            border: 2px solid #39ff14;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
            object-fit: contain;
        }

        /* Arayüz Konumu */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 20px 40px 20px;
        }

        /* RADIO CONTAINER */
        .radio-card {
            background: rgba(15, 15, 15, 0.95);
            border: 1px solid #222;
            border-top: 3px solid #39ff14;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(57, 255, 20, 0.15);
            text-align: center;
            position: relative;
        }

        .radio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
            padding-bottom: 12px;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
        }
        .brand-title span {
            color: #39ff14;
            text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
        }

        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            background: rgba(57, 255, 20, 0.1);
            color: #39ff14;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(57, 255, 20, 0.3);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #39ff14;
            border-radius: 50%;
            box-shadow: 0 0 8px #39ff14;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* TRACK DISPLAY */
        .track-info-box {
            margin-bottom: 24px;
        }

        .track-label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .track-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            word-wrap: break-word;
        }

        .next-track-box {
            background: #0a0a0a;
            border-radius: 8px;
            padding: 8px 12px;
            display: inline-block;
            font-size: 0.8rem;
            color: #aaa;
            border: 1px solid #1a1a1a;
        }
        .next-track-box strong {
            color: #39ff14;
        }

        /* AUDIO VISUALIZER (DEKORATİF) */
        .visualizer-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 4px;
            height: 35px;
            margin-bottom: 25px;
        }

        .v-bar {
            width: 6px;
            background-color: #39ff14;
            border-radius: 3px;
            height: 15%;
            box-shadow: 0 0 5px rgba(57, 255, 20, 0.5);
            transition: height 0.1s ease;
        }

        /* OVERLAY / GİRİŞ EKRANI */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.6s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.6s;
            user-select: none;
            overflow: hidden;
        }

        .overlay-btn {
            background: transparent;
            border: 2px solid #39ff14;
            color: #39ff14;
            padding: 16px 36px;
            font-size: 1.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            border-radius: 40px;
            box-shadow: 0 0 25px rgba(57, 255, 20, 0.3);
            pointer-events: none;
            position: relative;
            z-index: 2;
        }

        .overlay-subtext {
            margin-top: 15px;
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 1px;
            text-transform: uppercase;
            position: relative;
            z-index: 2;
        }

        /* BLAST WAVE PATLAMA EFEKTİ */
        .blast-wave {
            position: absolute;
            width: 10px;
            height: 10px;
            background: radial-gradient(circle, rgba(57,255,20,0.8) 0%, rgba(0,0,0,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            transform: scale(0);
            z-index: 1;
        }

        .blast-active {
            animation: blastAnim 0.7s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes blastAnim {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(250);
                opacity: 0;
            }
        }

        /* GİZLİ YOUTUBE PLAYER */
        #youtube-player-wrapper {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- CANLI YAYINA BAĞLAN OVERLAY -->
    <div id="start-overlay" onclick="handleUserClick()">
        <div id="blast-wave" class="blast-wave"></div>
        <div class="overlay-btn">CANLI YAYINA BAĞLAN</div>
        <div class="overlay-subtext">Radyo Senkronizasyonu İçin Tıklayın</div>
    </div>

    <!-- BANNER GÖRSELİ -->
    <div class="banner-container">
        <img src="https://i.hizliresim.com/b9iuvh6.png" alt="EA$Y Traphouse Logo" class="banner-img">
    </div>

    <!-- RADYO ARAYÜZÜ -->
    <div class="main-wrapper">
        <div class="radio-card">
            <div class="radio-header">
                <div class="brand-title">EA$Y <span>TRAPHOUSE</span></div>
                <div class="live-badge">
                    <div class="live-dot"></div> CANLI YAYIN
                </div>
            </div>

            <!-- ANLIK ÇALAN ŞARKI -->
            <div class="track-info-box">
                <div class="track-label">Şu An Çalıyor</div>
                <div class="track-title" id="current-track-name">Yükleniyor...</div>
                
                <div class="next-track-box">
                    Sıradaki: <strong id="next-track-name">---</strong>
                </div>
            </div>

            <!-- GÖRSEL EQUALIZER -->
            <div class="visualizer-container">
                <div class="v-bar" id="bar1"></div>
                <div class="v-bar" id="bar2"></div>
                <div class="v-bar" id="bar3"></div>
                <div class="v-bar" id="bar4"></div>
                <div class="v-bar" id="bar5"></div>
                <div class="v-bar" id="bar6"></div>
                <div class="v-bar" id="bar7"></div>
                <div class="v-bar" id="bar8"></div>
            </div>
        </div>
    </div>

    <!-- GİZLİ YOUTUBE OYNATICI -->
    <div id="youtube-player-wrapper">
        <div id="youtube-player"></div>
    </div>

    <!-- YOUTUBE IFRAME API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        // --- İZOLASYON & SCROLL ENGELLEYİCİ ---
        function forceScrollTop() {
            window.scrollTo(0, 0);
            document.body.scrollTop = 0;
            document.documentElement.scrollTop = 0;
        }

        window.addEventListener('scroll', forceScrollTop, { passive: false });
        window.addEventListener('load', () => {
            forceScrollTop();
            setTimeout(forceScrollTop, 50);
            setTimeout(forceScrollTop, 300);
        });

        // --- GLOBAL DEĞİŞKENLER ---
        let player = null;
        let isPlayerReady = false;
        let isPlayingState = false;
        let syncCheckInterval = null;
        let currentLoadedVideoId = "";

        // --- ŞARKI LİSTESİ ---
        const songList = [
            { id: '1IEg_3x35go', duration: 120, title: 'FRANCHISE' },
            { id: 'qAlF70MdfwU', duration: 207, title: 'OUT WEST' }, 
            { id: 'L_BpiSsIBFM', duration: 236, title: 'BROTHER STONE' }, 
            { id: 'cTGQrA5HHIU', duration: 204, title: 'WITH THAT' }, 
            { id: 'ftaXMKV3ffE', duration: 160, title: 'BACKR00MS' },
            { id: 'LPTlvQ1Zet0', duration: 188, title: 'RIC FLAIR DRIP' },
            { id: 'EfHNIPXTxy0', duration: 276, title: 'ZEZE' }
        ];

        // Yayın Başlangıç Zaman Damgası (Sabit Epoch)
        const STREAM_START_TIME = 1700000000; 
        const totalPlaylistDuration = songList.reduce((acc, song) => acc + song.duration, 0);

        // --- DETERMINISTIK (ORTAK SEED'Lİ) SHUFFLE FONKSİYONU ---
        // Bu fonksiyon verilen seed numarasına göre HER DİNLEYİCİDE BİREBİR AYNI karma listeyi üretir.
        function getShuffledPlaylist(seed) {
            let list = [...songList];
            let m = list.length, t, i;

            // Pseudo-Random Jeneratörü (Linear Congruential Generator)
            const random = () => {
                let x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            };

            while (m) {
                i = Math.floor(random() * m--);
                t = list[m];
                list[m] = list[i];
                list[i] = t;
            }
            return list;
        }

        // --- CANLI YAYIN DURUMUNU HESAPLAMA ---
        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const timePassed = nowInSeconds - STREAM_START_TIME;

            // Kaçıncı tam tur/döngüde olduğumuzu buluyoruz
            const cycleIndex = Math.floor(timePassed / totalPlaylistDuration);
            const elapsedTimeInCycle = timePassed % totalPlaylistDuration;

            // O anki döngüye özel karma listeyi al
            const currentPlaylist = getShuffledPlaylist(cycleIndex + 100);

            let accumulatedTime = 0;
            for (let i = 0; i < currentPlaylist.length; i++) {
                if (elapsedTimeInCycle < accumulatedTime + currentPlaylist[i].duration) {
                    
                    // Sıradaki (bir sonraki) şarkıyı tespit et
                    let nextSongIndex = i + 1;
                    let nextPlaylist = currentPlaylist;
                    
                    // Eğer listenin son şarkısındaysak, bir sonraki döngünün ilk şarkısını al
                    if (nextSongIndex >= currentPlaylist.length) {
                        nextPlaylist = getShuffledPlaylist(cycleIndex + 101);
                        nextSongIndex = 0;
                    }

                    return {
                        currentSong: currentPlaylist[i],
                        nextSong: nextPlaylist[nextSongIndex],
                        seekTo: elapsedTimeInCycle - accumulatedTime
                    };
                }
                accumulatedTime += currentPlaylist[i].duration;
            }
            
            return { 
                currentSong: currentPlaylist[0], 
                nextSong: currentPlaylist[1], 
                seekTo: 0 
            };
        }

        // --- ETİKET GÜNCELLEME ---
        function updateTrackLabels(state) {
            document.getElementById('current-track-name').innerText = state.currentSong.title;
            document.getElementById('next-track-name').innerText = state.nextSong.title;
        }

        // Sayfa yüklendiğinde etiketleri önceden doldur
        const initialState = getCurrentStreamState();
        updateTrackLabels(initialState);

        // --- YOUTUBE IFRAME API HAZIR OLDUĞUNDA ---
        function onYouTubeIframeAPIReady() {
            const state = getCurrentStreamState();
            currentLoadedVideoId = state.currentSong.id;

            player = new YT.Player('youtube-player', {
                videoId: state.currentSong.id,
                playerVars: {
                    'autoplay': 0,
                    'controls': 1,
                    'rel': 0,
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'start': Math.floor(state.seekTo)
                },
                events: {
                    'onReady': () => { 
                        isPlayerReady = true; 
                        if (document.activeElement) document.activeElement.blur();
                        forceScrollTop();
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        // --- SENKRONİZASYON KONTROLÜ (3 SANİYEDE BİR ÇALIŞIR) ---
        function syncToLiveStream() {
            if (!isPlayerReady || !player) return;

            const state = getCurrentStreamState();
            updateTrackLabels(state);

            // 1. Şarkı değişti mi?
            if (currentLoadedVideoId !== state.currentSong.id) {
                currentLoadedVideoId = state.currentSong.id;
                player.loadVideoById({
                    videoId: state.currentSong.id,
                    startSeconds: Math.floor(state.seekTo)
                });
                player.playVideo();
                return;
            }

            // 2. Zaman kayması var mı? (>3 saniye kayma varsa senkronize et)
            if (typeof player.getCurrentTime === 'function') {
                const currentTime = player.getCurrentTime();
                const timeDiff = Math.abs(currentTime - state.seekTo);
                if (timeDiff > 3) {
                    player.seekTo(state.seekTo, true);
                    player.playVideo();
                }
            }
        }

        // --- KULLANICI GİRİŞ TIKLAMASI VE BAŞLATMA ---
        function handleUserClick() {
            // Blast Efekti
            const blast = document.getElementById('blast-wave');
            blast.classList.remove('blast-active');
            void blast.offsetWidth;
            blast.classList.add('blast-active');

            // Overlay Kaybolma
            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { 
                overlay.style.visibility = 'hidden'; 
            }, 600);

            const startPlaying = () => {
                const state = getCurrentStreamState();
                updateTrackLabels(state);
                currentLoadedVideoId = state.currentSong.id;

                if (typeof player.unMute === 'function') player.unMute();

                player.loadVideoById({
                    videoId: state.currentSong.id,
                    startSeconds: Math.floor(state.seekTo)
                });
                player.playVideo();
                isPlayingState = true;

                // Periyodik Senkronizasyonu Başlat
                if (syncCheckInterval) clearInterval(syncCheckInterval);
                syncCheckInterval = setInterval(syncToLiveStream, 3000);
            };

            if (isPlayerReady && player) {
                startPlaying();
            } else {
                const checkReady = setInterval(() => {
                    if (isPlayerReady && player) {
                        clearInterval(checkReady);
                        startPlaying();
                    }
                }, 100);
            }
        }

        // --- OYNATICI DURUM DEĞİŞİKLİKLERİ ---
        function onPlayerStateChange(event) {
            // Şarkı bittiğinde senkronizasyonu tetikle
            if (event.data === YT.PlayerState.ENDED) {
                syncToLiveStream();
            }
        }

        // --- DEKORATİF EQUALIZER ANİMASYONU ---
        setInterval(() => {
            if (isPlayingState) {
                for (let i = 1; i <= 8; i++) {
                    const bar = document.getElementById(`bar${i}`);
                    if (bar) {
                        const randomHeight = Math.floor(Math.random() * 85) + 15;
                        bar.style.height = `${randomHeight}%`;
                    }
                }
            } else {
                for (let i = 1; i <= 8; i++) {
                    const bar = document.getElementById(`bar${i}`);
                    if (bar) bar.style.height = `15%`;
                }
            }
        }, 150);
    </script>
</body>
</html>
