<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA$Y FM</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* KRİSTAL PARÇACIKLI ARKA PLAN */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.04) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* SAĞ ÜST: DIAMOND GLOW TOGGLE */
        .glow-toggle-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .glow-toggle-label {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #fff;
            text-transform: uppercase;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 20px;
            border: 1px solid #555;
        }

        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 0 5px #fff;
        }

        input:checked + .slider-toggle {
            background-color: #ffffff;
        }

        input:checked + .slider-toggle:before {
            transform: translateX(15px);
            background-color: #000;
        }

        body.diamond-mode-active .ambient-glow {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(0, 0, 0, 0) 75%);
        }

        body.diamond-mode-active h1 {
            text-shadow: 
                0 0 15px rgba(255, 255, 255, 1),
                0 0 30px rgba(255, 255, 255, 0.8),
                0 0 45px rgba(255, 255, 255, 0.5);
        }

        body.diamond-mode-active .video-container {
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.25), 0 10px 40px rgba(0, 0, 0, 0.8);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 20px;
            margin-top: 10px;
        }

        h1 {
            margin: 0;
            font-family: 'Anton', sans-serif;
            font-size: 64px;
            letter-spacing: 4px;
            text-transform: uppercase;
            
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #a6a6a6 25%, 
                #ffffff 50%, 
                #737373 75%, 
                #ffffff 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8),
                0 0 20px rgba(255, 255, 255, 0.4),
                0 0 30px rgba(255, 255, 255, 0.2);
                
            transform: skew(-4deg);
            animation: diamondShine 4s linear infinite;
            transition: text-shadow 0.3s;
        }

        @keyframes diamondShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 13px;
            color: #ffffff;
            letter-spacing: 5px;
            margin-top: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            opacity: 0.9;
        }

        .listener-badge {
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
        }

        .live-dot {
            width: 9px;
            height: 9px;
            background-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #ffffff, 0 0 15px #ffffff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* VİDEO ÇERÇEVESİ VE OVERLAY */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.08);
            border: 1px solid #222222;
            transition: box-shadow 0.4s, border-color 0.4s;
            margin-bottom: 15px;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.98);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .start-btn {
            background: #ffffff;
            color: #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 16px;
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }

        #wave-canvas {
            width: 100%;
            height: 40px;
            margin-top: 10px;
        }
    </style>

    <!-- Firebase SDK (Anlık Sayaç İçin) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="glow-toggle-container">
        <span class="glow-toggle-label">DIAMOND GLOW</span>
        <label class="switch">
            <input type="checkbox" id="glow-toggle" onchange="toggleDiamondGlow(this)">
            <span class="slider-toggle"></span>
        </label>
    </div>

    <canvas id="bg-canvas"></canvas>
    <div class="ambient-glow"></div>

    <div class="main-wrapper">
        <div class="logo-container">
            <h1>EA$Y FM</h1>
            <div class="subtitle">7/24 YÜZDE YÜZ MÜZİK</div>
        </div>

        <div class="listener-badge">
            <span class="live-dot"></span>
            <span>Anlık Dinleyici: <strong id="listener-count" style="color: #ffffff;">0</strong></span>
        </div>

        <div class="video-container">
            <div id="start-overlay" onclick="startRadio()">
                <button class="start-btn">CANLI YAYINA KATIL</button>
            </div>
            <div id="player"></div>
        </div>

        <canvas id="wave-canvas"></canvas>
    </div>

    <script>
        function toggleDiamondGlow(checkbox) {
            document.body.classList.toggle('diamond-mode-active', checkbox.checked);
        }

        // KRİSTAL PARÇACIK ANİMASYONU
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.7 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        for (let i = 0; i < 45; i++) particlesArray.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // FIREBASE SAYAÇ
        const firebaseConfig = {
            apiKey: "AIzaSyBaTlb6V6e4FMLTYNXAPBgdzsgiclL8Qw8",
            authDomain: "easyfm-37b9e.firebaseapp.com",
            databaseURL: "https://easyfm-37b9e-default-rtdb.firebaseio.com",
            projectId: "easyfm-37b9e",
            storageBucket: "easyfm-37b9e.firebasestorage.app",
            messagingSenderId: "869244564550",
            appId: "1:869244564550:web:f0824148dbcae6b7024647"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const myConnectionsRef = db.ref('online_listeners');
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                const con = myConnectionsRef.push();
                con.onDisconnect().remove();
                con.set(true);
            }
        });
        myConnectionsRef.on('value', (snap) => {
            document.getElementById('listener-count').innerText = snap.numChildren();
        });

        // FREKANS DALGASI ANİMASYONU
        const wCanvas = document.getElementById('wave-canvas');
        const wCtx = wCanvas.getContext('2d');
        let step = 0;
        function drawWave() {
            wCanvas.width = wCanvas.offsetWidth;
            wCanvas.height = wCanvas.offsetHeight;
            wCtx.clearRect(0, 0, wCanvas.width, wCanvas.height);
            wCtx.beginPath();
            wCtx.lineWidth = 1.5;
            wCtx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            for (let x = 0; x < wCanvas.width; x++) {
                const y = Math.sin((x + step) * 0.04) * (wCanvas.height / 3) + (wCanvas.height / 2);
                if (x === 0) wCtx.moveTo(x, y);
                else wCtx.lineTo(x, y);
            }
            wCtx.stroke();
            step += 1.5;
            requestAnimationFrame(drawWave);
        }
        drawWave();

        // OYNATICI VE PLAYLIST SİSTEMİ
        const songList = [
            { id: '1IEg_3x35go', duration: 120 },
            { id: 'qAlF70MdfwU', duration: 207 }, 
            { id: 'L_BpiSsIBFM', duration: 236 }, 
            { id: 'cTGQrA5HHIU', duration: 204 }, 
            { id: 'ftaXMKV3ffE', duration: 160 },
            { id: 'LPTlvQ1Zet0', duration: 188 },
            { id: 'EfHNIPXTxy0', duration: 276 }
        ];

        const STREAM_START_TIME = 1700000000; 
        const totalPlaylistDuration = songList.reduce((acc, song) => acc + song.duration, 0);

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const elapsedTime = (nowInSeconds - STREAM_START_TIME) % totalPlaylistDuration;
            let accumulatedTime = 0;
            for (let i = 0; i < songList.length; i++) {
                if (elapsedTime < accumulatedTime + songList[i].duration) {
                    return {
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += songList[i].duration;
            }
            return { songIndex: 0, seekTo: 0 };
        }

        let player;
        let isStarted = false;

        // YouTube API Yükleme
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            const state = getCurrentStreamState();
            player = new YT.Player('player', {
                videoId: songList[state.songIndex].id,
                playerVars: {
                    'autoplay': 0,
                    'controls': 1,
                    'start': Math.floor(state.seekTo),
                    'rel': 0
                }
            });
        }

        function startRadio() {
            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);

            if (player && typeof player.playVideo === 'function') {
                const state = getCurrentStreamState();
                player.seekTo(state.seekTo, true);
                player.playVideo();
            }
        }
    </script>
</body>
</html>
