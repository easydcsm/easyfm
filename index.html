<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA$Y FM | CANLI</title>
    <!-- Google Fonts: Anton & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            background-color: #000000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ARKA PLAN CANVAS */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(0, 0, 0, 0) 75%);
            z-index: 2;
            pointer-events: none;
            transition: opacity 1.5s ease, background 1.5s ease;
        }

        /* DIAMOND GLOW TOGGLE */
        .glow-toggle-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(255,255,255,0.1);
        }

        .glow-toggle-label {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #fff;
            text-transform: uppercase;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #222;
            transition: .4s;
            border-radius: 20px;
            border: 1px solid #444;
        }

        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: #fff;
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 0 5px #fff;
        }

        input:checked + .slider-toggle {
            background-color: #ffffff;
        }

        input:checked + .slider-toggle:before {
            transform: translateX(15px);
            background-color: #000;
        }

        body.diamond-mode-active .ambient-glow {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.28) 0%, rgba(200, 200, 200, 0.08) 50%, rgba(0, 0, 0, 0) 80%);
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px;
        }

        /* LOGO & 3D DÜNYA ALANI */
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
            margin-top: 5px;
            position: relative;
            width: 100%;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
        }

        /* ANLIK PIRLANTA PATLAMA HALKASI */
        .blast-wave {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 1);
            box-shadow: 0 0 80px rgba(255, 255, 255, 1), inset 0 0 50px rgba(255, 255, 255, 0.9);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }

        .blast-active {
            animation: fastExplode 0.4s cubic-bezier(0.0, 0.9, 0.2, 1) forwards;
        }

        @keyframes fastExplode {
            0% {
                transform: translate(-50%, -50%) scale(0.6);
                opacity: 1;
                border-width: 10px;
            }
            100% {
                transform: translate(-50%, -50%) scale(2.6);
                opacity: 0;
                border-width: 1px;
            }
        }

        #globe-3d-container {
            width: 440px;
            height: 280px;
            position: relative;
            z-index: 2;
            overflow: visible;
        }

        .subtitle {
            position: absolute;
            bottom: -5px;
            width: 100%;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 12px;
            color: #ffffff;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
            opacity: 0.9;
        }

        /* BADGES BAR */
        .status-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .badge {
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* VİDEO ÇERÇEVESİ VE OVERLAY */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: box-shadow 0.6s, border-color 0.6s;
            margin-bottom: 15px;
            background: #000;
        }

        #player-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        .start-btn {
            background: #ffffff;
            color: #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 15px;
            padding: 14px 36px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 45px rgba(255, 255, 255, 1);
        }

        /* NOW PLAYING CARD */
        .now-playing-card {
            width: 100%;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .track-label {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
        }

        .track-title {
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .next-track {
            font-size: 10px;
            color: #aaa;
            text-align: right;
            max-width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #visualizer-canvas {
            width: 100%;
            height: 35px;
            transition: opacity 1s ease;
        }
    </style>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- YouTube IFrame API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="glow-toggle-container">
        <span class="glow-toggle-label">DIAMOND GLOW</span>
        <label class="switch">
            <input type="checkbox" id="glow-toggle" onchange="toggleDiamondGlow(this)">
            <span class="slider-toggle"></span>
        </label>
    </div>

    <canvas id="bg-canvas"></canvas>
    <div class="ambient-glow"></div>

    <div class="main-wrapper" id="main-wrapper">
        <div class="logo-container">
            <div class="blast-wave" id="blast-wave"></div>
            <div id="globe-3d-container"></div>
            <div class="subtitle">7/24 YÜZDE YÜZ MÜZİK</div>
        </div>

        <div class="status-bar">
            <div class="badge">
                <span class="live-dot"></span>
                <span>CANLI YAYIN</span>
            </div>
            <div class="badge">
                <span>🎧 DİNLEYİCİ: <strong id="listener-count" style="color: #ffffff;">0</strong></span>
            </div>
        </div>

        <div class="video-container">
            <div id="start-overlay" onclick="startRadio()">
                <button class="start-btn">CANLI YAYINA KATIL</button>
            </div>
            <div id="player-iframe"></div>
        </div>

        <div class="now-playing-card">
            <div class="track-info">
                <span class="track-label">ŞU AN YAYINDA</span>
                <span class="track-title" id="current-track-name">Canlı Yayın Bekleniyor...</span>
            </div>
            <div class="next-track">
                <div class="track-label" style="text-align: right;">SIRADAKİ</div>
                <span id="next-track-name">---</span>
            </div>
        </div>

        <canvas id="visualizer-canvas"></canvas>
    </div>

    <script>
        let player = null;
        let isPlayingState = false;
        let ytApiReady = false;
        let currentLoadedVideoId = null;
        let syncCheckInterval = null;

        function toggleDiamondGlow(checkbox) {
            document.body.classList.toggle('diamond-mode-active', checkbox.checked);
        }

        // --- PLAYLIST VE ZAMAN HESAPLAMALARI ---
        const songList = [
            { id: '1IEg_3x35go', duration: 120, title: 'FRANCHISE' },
            { id: 'qAlF70MdfwU', duration: 207, title: 'OUT WEST' }, 
            { id: 'L_BpiSsIBFM', duration: 236, title: 'BROTHER STONE' }, 
            { id: 'cTGQrA5HHIU', duration: 204, title: 'WITH THAT' }, 
            { id: 'ftaXMKV3ffE', duration: 160, title: 'BACKR00MS' },
            { id: 'LPTlvQ1Zet0', duration: 188, title: 'RIC FLAIR DRIP' },
            { id: 'EfHNIPXTxy0', duration: 276, title: 'ZEZE' }
        ];

        const STREAM_START_TIME = 1700000000; 
        const totalPlaylistDuration = songList.reduce((acc, song) => acc + song.duration, 0);

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const elapsedTime = (nowInSeconds - STREAM_START_TIME) % totalPlaylistDuration;
            let accumulatedTime = 0;
            for (let i = 0; i < songList.length; i++) {
                if (elapsedTime < accumulatedTime + songList[i].duration) {
                    return {
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += songList[i].duration;
            }
            return { songIndex: 0, seekTo: 0 };
        }

        function updateTrackLabels(currentIndex) {
            const currentSong = songList[currentIndex];
            const nextIndex = (currentIndex + 1) % songList.length;
            const nextSong = songList[nextIndex];

            document.getElementById('current-track-name').innerText = currentSong.title;
            document.getElementById('next-track-name').innerText = nextSong.title;
        }

        const initialState = getCurrentStreamState();
        updateTrackLabels(initialState.songIndex);

        // --- YOUTUBE API KURULUMU ---
        function onYouTubeIframeAPIReady() {
            ytApiReady = true;
            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];

            player = new YT.Player('player-iframe', {
                videoId: targetSong.id,
                playerVars: {
                    'autoplay': 0,
                    'controls': 1,
                    'rel': 0,
                    'start': Math.floor(state.seekTo),
                    'enablejsapi': 1
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            // YouTube Oynatıcı Durumları: PLAYING (1), PAUSED (2), BUFFERING (3), CUED (5)
            if (event.data === YT.PlayerState.PLAYING) {
                isPlayingState = true;
                forceLiveSync(); // Oynatma başladığı an tam senkronize canlı saniyeye çek
            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                isPlayingState = false; // Duraklatılınca dünyayı ve alt çizgileri durdur
            }
        }

        // CANLI AKIŞ SENKRONİZASYON KONTROLÜ (GERİ/İLERİ SARMAYI CANLIYA CEKER)
        function forceLiveSync() {
            if (!player || typeof player.getCurrentTime !== 'function') return;

            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];
            const currentVideoData = player.getVideoData();

            // Eğer şarkı değişmişse yeni şarkıyı yükle ve canlı saniyeden başlat
            if (!currentVideoData || currentVideoData.video_id !== targetSong.id) {
                currentLoadedVideoId = targetSong.id;
                player.loadVideoById({
                    videoId: targetSong.id,
                    startSeconds: Math.floor(state.seekTo)
                });
                updateTrackLabels(state.songIndex);
                return;
            }

            // Şarkı aynıysa, oynatıcının saniyesini gerçek canlı saniye ile kıyasla
            const currentTime = player.getCurrentTime();
            const timeDiff = Math.abs(currentTime - state.seekTo);

            // Eğer sapma 2 saniyeden fazlaysa (durdurup bekleme veya sarma durumu) canlı saniyeye fırlat
            if (timeDiff > 2) {
                player.seekTo(state.seekTo, true);
            }
        }

        function startRadio() {
            const blast = document.getElementById('blast-wave');
            blast.classList.remove('blast-active');
            void blast.offsetWidth;
            blast.classList.add('blast-active');

            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { 
                overlay.style.visibility = 'hidden'; 
            }, 600);

            if (player && typeof player.playVideo === 'function') {
                const state = getCurrentStreamState();
                const targetSong = songList[state.songIndex];
                
                player.loadVideoById({
                    videoId: targetSong.id,
                    startSeconds: Math.floor(state.seekTo)
                });
                player.playVideo();
                isPlayingState = true;
            }

            // Sürekli canlı akış kontrolü (Her 3 saniyede bir sapmayı denetle)
            if (syncCheckInterval) clearInterval(syncCheckInterval);
            syncCheckInterval = setInterval(() => {
                if (isPlayingState) {
                    forceLiveSync();
                }
            }, 3000);
        }

        // --- THREE.JS 3D KÜÇÜLTÜLMÜŞ DÜNYA VE BASS PATLAMA EFEKTİ ---
        const globeContainer = document.getElementById('globe-3d-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 440 / 280, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(440, 280);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        globeContainer.appendChild(renderer.domElement);

        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg');

        // Yarıçap 1.85'ten 1.45'e küçültüldü (Dünya Küçültüldü)
        const baseRadius = 1.45;
        const geometry = new THREE.SphereGeometry(baseRadius, 64, 64);
        const material = new THREE.MeshStandardMaterial({
            map: earthTexture,
            roughness: 0.4,
            metalness: 0.3
        });
        const globeMesh = new THREE.Mesh(geometry, material);
        scene.add(globeMesh);

        // Atmosfer Katmanı
        const atmosGeo = new THREE.SphereGeometry(baseRadius + 0.03, 64, 64);
        const atmosMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.12,
            side: THREE.BackSide
        });
        const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
        scene.add(atmosMesh);

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 3, 5);
        scene.add(dirLight);

        // EA$Y FM YÖRÜNGE HALKASI (2048x256 Ultra HD)
        let ringMesh = null;

        function createOrbitRingText() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'transparent';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = '900 130px "Anton", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';

            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 35;

            ctx.fillText("EA$Y FM", canvas.width / 2, canvas.height / 2);

            const ringTex = new THREE.CanvasTexture(canvas);
            ringTex.minFilter = THREE.LinearFilter;
            ringTex.magFilter = THREE.LinearFilter;
            ringTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

            const ringGeo = new THREE.CylinderGeometry(baseRadius + 0.22, baseRadius + 0.22, 0.45, 64, 1, true);
            const ringMat = new THREE.MeshBasicMaterial({
                map: ringTex,
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: false
            });

            ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.rotation.z = 0.12;
            scene.add(ringMesh);
        }

        document.fonts.ready.then(() => {
            createOrbitRingText();
        });

        camera.position.z = 5.2;

        let bassAngle = 0;

        function animateGlobe() {
            requestAnimationFrame(animateGlobe);

            if (isPlayingState) {
                // Dünya ve Halkayı Döndür
                globeMesh.rotation.y += 0.005;
                if (ringMesh) ringMesh.rotation.y -= 0.008;

                // BASS PATLAMA / RİTİM EFEKTİ (Dinamik Ölçekleme)
                bassAngle += 0.08;
                const bassScale = 1 + Math.pow(Math.sin(bassAngle), 6) * 0.06; // Ritimli bass vurma hareketi
                globeMesh.scale.set(bassScale, bassScale, bassScale);
                atmosMesh.scale.set(bassScale, bassScale, bassScale);
            } else {
                // Video durduysa yumuşakça varsayılan boyuta dön ve dur
                globeMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
                atmosMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
            }

            renderer.render(scene, camera);
        }
        animateGlobe();

        // PARÇACIK ANİMASYONU
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class DiamondParticle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.8 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.8 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.beginPath();
                ctx.moveTo(this.x, this.y - this.size);
                ctx.lineTo(this.x + this.size, this.y);
                ctx.lineTo(this.x, this.y + this.size);
                ctx.lineTo(this.x - this.size, this.y);
                ctx.closePath();
                ctx.fill();
            }
        }

        for (let i = 0; i < 50; i++) particlesArray.push(new DiamondParticle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // FIREBASE SAYAÇ
        const firebaseConfig = {
            apiKey: "AIzaSyBaTlb6V6e4FMLTYNXAPBgdzsgiclL8Qw8",
            authDomain: "easyfm-37b9e.firebaseapp.com",
            databaseURL: "https://easyfm-37b9e-default-rtdb.firebaseio.com",
            projectId: "easyfm-37b9e",
            storageBucket: "easyfm-37b9e.firebasestorage.app",
            messagingSenderId: "869244564550",
            appId: "1:869244564550:web:f0824148dbcae6b7024647"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const myConnectionsRef = db.ref('online_listeners');
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                const con = myConnectionsRef.push();
                con.onDisconnect().remove();
                con.set(true);
            }
        });
        myConnectionsRef.on('value', (snap) => {
            document.getElementById('listener-count').innerText = snap.numChildren();
        });

        // SPEKTRUM VISUALIZER
        const vCanvas = document.getElementById('visualizer-canvas');
        const vCtx = vCanvas.getContext('2d');
        const numBars = 36;
        let barHeights = new Array(numBars).fill(2);

        function drawVisualizer() {
            vCanvas.width = vCanvas.offsetWidth;
            vCanvas.height = vCanvas.offsetHeight;
            vCtx.clearRect(0, 0, vCanvas.width, vCanvas.height);

            const barWidth = (vCanvas.width / numBars) - 4;

            for (let i = 0; i < numBars; i++) {
                if (isPlayingState) {
                    // Müzik çalarken hareketli spektrum
                    const target = Math.random() * (vCanvas.height - 4) + 4;
                    barHeights[i] += (target - barHeights[i]) * 0.12;
                } else {
                    // Müzik durunca çizgilerin tamamen sıfırlanıp düzleşmesi
                    barHeights[i] += (2 - barHeights[i]) * 0.1;
                }

                const x = i * (barWidth + 4);
                const y = vCanvas.height - barHeights[i];

                vCtx.fillStyle = '#ffffff';
                vCtx.fillRect(x, y, barWidth, barHeights[i]);
            }
            requestAnimationFrame(drawVisualizer);
        }
        drawVisualizer();
    </script>
</body>
</html>
