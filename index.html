<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EA$Y FM | CANLI</title>
    
    <!-- Pırlanta & Hip-Hop Estetiği Fontları -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Syne:wght@800;900&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #000000;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden !important;
            touch-action: none;
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* TV / CRT TARAMA ÇİZGİLERİ (TRAP KLİP HAFİF EFEKTİ) */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 50;
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            opacity: 0.6;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* ICE / AMBIENT GLOW */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85vw;
            height: 85vh;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 0%, rgba(180, 220, 255, 0.05) 40%, rgba(0, 0, 0, 0) 70%);
            z-index: 2;
            pointer-events: none;
            transition: transform 0.08s ease-out, opacity 0.08s ease-out;
            will-change: transform, opacity;
            filter: blur(30px);
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 650px;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(8px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom)) 12px;
            gap: 6px;
            margin: 0 auto;
            box-sizing: border-box;
            transition: transform 0.05s ease;
        }

        /* BAS VURDUĞUNDA SALLANMA (SHAKE) EFEKTİ */
        .wrapper-shake {
            animation: trapBassShake 0.12s ease-in-out infinite alternate;
        }

        @keyframes trapBassShake {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.003) translate(-1px, 1px); }
            100% { transform: scale(0.998) translate(1px, -1px); }
        }

        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 360px;
            height: clamp(140px, 24vh, 220px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
            flex-shrink: 0;
        }

        @media (min-width: 769px) {
            .logo-container {
                max-width: 520px;
                height: clamp(200px, 28vh, 300px);
            }
        }

        #globe-3d-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #globe-3d-container canvas {
            display: block;
            outline: none;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.25));
        }

        .status-bar {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
        }

        .badge {
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 9px;
            font-weight: 800;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.05);
            white-space: nowrap;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff, 0 0 18px #ffffff;
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); box-shadow: 0 0 6px #fff; }
            50% { opacity: 0.3; transform: scale(0.6); box-shadow: 0 0 2px #fff; }
            100% { opacity: 1; transform: scale(1); box-shadow: 0 0 12px #fff; }
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 4px 12px;
            border-radius: 30px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .volume-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }
        
        .volume-btn:active {
            transform: scale(0.85);
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 50px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.25);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px #ffffff;
        }

        /* VİDEO KUTUSU VE ICE KENARLIK */
        .video-container {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 140px;
            max-height: 38vh;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.22);
            transition: border-color 0.3s, box-shadow 0.3s;
            background: #000;
            margin: 2px 0;
        }

        .video-container.playing-border {
            border-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.25), inset 0 0 15px rgba(255, 255, 255, 0.1);
        }

        #youtube-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: auto;
        }

        .yt-shield-top-main { position: absolute; top: 0; left: 0; width: 100%; height: 82%; z-index: 15; background: transparent; }
        .yt-shield-bottom-left { position: absolute; bottom: 0; left: 0; width: 78%; height: 18%; z-index: 15; background: transparent; }
        .yt-shield-bottom-edge { position: absolute; bottom: 0; right: 0; width: 2%; height: 18%; z-index: 15; background: transparent; }

        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(15, 15, 15, 0.94) 0%, rgba(0, 0, 0, 0.98) 100%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .start-btn {
            background: #ffffff;
            color: #000;
            font-family: 'Syne', sans-serif;
            font-weight: 900;
            font-size: 10px;
            padding: 13px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.8), 0 0 40px rgba(255, 255, 255, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 255, 255, 1);
        }

        /* NOW PLAYING CARD */
        .now-playing-card {
            width: 100%;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 12px;
            padding: 9px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.85);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        /* CARD PARILTI EFEKTİ */
        .now-playing-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: rotate(45deg);
            animation: cardShimmer 6s infinite;
            pointer-events: none;
        }

        @keyframes cardShimmer {
            0% { transform: translateY(-100%) rotate(45deg); }
            100% { transform: translateY(100%) rotate(45deg); }
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
            max-width: 58%;
        }

        .track-label {
            font-size: 7.5px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #999;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .track-title {
            font-family: 'Syne', sans-serif;
            font-size: 12.5px;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .next-track {
            font-size: 8.5px;
            color: #aaa;
            text-align: right;
            max-width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .wave-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 9px;
            margin-left: 3px;
        }

        .wave-bar {
            width: 2px;
            background: #fff;
            border-radius: 1px;
            box-shadow: 0 0 5px #fff;
            animation: waveAnim 0.7s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 35%; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 90%; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 55%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }

        #visualizer-canvas {
            width: 100%;
            height: 16px;
            min-height: 14px;
            margin: 0;
            flex-shrink: 0;
            display: block;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div class="ambient-glow" id="ambient-glow"></div>

    <div class="main-wrapper" id="main-wrapper">
        <div class="logo-container">
            <div id="globe-3d-container"></div>
        </div>

        <div class="status-bar">
            <div class="badge">
                <span class="live-dot"></span>
                <span>CANLI</span>
            </div>
            <div class="badge">
                <span>🎧 DİNLEYİCİ: <strong id="listener-count" style="color: #ffffff; text-shadow:0 0 6px #fff;">0</strong></span>
            </div>
            <div class="volume-control-box">
                <button class="volume-btn" id="mute-btn">🔊</button>
                <input type="range" class="volume-slider" id="volume-range" min="0" max="100" value="100">
            </div>
        </div>

        <div class="video-container" id="video-box">
            <div class="yt-shield-top-main"></div>
            <div class="yt-shield-bottom-left"></div>
            <div class="yt-shield-bottom-edge"></div>

            <div id="start-overlay">
                <button class="start-btn" id="start-btn-el">CANLI YAYINA KATIL</button>
            </div>
            <div id="youtube-player"></div>
        </div>

        <div class="now-playing-card">
            <div class="track-info">
                <span class="track-label">
                    <span style="display:inline-block; width:4px; height:4px; background:#fff; border-radius:50%; box-shadow:0 0 6px #fff;"></span>
                    YAYINDA
                    <div class="wave-bars" id="wave-bars" style="opacity: 0;">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                </span>
                <span class="track-title" id="current-track-name">Canlı Yayın Bekleniyor...</span>
            </div>
            <div class="next-track">
                <div class="track-label" style="justify-content: flex-end;">SIRADAKİ</div>
                <span id="next-track-name" style="font-weight:700;">---</span>
            </div>
        </div>

        <canvas id="visualizer-canvas"></canvas>
    </div>

    <script>
        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

        let player = null;
        let isPlayerReady = false;
        let isPlayingState = false;
        let actualPlayerStatePlaying = false; 
        let currentLoadedVideoId = null;
        let syncCheckInterval = null;

        const baseSongList = [
            { id: '1IEg_3x35go', duration: 120, title: 'FRANCHISE' },
            { id: 'qAlF70MdfwU', duration: 207, title: 'OUT WEST' }, 
            { id: 'L_BpiSsIBFM', duration: 236, title: 'BROTHER STONE' }, 
            { id: 'cTGQrA5HHIU', duration: 204, title: 'WITH THAT' }, 
            { id: 'ftaXMKV3ffE', duration: 160, title: 'BACKR00MS' },
            { id: 'LPTlvQ1Zet0', duration: 188, title: 'RIC FLAIR DRIP' },
            { id: 'EfHNIPXTxy0', duration: 276, title: 'ZEZE' },
            { id: 'yST9RwZNZDw', duration: 169, title: 'VURURUM KAFANDAN' },
            { id: 'JrPBResAG2s', duration: 175, title: 'KÖPEKBALIKLARI BURDA' },
            { id: '-q-XvhV7GFA', duration: 165, title: 'HARBİDEN ŞEKERMİŞ' },
            { id: 'N4nfjhJN6SA', duration: 197, title: 'TAKE IT TO TRIAL' },
            { id: 'kC2nGcgKeX0', duration: 167, title: 'GOSTOSO' },
            { id: 'LcKC9YG-TQY', duration: 150, title: 'MOB GUYS' },
            { id: '-yElvysKMCY', duration: 164, title: 'TRIMSKI' },
            { id: 'pfjy7PhVtMo', duration: 135, title: 'POTATO LOADED' },
            { id: 'bHDWrnlIqfQ', duration: 173, title: 'POPPIN/TALIBAN' },
            { id: 'KPz33BLkvho', duration: 165, title: 'ESCAPE PLAN' },
            { id: 'B9synWjqBn8', duration: 209, title: 'FE!N' },
            { id: 'MKPEZlXY49Q', duration: 244, title: 'JENGA' },
            { id: 'SpXw0qiy3Wo', duration: 314, title: 'X' },
            { id: 'GErG9femMQk', duration: 174, title: 'WE PAID' },
            { id: 'leJNDpm_G10', duration: 308, title: 'HOT' },
            { id: 'PXxbEfhtDiM', duration: 169, title: 'DEAD FRESH' },
            { id: '81LJJFASh-I', duration: 185, title: '24/7' },
            { id: 'H6v_UYs01gA', duration: 167, title: 'PEMBE YALANLAR' },
            { id: 'p6DHMNX-TO4', duration: 191, title: 'INSANË' },
            { id: 'OBVx0Jmg88g', duration: 212, title: 'HBA' }
        ];

        const STREAM_START_TIME = 1700000000; 

        function getDeterministicShuffledList(array, seed) {
            let shuffled = [...array];
            let m = shuffled.length, t, i;
            let pseudoRandom = function() {
                let z = (seed += 0x6D2B79F5);
                z = Math.imul(z ^ (z >>> 15), z | 1);
                z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
                return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
            };

            while (m) {
                i = Math.floor(pseudoRandom() * m--);
                t = shuffled[m];
                shuffled[m] = shuffled[i];
                shuffled[i] = t;
            }
            return shuffled;
        }

        const songList = getDeterministicShuffledList(baseSongList, STREAM_START_TIME);
        const totalPlaylistDuration = songList.reduce((acc, song) => acc + song.duration, 0);

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const elapsedTime = (nowInSeconds - STREAM_START_TIME) % totalPlaylistDuration;
            let accumulatedTime = 0;
            for (let i = 0; i < songList.length; i++) {
                if (elapsedTime < accumulatedTime + songList[i].duration) {
                    return {
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += songList[i].duration;
            }
            return { songIndex: 0, seekTo: 0 };
        }

        function updateTrackLabels(currentIndex) {
            const currentSong = songList[currentIndex];
            const nextIndex = (currentIndex + 1) % songList.length;
            const nextSong = songList[nextIndex];

            document.getElementById('current-track-name').innerText = currentSong.title;
            document.getElementById('next-track-name').innerText = nextSong.title;
        }

        const initialState = getCurrentStreamState();
        updateTrackLabels(initialState.songIndex);

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];
            currentLoadedVideoId = targetSong.id;

            player = new YT.Player('youtube-player', {
                videoId: targetSong.id,
                playerVars: {
                    'autoplay': 0,
                    'controls': 1,
                    'rel': 0,
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'iv_load_policy': 3,
                    'fs': 0,
                    'start': Math.floor(state.seekTo)
                },
                events: {
                    'onReady': () => { 
                        isPlayerReady = true; 
                        if (document.activeElement) document.activeElement.blur();
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        const mainWrapper = document.getElementById('main-wrapper');

        function updateAudioVisualState() {
            const vBox = document.getElementById('video-box');
            const waveBars = document.getElementById('wave-bars');
            const vol = Number(volumeRange.value);

            if (vol === 0 || isMuted || !actualPlayerStatePlaying) {
                isPlayingState = false;
                vBox.classList.remove('playing-border');
                waveBars.style.opacity = '0';
                mainWrapper.classList.remove('wrapper-shake');
            } else {
                isPlayingState = true;
                vBox.classList.add('playing-border');
                waveBars.style.opacity = '1';
                mainWrapper.classList.add('wrapper-shake');
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                actualPlayerStatePlaying = true;
            } else {
                actualPlayerStatePlaying = false;
            }
            updateAudioVisualState();
        }

        function syncToLiveStream() {
            if (!isPlayerReady || !player) return;

            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];

            updateTrackLabels(state.songIndex);

            if (currentLoadedVideoId !== targetSong.id) {
                currentLoadedVideoId = targetSong.id;
                player.loadVideoById({
                    videoId: targetSong.id,
                    startSeconds: Math.floor(state.seekTo)
                });
                player.playVideo();
                return;
            }

            if (typeof player.getCurrentTime === 'function') {
                const currentTime = player.getCurrentTime();
                const timeDiff = Math.abs(currentTime - state.seekTo);
                
                if (timeDiff > 1.8) {
                    player.seekTo(state.seekTo, true);
                    player.playVideo();
                }
            }
        }

        function handleUserClick() {
            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);

            const startPlaying = () => {
                const state = getCurrentStreamState();
                const targetSong = songList[state.songIndex];

                updateTrackLabels(state.songIndex);
                currentLoadedVideoId = targetSong.id;

                if (typeof player.unMute === 'function') player.unMute();

                player.loadVideoById({
                    videoId: targetSong.id,
                    startSeconds: Math.floor(state.seekTo)
                });
                player.playVideo();

                if (syncCheckInterval) clearInterval(syncCheckInterval);
                syncCheckInterval = setInterval(syncToLiveStream, 1000);
            };

            if (isPlayerReady && player) {
                startPlaying();
            } else {
                const checkReady = setInterval(() => {
                    if (isPlayerReady && player) {
                        clearInterval(checkReady);
                        startPlaying();
                    }
                }, 100);
            }
        }

        document.getElementById('start-overlay').addEventListener('click', handleUserClick);
        document.getElementById('start-btn-el').addEventListener('click', (e) => {
            e.stopPropagation();
            handleUserClick();
        });

        const volumeRange = document.getElementById('volume-range');
        const muteBtn = document.getElementById('mute-btn');
        let isMuted = false;

        volumeRange.addEventListener('input', (e) => {
            const val = Number(e.target.value);
            
            if (player && typeof player.setVolume === 'function') {
                player.setVolume(val);
                if (val === 0) {
                    player.mute();
                    muteBtn.innerText = '🔇';
                    isMuted = true;
                } else {
                    if (isMuted || (typeof player.isMuted === 'function' && player.isMuted())) {
                        player.unMute();
                        isMuted = false;
                    }
                    muteBtn.innerText = '🔊';
                }
            }
            updateAudioVisualState();
        });

        muteBtn.addEventListener('click', () => {
            if (!player) return;
            if (isMuted) {
                player.unMute();
                muteBtn.innerText = '🔊';
                let currentVol = Number(volumeRange.value);
                if (currentVol === 0) {
                    currentVol = 100;
                    volumeRange.value = 100;
                }
                if (typeof player.setVolume === 'function') player.setVolume(currentVol);
                isMuted = false;
            } else {
                player.mute();
                muteBtn.innerText = '🔇';
                volumeRange.value = 0;
                isMuted = true;
            }
            updateAudioVisualState();
        });

        /* THREE.JS DÜNYA & DİNAMİK ICE/EQUALIZER HALKASI (SIĞDIRMA AYARLI) */
        const globeContainer = document.getElementById('globe-3d-container');
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        
        const isMobileDevice = window.innerWidth <= 768;
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: !isMobileDevice, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        globeContainer.appendChild(renderer.domElement);

        function resizeThreeJS() {
            const width = globeContainer.clientWidth;
            const height = globeContainer.clientHeight;
            if (width === 0 || height === 0) return;

            camera.aspect = width / height;

            /* KAMERA MESAFESİ UFAKÇE GERİYE ÇEKİLEREK KESİLMELER SIFIRLANDI */
            if (window.innerWidth > 768) {
                camera.position.z = 5.6;
            } else if (window.innerHeight <= 650) {
                camera.position.z = 7.2;
            } else if (window.innerWidth <= 600) {
                camera.position.z = 6.8;
            } else {
                camera.position.z = 6.2;
            }

            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg');

        const baseRadius = 1.5;
        const segments = isMobileDevice ? 32 : 64;
        const geometry = new THREE.SphereGeometry(baseRadius, segments, segments);
        const material = new THREE.MeshStandardMaterial({
            map: earthTexture,
            roughness: 0.35,
            metalness: 0.4
        });
        const globeMesh = new THREE.Mesh(geometry, material);
        scene.add(globeMesh);

        /* 3D ARKA PLAN DİNAMİK EKOLAYZIR HALKASI */
        const ringBarsCount = isMobileDevice ? 36 : 64;
        const ringBarsGroup = new THREE.Group();
        const ringBarMeshes = [];

        for (let i = 0; i < ringBarsCount; i++) {
            const barGeo = new THREE.BoxGeometry(0.035, 0.32, 0.035);
            const barMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6 });
            const bar = new THREE.Mesh(barGeo, barMat);
            
            const angle = (i / ringBarsCount) * Math.PI * 2;
            const radius = baseRadius + 0.3;
            bar.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, -0.2);
            bar.rotation.z = angle - Math.PI / 2;
            
            ringBarsGroup.add(bar);
            ringBarMeshes.push(bar);
        }
        scene.add(ringBarsGroup);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(5, 4, 5);
        scene.add(dirLight);

        let ringMesh = null;

        function createOrbitRingText() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'transparent';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';

            /* METİNLERE DOKUNULMADI */
            ctx.font = '900 68px "Montserrat", sans-serif';
            ctx.fillText("EA$Y FM", canvas.width / 2, 85);

            ctx.font = '800 28px "Space Grotesk", sans-serif';
            ctx.fillText("7/24 YÜZDE YÜZ MÜZİK", canvas.width / 2, 165);

            const ringTex = new THREE.CanvasTexture(canvas);
            ringTex.minFilter = THREE.LinearFilter;
            ringTex.magFilter = THREE.LinearFilter;

            /* HALKA ÇAPI HASSAS KÜÇÜLTÜLDÜ */
            const ringGeo = new THREE.CylinderGeometry(baseRadius + 0.25, baseRadius + 0.25, 0.85, isMobileDevice ? 32 : 64, 1, true);
            const ringMat = new THREE.MeshBasicMaterial({
                map: ringTex,
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: false
            });

            ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.rotation.z = 0.08;
            scene.add(ringMesh);
        }

        document.fonts.ready.then(() => { createOrbitRingText(); });

        let bassAngle = 0;
        const ambientGlowEl = document.getElementById('ambient-glow');
        let lastTime = performance.now();

        function animateGlobe(currentTime) {
            requestAnimationFrame(animateGlobe);

            const deltaTime = (currentTime - lastTime) / 1000; 
            lastTime = currentTime;

            if (isNaN(deltaTime) || deltaTime > 0.1) return;

            const globeSpeed = isPlayingState ? 0.5 : 0.15;
            const ringSpeed = isPlayingState ? 0.75 : 0.22;

            globeMesh.rotation.y += globeSpeed * deltaTime;
            if (ringMesh) ringMesh.rotation.y -= ringSpeed * deltaTime;
            ringBarsGroup.rotation.z += (isPlayingState ? 0.3 : 0.05) * deltaTime;

            if (isPlayingState) {
                bassAngle += 7.0 * deltaTime;
                
                /* TRAP BASS PUNCH & PULSE */
                const bassPower = Math.pow(Math.sin(bassAngle), 6);
                const bassScale = 1 + bassPower * 0.04;
                globeMesh.scale.set(bassScale, bassScale, bassScale);

                dirLight.intensity = 2.2 + bassPower * 3.5;

                const glowScale = 1 + Math.sin(bassAngle) * 0.12;
                ambientGlowEl.style.transform = `translate(-50%, -50%) scale(${glowScale})`;
                ambientGlowEl.style.opacity = (0.45 + bassPower * 0.55).toString();

                /* DİNAMİK EKOLAYZIR HALKASI ANİMASYONU */
                ringBarMeshes.forEach((bar, idx) => {
                    const rnd = Math.sin(bassAngle * 2 + idx) * 0.5 + 0.5;
                    const scaleY = 0.5 + rnd * 1.8 * (bassPower + 0.3);
                    bar.scale.set(1, scaleY, 1);
                    bar.material.opacity = 0.3 + rnd * 0.7;
                });

            } else {
                globeMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 10 * deltaTime);
                dirLight.intensity = 2.2;
                ambientGlowEl.style.transform = `translate(-50%, -50%) scale(1)`;
                ambientGlowEl.style.opacity = '0.4';

                ringBarMeshes.forEach((bar) => {
                    bar.scale.set(1, 0.4, 1);
                    bar.material.opacity = 0.2;
                });
            }

            renderer.render(scene, camera);
        }
        
        resizeThreeJS();
        requestAnimationFrame(animateGlobe);

        /* PARÇACIKLAR VE PIRLANTA ISILTILARI (DIAMOND ICE SPARKLES) */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function handleResize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            resizeThreeJS();
        }
        window.addEventListener('resize', handleResize);
        handleResize();

        class DiamondParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.35;
                this.speedY = (Math.random() - 0.5) * 0.35;
                this.opacity = Math.random() * 0.7 + 0.2;
                this.isSparkle = Math.random() > 0.65;
                this.pulseSpeed = Math.random() * 0.05 + 0.02;
            }
            update() {
                const speedMult = isPlayingState ? 1.8 : 1.0;
                this.x += this.speedX * speedMult;
                this.y += this.speedY * speedMult;
                this.opacity += Math.sin(Date.now() * this.pulseSpeed) * 0.03;
                if (this.opacity < 0.1) this.opacity = 0.1;
                if (this.opacity > 0.95) this.opacity = 0.95;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
                if (this.isSparkle) {
                    const len = this.size * (isPlayingState ? 3.2 : 2.2);
                    ctx.beginPath();
                    ctx.moveTo(this.x - len, this.y);
                    ctx.lineTo(this.x + len, this.y);
                    ctx.moveTo(this.x, this.y - len);
                    ctx.lineTo(this.x, this.y + len);
                    ctx.lineWidth = 0.9;
                    ctx.stroke();
                } else {
                    ctx.fillRect(this.x, this.y, this.size, this.size);
                }
            }
        }

        const particleCount = isMobileDevice ? 25 : 55;
        for (let i = 0; i < particleCount; i++) particlesArray.push(new DiamondParticle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* FIREBASE */
        const firebaseConfig = {
            apiKey: "AIzaSyBaTlb6V6e4FMLTYNXAPBgdzsgiclL8Qw8",
            authDomain: "easyfm-37b9e.firebaseapp.com",
            databaseURL: "https://easyfm-37b9e-default-rtdb.firebaseio.com",
            projectId: "easyfm-37b9e",
            storageBucket: "easyfm-37b9e.firebasestorage.app",
            messagingSenderId: "869244564550",
            appId: "1:869244564550:web:f0824148dbcae6b7024647"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const myConnectionsRef = db.ref('online_listeners');
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                const con = myConnectionsRef.push();
                con.onDisconnect().remove();
                con.set(true);
            }
        });
        myConnectionsRef.on('value', (snap) => {
            document.getElementById('listener-count').innerText = snap.numChildren();
        });

        /* VISUALIZER (ICE SPECTRUM BAR) */
        const vCanvas = document.getElementById('visualizer-canvas');
        const vCtx = vCanvas.getContext('2d');
        const numBars = isMobileDevice ? 28 : 52;
        let barHeights = new Array(numBars).fill(2);
        let peakHeights = new Array(numBars).fill(2);

        function drawVisualizer() {
            vCanvas.width = vCanvas.offsetWidth;
            vCanvas.height = vCanvas.offsetHeight;
            vCtx.clearRect(0, 0, vCanvas.width, vCanvas.height);

            const gap = 2;
            const barWidth = (vCanvas.width / numBars) - gap;

            for (let i = 0; i < numBars; i++) {
                if (isPlayingState) {
                    const centerFactor = 1 - Math.abs((i - numBars / 2) / (numBars / 2)) * 0.4;
                    const target = (Math.random() * (vCanvas.height - 2) + 2) * centerFactor;
                    barHeights[i] += (target - barHeights[i]) * 0.25;
                } else {
                    barHeights[i] += (2 - barHeights[i]) * 0.15;
                }

                if (barHeights[i] > peakHeights[i]) {
                    peakHeights[i] = barHeights[i];
                } else {
                    peakHeights[i] -= 0.35;
                }
                if (peakHeights[i] < 2) peakHeights[i] = 2;

                const x = i * (barWidth + gap);
                const y = vCanvas.height - barHeights[i];

                /* PARLAK ICE OLUŞUMU */
                const grad = vCtx.createLinearGradient(0, vCanvas.height, 0, 0);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.4)');
                grad.addColorStop(1, '#ffffff');

                vCtx.fillStyle = grad;
                vCtx.fillRect(x, y, barWidth, barHeights[i]);

                /* PEAK DOTS */
                vCtx.fillStyle = '#ffffff';
                vCtx.shadowColor = '#ffffff';
                vCtx.shadowBlur = 4;
                vCtx.fillRect(x, vCanvas.height - peakHeights[i] - 1, barWidth, 1);
                vCtx.shadowBlur = 0;
            }
            requestAnimationFrame(drawVisualizer);
        }
        drawVisualizer();
    </script>
</body>
