<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EA$Y FM | UNDERGROUND RADIO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Syne:wght@800;900&family=Montserrat:wght@400;700;900&family=Rubik+Glitch&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --accent-color: #ff003c;
            --glow-color: rgba(255, 0, 60, 0.4);
            --bg-glow: rgba(255, 0, 60, 0.08);
            --glitch-red: #ff0055;
            --glitch-cyan: #00ffff;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #030303;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden !important;
            touch-action: none;
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* CRT + GLITCH KATMANI */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            z-index: 50;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            opacity: 0.8;
        }

        /* PERİYODİK VHS GLITCH OVERLAY */
        .vhs-glitch-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 49;
            pointer-events: none;
            opacity: 0;
            background: repeating-linear-gradient(0deg, rgba(255,0,60,0.1) 0px, rgba(0,0,0,0.8) 2px, transparent 4px);
            mix-blend-mode: color-dodge;
        }

        .glitching .vhs-glitch-overlay {
            animation: vhsGlitchAnim 0.15s steps(2) infinite;
            opacity: 1;
        }

        @keyframes vhsGlitchAnim {
            0% { transform: translate(2px, -2px); filter: hue-rotate(90deg); }
            50% { transform: translate(-3px, 3px); filter: hue-rotate(180deg); }
            100% { transform: translate(1px, 1px); filter: hue-rotate(0deg); }
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        #lightning-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--accent-color);
            z-index: 2;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: overlay;
            will-change: opacity;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            height: 90vh;
            background: radial-gradient(circle, var(--glow-color) 0%, var(--bg-glow) 45%, rgba(0, 0, 0, 0) 75%);
            z-index: 3;
            pointer-events: none;
            transition: transform 0.08s ease-out, opacity 0.08s ease-out;
            will-change: transform, opacity;
            filter: blur(45px);
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 650px;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(16px + env(safe-area-inset-top)) 12px calc(8px + env(safe-area-inset-bottom)) 12px;
            gap: 6px;
            margin: 0 auto;
            box-sizing: border-box;
            transition: transform 0.05s ease, filter 0.05s ease;
        }

        .wrapper-shake {
            animation: trapBassShake 0.08s ease-in-out infinite alternate;
            filter: drop-shadow(-3px 0 0 var(--glitch-red)) drop-shadow(3px 0 0 var(--glitch-cyan));
        }

        @keyframes trapBassShake {
            0% { transform: scale(1) translate(0, 0) rotate(0deg); }
            50% { transform: scale(1.012) translate(-3px, 2px) rotate(-0.3deg); }
            100% { transform: scale(0.988) translate(3px, -2px) rotate(0.3deg); }
        }

        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 380px;
            height: clamp(160px, 26vh, 250px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
            flex-shrink: 0;
        }

        @media (min-width: 769px) {
            .logo-container {
                max-width: 600px;
                height: clamp(240px, 32vh, 340px);
            }
        }

        #globe-3d-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #globe-3d-container canvas {
            display: block;
            outline: none;
            filter: drop-shadow(0 0 25px var(--glow-color));
        }

        .status-bar {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            flex-shrink: 0;
        }

        .badge {
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 14px;
            border-radius: 4px; /* Keskin Opium Modu */
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
            white-space: nowrap;
            transition: all 0.1s ease;
            position: relative;
        }

        .badge::before {
            content: "";
            position: absolute;
            top: -1px; left: -1px;
            width: 4px; height: 4px;
            border-top: 2px solid var(--accent-color);
            border-left: 2px solid var(--accent-color);
        }

        .theme-selector {
            display: flex;
            gap: 6px;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 5px 8px;
            border-radius: 4px;
            backdrop-filter: blur(16px);
        }

        .theme-btn {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
        }

        .theme-btn:hover { transform: scale(1.3); }
        .theme-opium { background: #ff003c; box-shadow: 0 0 8px #ff003c; }
        .theme-slime { background: #39ff14; box-shadow: 0 0 8px #39ff14; }
        .theme-cyber { background: #00ffff; box-shadow: 0 0 8px #00ffff; }
        .theme-ice { background: #ffffff; box-shadow: 0 0 8px #ffffff; }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-color);
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.2; transform: scale(0.5); }
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 10, 10, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 5px 12px;
            border-radius: 4px;
            backdrop-filter: blur(16px);
        }

        .badge-bass-pulse {
            transform: scale(1.05);
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 20px var(--glow-color) !important;
        }

        .volume-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 45px;
            height: 3px;
            border-radius: 0;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 8px;
            height: 12px;
            border-radius: 0;
            background: var(--accent-color);
            box-shadow: 0 0 8px var(--accent-color);
        }

        /* VİDEO KUTUSU */
        .video-container {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 130px;
            max-height: 35vh;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.08s ease;
            background: #000;
            margin: 2px 0;
        }

        .video-container.playing-border {
            border-color: var(--accent-color);
            box-shadow: 0 0 35px var(--glow-color), inset 0 0 20px var(--glow-color);
        }

        #youtube-player {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none; pointer-events: auto;
        }

        .yt-shield-top-main { position: absolute; top: 0; left: 0; width: 100%; height: 82%; z-index: 15; background: transparent; }
        .yt-shield-bottom-left { position: absolute; bottom: 0; left: 0; width: 78%; height: 18%; z-index: 15; background: transparent; }
        .yt-shield-bottom-edge { position: absolute; bottom: 0; right: 0; width: 2%; height: 18%; z-index: 15; background: transparent; }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.96);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(15px);
            transition: opacity 0.4s ease;
        }

        .start-btn {
            background: var(--accent-color);
            color: #000;
            font-family: 'Syne', sans-serif;
            font-weight: 900;
            font-size: 11px;
            padding: 14px 36px;
            border: none;
            border-radius: 0;
            cursor: pointer;
            letter-spacing: 3px;
            box-shadow: 0 0 30px var(--accent-color);
            transition: all 0.2s ease;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0 100%);
        }

        .start-btn:hover {
            transform: scale(1.08) rotate(-1deg);
            box-shadow: 0 0 45px var(--accent-color);
        }

        /* NOW PLAYING CARD */
        .now-playing-card {
            width: 100%;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.9);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
            max-width: 58%;
        }

        .track-label {
            font-size: 7.5px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #777;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .track-title {
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
            letter-spacing: 0.5px;
        }

        /* YOL / MARQUEE METNİ */
        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            margin-top: 2px;
        }

        .marquee-text {
            display: inline-block;
            font-size: 7px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--accent-color);
            animation: marquee 12s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        .next-track {
            font-size: 8.5px;
            color: #888;
            text-align: right;
            max-width: 38%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .wave-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 10px;
            margin-left: 4px;
        }

        .wave-bar {
            width: 2px;
            background: var(--accent-color);
            box-shadow: 0 0 6px var(--accent-color);
            animation: waveAnim 0.5s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 40%; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 100%; animation-delay: 0.25s; }
        .wave-bar:nth-child(3) { height: 60%; animation-delay: 0.15s; }
        .wave-bar:nth-child(4) { height: 90%; animation-delay: 0.3s; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.15); }
            100% { transform: scaleY(1); }
        }

        #visualizer-canvas {
            width: 100%;
            height: 18px;
            min-height: 16px;
            margin: 0;
            flex-shrink: 0;
            display: block;
        }

        /* BPM SAYACI TRAP DOKUNUŞU */
        .bpm-counter {
            font-size: 8px;
            font-weight: 900;
            color: var(--accent-color);
            letter-spacing: 1px;
            margin-left: auto;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>

    <script>
        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

        /* TEMA KONTROLÜ (OPIUM / SLIME / CYBER / ICE) */
        let currentAccentColor = '#ff003c';
        const THEMES = {
            OPIUM: { accent: '#ff003c', glow: 'rgba(255, 0, 60, 0.4)', bgGlow: 'rgba(255, 0, 60, 0.08)' },
            SLIME: { accent: '#39ff14', glow: 'rgba(57, 255, 20, 0.35)', bgGlow: 'rgba(0, 255, 50, 0.08)' },
            CYBER: { accent: '#00ffff', glow: 'rgba(0, 255, 255, 0.35)', bgGlow: 'rgba(0, 255, 255, 0.08)' },
            ICE: { accent: '#ffffff', glow: 'rgba(255, 255, 255, 0.3)', bgGlow: 'rgba(200, 220, 255, 0.08)' }
        };

        function setRadioTheme(mode) {
            const t = THEMES[mode];
            currentAccentColor = t.accent;
            document.documentElement.style.setProperty('--accent-color', t.accent);
            document.documentElement.style.setProperty('--glow-color', t.glow);
            document.documentElement.style.setProperty('--bg-glow', t.bgGlow);

            if (ringBarMeshes) {
                const hexColor = parseInt(t.accent.replace('#', '0x'));
                ringBarMeshes.forEach(b => b.material.color.setHex(hexColor));
            }
        }

        let player = null;
        let isPlayerReady = false;
        let isPlayingState = false;
        let actualPlayerStatePlaying = false; 
        let currentLoadedVideoId = null;
        let syncCheckInterval = null;

        const baseSongList = [
            { id: '1IEg_3x35go', duration: 120, title: 'FRANCHISE' },
            { id: 'qAlF70MdfwU', duration: 207, title: 'OUT WEST' }, 
            { id: 'L_BpiSsIBFM', duration: 236, title: 'BROTHER STONE' }, 
            { id: 'cTGQrA5HHIU', duration: 204, title: 'WITH THAT' }, 
            { id: 'ftaXMKV3ffE', duration: 160, title: 'BACKR00MS' },
            { id: 'LPTlvQ1Zet0', duration: 188, title: 'RIC FLAIR DRIP' },
            { id: 'EfHNIPXTxy0', duration: 276, title: 'ZEZE' },

            { id: '81LJJFASh-I', duration: 185, title: '24/7' },
            { id: 'H6v_UYs01gA', duration: 167, title: 'PEMBE YALANLAR' },

            { id: '-nzUN-uHS2E', duration: 265, title: '1ST N 3RD' },

            { id: 'Ynlfvw2QgE4', duration: 135, title: 'İMDAT' },

            { id: 'ggzWJW38bfs', duration: 137, title: 'OG SPLIT' }
        ];

        const STREAM_START_TIME = 1700000000; 

        function getDeterministicShuffledList(array, seed) {
            let shuffled = [...array];
            let m = shuffled.length, t, i;
            let pseudoRandom = function() {
                let z = (seed += 0x6D2B79F5);
                z = Math.imul(z ^ (z >>> 15), z | 1);
                z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
                return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
            };

            while (m) {
                i = Math.floor(pseudoRandom() * m--);
                t = shuffled[m];
                shuffled[m] = shuffled[i];
                shuffled[i] = t;
            }
            return shuffled;
        }

        const songList = getDeterministicShuffledList(baseSongList, STREAM_START_TIME);
        const totalPlaylistDuration = songList.reduce((acc, song) => acc + song.duration, 0);

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const elapsedTime = (nowInSeconds - STREAM_START_TIME) % totalPlaylistDuration;
            let accumulatedTime = 0;
            for (let i = 0; i < songList.length; i++) {
                if (elapsedTime < accumulatedTime + songList[i].duration) {
                    return {
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += songList[i].duration;
            }
            return { songIndex: 0, seekTo: 0 };
        }

        function updateTrackLabels(currentIndex) {
            const currentSong = songList[currentIndex];
            const nextIndex = (currentIndex + 1) % songList.length;
            const nextSong = songList[nextIndex];

            document.getElementById('current-track-name').innerText = currentSong.title;
            document.getElementById('next-track-name').innerText = nextSong.title;
            
            // Rastgele Trap BPM Simülasyonu
            const bpms = [130, 140, 145, 150, 160, 172];
            document.getElementById('bpm-display').innerText = bpms[currentIndex % bpms.length] + ' BPM';
        }

        const initialState = getCurrentStreamState();
        updateTrackLabels(initialState.songIndex);

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];
            currentLoadedVideoId = targetSong.id;

            player = new YT.Player('youtube-player', {
                videoId: targetSong.id,
                playerVars: {
                    'autoplay': 0,
                    'controls': 1,
                    'rel': 0,
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'iv_load_policy': 3,
                    'fs': 0,
                    'start': Math.floor(state.seekTo)
                },
                events: {
                    'onReady': () => { 
                        isPlayerReady = true; 
                        if (document.activeElement) document.activeElement.blur();
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        const mainWrapper = document.getElementById('main-wrapper');

        function updateAudioVisualState() {
            const vBox = document.getElementById('video-box');
            const waveBars = document.getElementById('wave-bars');
            const vol = Number(volumeRange.value);

            if (vol === 0 || isMuted || !actualPlayerStatePlaying) {
                isPlayingState = false;
                vBox.classList.remove('playing-border');
                waveBars.style.opacity = '0';
                mainWrapper.classList.remove('wrapper-shake');
            } else {
                isPlayingState = true;
                vBox.classList.add('playing-border');
                waveBars.style.opacity = '1';
                mainWrapper.classList.add('wrapper-shake');
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                actualPlayerStatePlaying = true;
            } else {
                actualPlayerStatePlaying = false;
            }
            updateAudioVisualState();
        }

        function syncToLiveStream() {
            if (!isPlayerReady || !player) return;

            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];

            updateTrackLabels(state.songIndex);

            if (currentLoadedVideoId !== targetSong.id) {
                currentLoadedVideoId = targetSong.id;
                player.loadVideoById({
                    videoId: targetSong.id,
                    startSeconds: Math.floor(state.seekTo)
                });
                player.playVideo();
                return;
            }

            if (typeof player.getCurrentTime === 'function') {
                const currentTime = player.getCurrentTime();
                const timeDiff = Math.abs(currentTime - state.seekTo);
                
                if (timeDiff > 1.8) {
                    player.seekTo(state.seekTo, true);
                    player.playVideo();
                }
            }
        }

        function handleUserClick() {
            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);

            const startPlaying = () => {
                const state = getCurrentStreamState();
                const targetSong = songList[state.songIndex];

                updateTrackLabels(state.songIndex);
                currentLoadedVideoId = targetSong.id;

                if (typeof player.unMute === 'function') player.unMute();

                player.loadVideoById({
                    videoId: targetSong.id,
                    startSeconds: Math.floor(state.seekTo)
                });
                player.playVideo();

                if (syncCheckInterval) clearInterval(syncCheckInterval);
                syncCheckInterval = setInterval(syncToLiveStream, 1000);
            };

            if (isPlayerReady && player) {
                startPlaying();
            } else {
                const checkReady = setInterval(() => {
                    if (isPlayerReady && player) {
                        clearInterval(checkReady);
                        startPlaying();
                    }
                }, 100);
            }
        }

        document.getElementById('start-overlay').addEventListener('click', handleUserClick);
        document.getElementById('start-btn-el').addEventListener('click', (e) => {
            e.stopPropagation();
            handleUserClick();
        });

        const volumeRange = document.getElementById('volume-range');
        const muteBtn = document.getElementById('mute-btn');
        let isMuted = false;

        volumeRange.addEventListener('input', (e) => {
            const val = Number(e.target.value);
            
            if (player && typeof player.setVolume === 'function') {
                player.setVolume(val);
                if (val === 0) {
                    player.mute();
                    muteBtn.innerText = '🔇';
                    isMuted = true;
                } else {
                    if (isMuted || (typeof player.isMuted === 'function' && player.isMuted())) {
                        player.unMute();
                        isMuted = false;
                    }
                    muteBtn.innerText = '🔊';
                }
            }
            updateAudioVisualState();
        });

        muteBtn.addEventListener('click', () => {
            if (!player) return;
            if (isMuted) {
                player.unMute();
                muteBtn.innerText = '🔊';
                let currentVol = Number(volumeRange.value);
                if (currentVol === 0) {
                    currentVol = 100;
                    volumeRange.value = 100;
                }
                if (typeof player.setVolume === 'function') player.setVolume(currentVol);
                isMuted = false;
            } else {
                player.mute();
                muteBtn.innerText = '🔇';
                volumeRange.value = 0;
                isMuted = true;
            }
            updateAudioVisualState();
        });

        /* THREE.JS DÜNYA, DİKENLİ TEL & EFEKTLER */
        const globeContainer = document.getElementById('globe-3d-container');
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x030303, 0.15); // Trap Derinlik Sisi

        const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
        
        const isMobileDevice = window.innerWidth <= 768;
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: !isMobileDevice, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        globeContainer.appendChild(renderer.domElement);

        function resizeThreeJS() {
            const width = globeContainer.clientWidth;
            const height = globeContainer.clientHeight;
            if (width === 0 || height === 0) return;

            camera.aspect = width / height;

            if (window.innerWidth > 768) {
                camera.position.z = 5.2;
            } else if (window.innerHeight <= 650) {
                camera.position.z = 5.8;
            } else if (window.innerWidth <= 600) {
                camera.position.z = 5.5;
            } else {
                camera.position.z = 5.0;
            }

            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg');

        const baseRadius = 1.5;
        const segments = isMobileDevice ? 32 : 64;
        const geometry = new THREE.SphereGeometry(baseRadius, segments, segments);
        const material = new THREE.MeshStandardMaterial({
            map: earthTexture,
            roughness: 0.2,
            metalness: 0.7
        });
        const globeMesh = new THREE.Mesh(geometry, material);
        scene.add(globeMesh);

        /* 3D DİKENLİ TEL HALKASI (BARBED WIRE ORBIT) */
        const wireGroup = new THREE.Group();
        const wirePointsCount = 120;
        const wireRadius = baseRadius + 0.45;
        const wireGeo = new THREE.BufferGeometry();
        const wirePos = [];

        for(let i=0; i<=wirePointsCount; i++) {
            const angle = (i / wirePointsCount) * Math.PI * 2;
            const spike = (i % 3 === 0) ? 0.12 : 0; // Diken Çıkıntıları
            const r = wireRadius + spike;
            wirePos.push(Math.cos(angle)*r, Math.sin(angle)*r, (Math.sin(i)*0.05));
        }
        wireGeo.setAttribute('position', new THREE.Float32BufferAttribute(wirePos, 3));
        const wireMat = new THREE.LineBasicMaterial({ color: 0xff003c, linewidth: 2 });
        const barbedWire = new THREE.Line(wireGeo, wireMat);
        wireGroup.add(barbedWire);
        wireGroup.rotation.x = Math.PI / 3;
        scene.add(wireGroup);

        /* 3D EKOLAYZIR HALKASI */
        const ringBarsCount = isMobileDevice ? 36 : 64;
        const ringBarsGroup = new THREE.Group();
        const ringBarMeshes = [];

        for (let i = 0; i < ringBarsCount; i++) {
            const barGeo = new THREE.BoxGeometry(0.03, 0.35, 0.03);
            const barMat = new THREE.MeshBasicMaterial({ color: 0xff003c, transparent: true, opacity: 0.7 });
            const bar = new THREE.Mesh(barGeo, barMat);
            
            const angle = (i / ringBarsCount) * Math.PI * 2;
            const radius = baseRadius + 0.28;
            bar.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, -0.1);
            bar.rotation.z = angle - Math.PI / 2;
            
            ringBarsGroup.add(bar);
            ringBarMeshes.push(bar);
        }
        scene.add(ringBarsGroup);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xff003c, 3.5);
        dirLight.position.set(5, 4, 5);
        scene.add(dirLight);

        let ringMesh = null;

        function createOrbitRingText() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'transparent';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';

            ctx.font = '900 72px "Rubik Glitch", "Syne", sans-serif';
            ctx.fillText("EA$Y FM", canvas.width / 2, 85);

            ctx.font = '900 26px "Space Grotesk", sans-serif';
            ctx.fillText("HEAVY TRAP // VAMP RADIO", canvas.width / 2, 165);

            const ringTex = new THREE.CanvasTexture(canvas);
            ringTex.minFilter = THREE.LinearFilter;

            const ringGeo = new THREE.CylinderGeometry(baseRadius + 0.35, baseRadius + 0.35, 0.75, isMobileDevice ? 32 : 64, 1, true);
            const ringMat = new THREE.MeshBasicMaterial({
                map: ringTex,
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: false
            });

            ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.rotation.z = 0.08;
            scene.add(ringMesh);
        }

        document.fonts.ready.then(() => { createOrbitRingText(); });

        let bassAngle = 0;
        const ambientGlowEl = document.getElementById('ambient-glow');
        const lightningEl = document.getElementById('lightning-flash');
        const badgeLiveEl = document.getElementById('badge-live');
        const badgeListenerEl = document.getElementById('badge-listener');
        const themeSelectorEl = document.getElementById('theme-selector-box');
        const volumeBoxEl = document.getElementById('volume-box');
        const videoBoxEl = document.getElementById('video-box');
        let lastTime = performance.now();

        function animateGlobe(currentTime) {
            requestAnimationFrame(animateGlobe);

            const deltaTime = (currentTime - lastTime) / 1000; 
            lastTime = currentTime;

            if (isNaN(deltaTime) || deltaTime > 0.1) return;

            const globeSpeed = isPlayingState ? 0.6 : 0.15;
            const ringSpeed = isPlayingState ? 0.9 : 0.2;

            globeMesh.rotation.y += globeSpeed * deltaTime;
            wireGroup.rotation.z += (isPlayingState ? 1.2 : 0.2) * deltaTime;
            if (ringMesh) ringMesh.rotation.y -= ringSpeed * deltaTime;
            ringBarsGroup.rotation.z += (isPlayingState ? 0.4 : 0.05) * deltaTime;

            if (isPlayingState) {
                bassAngle += 8.5 * deltaTime;
                
                const bassPower = Math.pow(Math.sin(bassAngle), 6);
                const bassScale = 1 + bassPower * 0.08;
                globeMesh.scale.set(bassScale, bassScale, bassScale);

                // TRAP KAMERA YILAN EFEKTİ
                camera.rotation.z = Math.sin(bassAngle * 0.5) * 0.03;

                dirLight.intensity = 3.0 + bassPower * 6.0;

                const glowScale = 1 + Math.sin(bassAngle) * 0.2;
                ambientGlowEl.style.transform = `translate(-50%, -50%) scale(${glowScale})`;
                ambientGlowEl.style.opacity = (0.5 + bassPower * 0.5).toString();

                videoBoxEl.style.transform = `scale(${1 + bassPower * 0.02})`;

                // VHS Glitch Tetikleme
                if (Math.random() < 0.03) {
                    document.body.classList.add('glitching');
                    setTimeout(() => document.body.classList.remove('glitching'), 120);
                }

                if (bassPower > 0.6) {
                    badgeLiveEl.classList.add('badge-bass-pulse');
                    badgeListenerEl.classList.add('badge-bass-pulse');
                    themeSelectorEl.classList.add('badge-bass-pulse');
                    volumeBoxEl.classList.add('badge-bass-pulse');
                } else {
                    badgeLiveEl.classList.remove('badge-bass-pulse');
                    badgeListenerEl.classList.remove('badge-bass-pulse');
                    themeSelectorEl.classList.remove('badge-bass-pulse');
                    volumeBoxEl.classList.remove('badge-bass-pulse');
                }

                if (bassPower > 0.75) {
                    lightningEl.style.opacity = (Math.random() > 0.2 ? (0.7 + (bassPower - 0.75) * 1.8) : 0).toString();
                } else {
                    lightningEl.style.opacity = '0';
                }

                ringBarMeshes.forEach((bar, idx) => {
                    const rnd = Math.sin(bassAngle * 2.5 + idx) * 0.5 + 0.5;
                    const scaleY = 0.5 + rnd * 2.2 * (bassPower + 0.3);
                    bar.scale.set(1, scaleY, 1);
                    bar.material.opacity = 0.4 + rnd * 0.6;
                });

            } else {
                globeMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 10 * deltaTime);
                camera.rotation.z = 0;
                dirLight.intensity = 2.5;
                ambientGlowEl.style.transform = `translate(-50%, -50%) scale(1)`;
                ambientGlowEl.style.opacity = '0.3';
                lightningEl.style.opacity = '0';
                videoBoxEl.style.transform = `scale(1)`;
                badgeLiveEl.classList.remove('badge-bass-pulse');
                badgeListenerEl.classList.remove('badge-bass-pulse');
                themeSelectorEl.classList.remove('badge-bass-pulse');
                volumeBoxEl.classList.remove('badge-bass-pulse');

                ringBarMeshes.forEach((bar) => {
                    bar.scale.set(1, 0.3, 1);
                    bar.material.opacity = 0.2;
                });
            }

            renderer.render(scene, camera);
        }
        
        resizeThreeJS();
        requestAnimationFrame(animateGlobe);

        /* MATRIX TRAP DIGITAL RAIN PARÇACIKLARI */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function handleResize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            resizeThreeJS();
        }
        window.addEventListener('resize', handleResize);
        handleResize();

        class MatrixTrapParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * -canvas.height;
                this.size = Math.random() * 10 + 8;
                this.speedY = Math.random() * 3 + 1.5;
                this.char = ["$", "E", "A", "S", "Y", "666", "VAMP", "x_x"][Math.floor(Math.random()*8)];
                this.opacity = Math.random() * 0.7 + 0.2;
            }
            update() {
                const speedMult = isPlayingState ? 2.2 : 1.0;
                this.y += this.speedY * speedMult;
                if (this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = currentAccentColor;
                ctx.font = `${this.size}px 'Space Grotesk', monospace`;
                ctx.globalAlpha = this.opacity;
                ctx.fillText(this.char, this.x, this.y);
                ctx.globalAlpha = 1.0;
            }
        }

        const particleCount = isMobileDevice ? 25 : 50;
        for (let i = 0; i < particleCount; i++) particlesArray.push(new MatrixTrapParticle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* FIREBASE */
        const firebaseConfig = {
            apiKey: "AIzaSyBaTlb6V6e4FMLTYNXAPBgdzsgiclL8Qw8",
            authDomain: "easyfm-37b9e.firebaseapp.com",
            databaseURL: "https://easyfm-37b9e-default-rtdb.firebaseio.com",
            projectId: "easyfm-37b9e",
            storageBucket: "easyfm-37b9e.firebasestorage.app",
            messagingSenderId: "869244564550",
            appId: "1:869244564550:web:f0824148dbcae6b7024647"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const myConnectionsRef = db.ref('online_listeners');
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                const con = myConnectionsRef.push();
                con.onDisconnect().remove();
                con.set(true);
            }
        });
        myConnectionsRef.on('value', (snap) => {
            document.getElementById('listener-count').innerText = snap.numChildren();
        });

        /* VISUALIZER */
        const vCanvas = document.getElementById('visualizer-canvas');
        const vCtx = vCanvas.getContext('2d');
        const numBars = isMobileDevice ? 32 : 60;
        let barHeights = new Array(numBars).fill(2);
        let peakHeights = new Array(numBars).fill(2);

        function drawVisualizer() {
            vCanvas.width = vCanvas.offsetWidth;
            vCanvas.height = vCanvas.offsetHeight;
            vCtx.clearRect(0, 0, vCanvas.width, vCanvas.height);

            const gap = 2;
            const barWidth = (vCanvas.width / numBars) - gap;

            for (let i = 0; i < numBars; i++) {
                if (isPlayingState) {
                    const centerFactor = 1 - Math.abs((i - numBars / 2) / (numBars / 2)) * 0.3;
                    const target = (Math.random() * (vCanvas.height - 2) + 2) * centerFactor;
                    barHeights[i] += (target - barHeights[i]) * 0.3;
                } else {
                    barHeights[i] += (2 - barHeights[i]) * 0.15;
                }

                if (barHeights[i] > peakHeights[i]) {
                    peakHeights[i] = barHeights[i];
                } else {
                    peakHeights[i] -= 0.4;
                }
                if (peakHeights[i] < 2) peakHeights[i] = 2;

                const x = i * (barWidth + gap);
                const y = vCanvas.height - barHeights[i];

                const grad = vCtx.createLinearGradient(0, vCanvas.height, 0, 0);
                grad.addColorStop(0, 'rgba(0, 0, 0, 0.8)');
                grad.addColorStop(1, currentAccentColor);

                vCtx.fillStyle = grad;
                vCtx.fillRect(x, y, barWidth, barHeights[i]);

                vCtx.fillStyle = currentAccentColor;
                vCtx.shadowColor = currentAccentColor;
                vCtx.shadowBlur = 6;
                vCtx.fillRect(x, vCanvas.height - peakHeights[i] - 1, barWidth, 1.5);
                vCtx.shadowBlur = 0;
            }
            requestAnimationFrame(drawVisualizer);
        }
        drawVisualizer();
    </script>
</body>
</html>
