<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA$Y FM</title>
    <!-- Google Fonts üzerinden keskin ve güçlü hip-hop fontları -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Pırlanta / Kristal Işıltılı Siyah-Beyaz Logo */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 25px;
        }

        h1 {
            margin: 0;
            font-family: 'Anton', sans-serif;
            font-size: 64px;
            letter-spacing: 4px;
            text-transform: uppercase;
            
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #a6a6a6 25%, 
                #ffffff 50%, 
                #737373 75%, 
                #ffffff 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8),
                0 0 20px rgba(255, 255, 255, 0.4),
                0 0 30px rgba(255, 255, 255, 0.2);
                
            transform: skew(-4deg);
            animation: diamondShine 4s linear infinite;
        }

        @keyframes diamondShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 13px;
            color: #ffffff;
            letter-spacing: 5px;
            margin-top: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            opacity: 0.9;
        }

        /* Anlık İzleyici/Dinleyici Rozeti */
        .listener-badge {
            background-color: #111111;
            border: 1px solid #333333;
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
        }
        .live-dot {
            width: 9px;
            height: 9px;
            background-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #ffffff, 0 0 15px #ffffff;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .video-container {
            position: relative;
            width: 85%;
            max-width: 800px;
            padding-bottom: 47.8%; /* 16:9 oranı */
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.08);
            border: 1px solid #222222;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* BAŞLATMA OVERLAY EKRANI */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.95);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .start-btn {
            background: #ffffff;
            color: #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 16px;
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }

        /* SES KONTROL BUTONU ALANI */
        .controls {
            margin-top: 25px;
            margin-bottom: 40px; /* Tabandan ayrılması için alt boşluk eklendi */
            z-index: 20;
        }
        .mute-btn {
            background: #111;
            color: #fff;
            border: 1px solid #333;
            padding: 12px 24px;
            border-radius: 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            letter-spacing: 1px;
            transition: background 0.3s, border-color 0.3s;
        }
        .mute-btn:hover {
            background: #222;
            border-color: #555;
        }
    </style>

    <!-- Firebase SDK (Anlık Sayaç İçin) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- Pırlanta Işıltılı Siyah-Beyaz Logo Alanı -->
    <div class="logo-container">
        <h1>EA$Y FM</h1>
        <div class="subtitle">7/24 YÜZDE YÜZ MÜZİK</div>
    </div>

    <!-- İzleyici Sayacı Rozeti -->
    <div class="listener-badge">
        <span class="live-dot"></span>
        <span>Anlık Dinleyici: <strong id="listener-count" style="color: #ffffff;">0</strong></span>
    </div>

    <div class="video-container">
        <!-- Başlatma Kaplaması -->
        <div id="start-overlay" onclick="startRadio()">
            <button class="start-btn">CANLI YAYINA KATIL</button>
        </div>

        <!-- Tıklama ve durdurmayı engelleyen şeffaf katman -->
        <div class="video-overlay"></div>
        <div id="player"></div>
    </div>

    <!-- Ses Butonu -->
    <div class="controls">
        <button id="mute-toggle" class="mute-btn" onclick="toggleMute()">SESİ KAPAT</button>
    </div>

    <script>
        // -------------------------------------------------------------
        // 1. FIREBASE KURULUMU VE ANLIK İZLEYİCİ TAKİP SİSTEMİ
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyBaTlb6V6e4FMLTYNXAPBgdzsgiclL8Qw8",
            authDomain: "easyfm-37b9e.firebaseapp.com",
            databaseURL: "https://easyfm-37b9e-default-rtdb.firebaseio.com",
            projectId: "easyfm-37b9e",
            storageBucket: "easyfm-37b9e.firebasestorage.app",
            messagingSenderId: "869244564550",
            appId: "1:869244564550:web:f0824148dbcae6b7024647",
            measurementId: "G-7WEFWTKBC7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const myConnectionsRef = db.ref('online_listeners');
        const connectedRef = db.ref('.info/connected');

        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                const con = myConnectionsRef.push();
                con.onDisconnect().remove();
                con.set(true);
            }
        });

        myConnectionsRef.on('value', (snap) => {
            const count = snap.numChildren();
            document.getElementById('listener-count').innerText = count;
        });
        
        // -------------------------------------------------------------
        // 2. CANLI SENKRONİZASYON VE KİLİTLENME ÖNLEYİCİ SİSTEM
        // -------------------------------------------------------------
        
        const songList = [
            { id: 'qAlF70MdfwU', duration: 207 }, 
            { id: 'L_BpiSsIBFM', duration: 236 }, 
            { id: 'cTGQrA5HHIU', duration: 204 }, 
            { id: 'ftaXMKV3ffE', duration: 160 }
        ];

        const STREAM_START_TIME = 1700000000; 
        const totalPlaylistDuration = songList.reduce((acc, song) => acc + song.duration, 0);

        let player;
        let currentLoadedVideoId = null;
        let isChangingSong = false;
        let isStarted = false;

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const elapsedTime = (nowInSeconds - STREAM_START_TIME) % totalPlaylistDuration;

            let accumulatedTime = 0;
            for (let i = 0; i < songList.length; i++) {
                if (elapsedTime < accumulatedTime + songList[i].duration) {
                    return {
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += songList[i].duration;
            }
            return { songIndex: 0, seekTo: 0 };
        }

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            const state = getCurrentStreamState();
            currentLoadedVideoId = songList[state.songIndex].id;

            player = new YT.Player('player', {
                videoId: currentLoadedVideoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'disablekb': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'loop': 0
                },
                events: {
                    'onReady': (event) => {
                        event.target.seekTo(state.seekTo, true);
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function startRadio() {
            if (!player) return;
            const state = getCurrentStreamState();
            player.seekTo(state.seekTo, true);
            player.playVideo();
            player.unMute();
            
            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);
            isStarted = true;
        }

        function toggleMute() {
            if (!player) return;
            const btn = document.getElementById('mute-toggle');
            if (player.isMuted()) {
                player.unMute();
                btn.innerText = "SESİ KAPAT";
            } else {
                player.mute();
                btn.innerText = "SESİ AÇ";
            }
        }

        function syncToCurrentStream() {
            if (!player || isChangingSong || !isStarted) return;

            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];

            if (currentLoadedVideoId !== targetSong.id) {
                isChangingSong = true;
                currentLoadedVideoId = targetSong.id;
                
                player.loadVideoById({
                    videoId: targetSong.id,
                    startSeconds: state.seekTo
                });
                
                setTimeout(() => { isChangingSong = false; }, 1500);
            } else {
                const currentTime = player.getCurrentTime ? player.getCurrentTime() : 0;
                if (Math.abs(currentTime - state.seekTo) > 3) {
                    player.seekTo(state.seekTo, true);
                }
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                syncToCurrentStream();
            }
        }

        setInterval(() => {
            syncToCurrentStream();
        }, 5000);
    </script>
</body>
</html>
