<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA$Y FM</title>
    <!-- Google Fonts: Keskin, lüks ve güçlü hip-hop fontları -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            user-select: none;
        }

        /* HAREKETLİ KRİSTAL PARÇACIKLI ARKA PLAN CANVAS */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* DİNAMİK ARKA PLAN RADİAL ISILTI */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85vw;
            height: 85vh;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.05) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.5s ease, transform 0.2s ease;
        }

        /* SAĞ ÜST: DIAMOND GLOW TOGGLE BUTONU */
        .glow-toggle-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(17, 17, 17, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .glow-toggle-label {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #fff;
            text-transform: uppercase;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #222;
            transition: .4s;
            border-radius: 20px;
            border: 1px solid #444;
        }

        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 0 8px #fff;
        }

        input:checked + .slider-toggle {
            background-color: #ffffff;
        }

        input:checked + .slider-toggle:before {
            transform: translateX(15px);
            background-color: #000;
        }

        /* EXTRA DIAMOND GLOW MODU AKTİFKEN */
        body.diamond-mode-active .ambient-glow {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0.03) 50%, rgba(0, 0, 0, 0) 75%);
        }

        body.diamond-mode-active h1 {
            text-shadow: 
                0 0 20px rgba(255, 255, 255, 1),
                0 0 40px rgba(255, 255, 255, 0.8),
                0 0 60px rgba(255, 255, 255, 0.5);
        }

        body.diamond-mode-active .video-container {
            box-shadow: 0 0 45px rgba(255, 255, 255, 0.3), 0 10px 50px rgba(0, 0, 0, 0.9);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
        }

        /* LOGO ALANI */
        .logo-container {
            text-align: center;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        h1 {
            margin: 0;
            font-family: 'Anton', sans-serif;
            font-size: 72px;
            letter-spacing: 5px;
            text-transform: uppercase;
            
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #888888 25%, 
                #ffffff 50%, 
                #555555 75%, 
                #ffffff 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            text-shadow: 
                0 0 12px rgba(255, 255, 255, 0.8),
                0 0 24px rgba(255, 255, 255, 0.4);
                
            transform: skew(-4deg);
            animation: diamondShine 4s linear infinite;
            transition: text-shadow 0.3s;
        }

        @keyframes diamondShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 13px;
            color: #ffffff;
            letter-spacing: 6px;
            margin-top: 6px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            opacity: 0.95;
        }

        /* CANLI İZLEYİCİ & KALİTE ROZETLERİ */
        .stats-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .listener-badge, .hq-badge {
            background: rgba(17, 17, 17, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 7px 18px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
            text-transform: uppercase;
        }

        .hq-badge {
            color: #aaa;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #ffffff, 0 0 15px #ffffff;
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .video-container {
            position: relative;
            width: 85%;
            max-width: 820px;
            padding-bottom: 47.8%;
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 45px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: box-shadow 0.4s, border-color 0.4s;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            pointer-events: none; /* Doğrudan YouTube müdahalesini engeller */
        }
        
        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            background: transparent;
        }

        /* BAŞLATMA OVERLAY EKRANI */
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 5, 0.98);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .start-btn {
            background: #ffffff;
            color: #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 15px;
            padding: 14px 36px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.9);
        }

        /* SES SPEKTRUMU / VISUALIZER BAR */
        .visualizer-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
            height: 28px;
            margin-top: 16px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .visualizer-container.active {
            opacity: 1;
        }

        .v-bar {
            width: 4px;
            background: linear-gradient(to top, #444, #fff);
            border-radius: 3px;
            height: 10%;
            transition: height 0.1s ease;
        }

        /* SES KONTROL PANELİ */
        .controls {
            margin-top: 14px;
            margin-bottom: 14px;
            z-index: 20;
        }

        .volume-control-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(17, 17, 17, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            padding: 10px 22px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
        }

        .mute-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: transform 0.2s;
        }

        .mute-btn:hover {
            transform: scale(1.15);
        }

        .mute-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 130px;
            height: 5px;
            border-radius: 5px;
            background: #333333;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.9);
            transition: transform 0.15s;
        }

        .volume-slider::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        .volume-percentage {
            font-size: 11px;
            font-weight: 800;
            color: #aaa;
            min-width: 38px;
            text-align: right;
        }

        /* YENİLENMİŞ KAYAN ŞARKI GÖSTERGESİ (MARQUEE NOW PLAYING) */
        .now-playing-wrapper {
            width: 85%;
            max-width: 600px;
            background: rgba(15, 15, 15, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .now-playing-label {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #888;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .marquee-container {
            flex-grow: 1;
            overflow: hidden;
            position: relative;
            white-space: nowrap;
        }

        .marquee-content {
            display: inline-block;
            font-size: 12px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            animation: marquee 14s linear infinite;
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* MOBİL UYUM */
        @media (max-width: 768px) {
            h1 { font-size: 46px; letter-spacing: 3px; }
            .subtitle { font-size: 10px; letter-spacing: 4px; }
            .video-container { width: 94%; padding-bottom: 52.8%; }
            .volume-slider { width: 90px; }
            .now-playing-wrapper { width: 92%; }
        }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- DIAMOND GLOW TOGGLE -->

    <!-- HAREKETLİ KRİSTAL ARKA PLAN -->
    <canvas id="bg-canvas"></canvas>
    <div class="ambient-glow" id="ambient-glow"></div>

    <div class="main-wrapper">
        <!-- LOGO ALANI -->

        <div class="visualizer-container" id="visualizer">

            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
        </div>

        <div class="controls">

    <script>
        // DIAMOND GLOW MODU
        function toggleDiamondGlow(checkbox) {
            if (checkbox.checked) {
                document.body.classList.add('diamond-mode-active');
            } else {
                document.body.classList.remove('diamond-mode-active');
            }
        }

        // KRİSTAL PARÇACIK ANİMASYONU
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        const numberOfParticles = 45;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.7 + 0.2;
                this.pulseSpeed = Math.random() * 0.02 + 0.005;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;

                this.opacity += Math.sin(Date.now() * this.pulseSpeed) * 0.01;
                if (this.opacity < 0.1) this.opacity = 0.1;
                if (this.opacity > 0.9) this.opacity = 0.9;
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#ffffff";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();

        // DİNAMİK VISUALIZER & RADİAL PULSE EFEKTİ
        const vBars = document.querySelectorAll('.v-bar');
        const ambientGlow = document.getElementById('ambient-glow');

        function animateVisualizer() {
            if (isStarted && player && player.getPlayerState() === YT.PlayerState.PLAYING && !player.isMuted()) {
                let sum = 0;
                vBars.forEach(bar => {
                    const randomHeight = Math.floor(Math.random() * 85) + 15;
                    bar.style.height = randomHeight + '%';
                    sum += randomHeight;
                });
                
                // Arka plan ışıltısını ritme göre hafifçe büyüt
                const avg = sum / vBars.length;
                const scale = 1 + (avg / 500);
                ambientGlow.style.transform = `translate(-50%, -50%) scale(${scale})`;
            } else {
                vBars.forEach(bar => { bar.style.height = '10%'; });
                ambientGlow.style.transform = `translate(-50%, -50%) scale(1)`;
            }
        }
        setInterval(animateVisualizer, 120);

        // FIREBASE İZLEYİCİ TAKİBİ
        const firebaseConfig = {
            apiKey: "AIzaSyBaTlb6V6e4FMLTYNXAPBgdzsgiclL8Qw8",
            authDomain: "easyfm-37b9e.firebaseapp.com",
            databaseURL: "https://easyfm-37b9e-default-rtdb.firebaseio.com",
            projectId: "easyfm-37b9e",
            storageBucket: "easyfm-37b9e.firebasestorage.app",
            messagingSenderId: "869244564550",
            appId: "1:869244564550:web:f0824148dbcae6b7024647",
            measurementId: "G-7WEFWTKBC7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const myConnectionsRef = db.ref('online_listeners');
        const connectedRef = db.ref('.info/connected');

        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                const con = myConnectionsRef.push();
                con.onDisconnect().remove();
                con.set(true);
            }
        });

        myConnectionsRef.on('value', (snap) => {
            const count = snap.numChildren();
            document.getElementById('listener-count').innerText = count;
        });

        // ÇALMA LİSTESİ VE MÜKEMMEL SENKRONİZASYON SİSTEMİ
        const songList = [
            { id: '1IEg_3x35go', duration: 120, title: 'HIP-HOP HIT BANGER' },
            { id: 'qAlF70MdfwU', duration: 207, title: 'HEAVY TRAP BEATS' }, 
            { id: 'L_BpiSsIBFM', duration: 236, title: 'STREET MENACE ANTHEM' }, 
            { id: 'cTGQrA5HHIU', duration: 204, title: 'CERTIFIED CLUB BANGER' }, 
            { id: 'ftaXMKV3ffE', duration: 160, title: 'DRILL VIBES 24/7' },
            { id: 'LPTlvQ1Zet0', duration: 188, title: 'SLIME ENERGY' },
            { id: 'EfHNIPXTxy0', duration: 276, title: 'MIDNIGHT TRAP SOUNDS' }
        ];

        const STREAM_START_TIME = 1700000000; 
        const totalPlaylistDuration = songList.reduce((acc, song) => acc + song.duration, 0);

        let player;
        let currentLoadedVideoId = null;
        let isChangingSong = false;
        let isStarted = false;
        let lastVolumeLevel = 100;

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const elapsedTime = (nowInSeconds - STREAM_START_TIME) % totalPlaylistDuration;

            let accumulatedTime = 0;
            for (let i = 0; i < songList.length; i++) {
                if (elapsedTime < accumulatedTime + songList[i].duration) {
                    return {
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += songList[i].duration;
            }
            return { songIndex: 0, seekTo: 0 };
        }

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            const state = getCurrentStreamState();
            currentLoadedVideoId = songList[state.songIndex].id;
            updateNowPlaying(state.songIndex);

            player = new YT.Player('player', {
                videoId: currentLoadedVideoId,
                playerVars: {
                    'autoplay': 0,
                    'controls': 0,
                    'disablekb': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'loop': 0,
                    'playsinline': 1
                },
                events: {
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function updateNowPlaying(index) {
            const titleElem = document.getElementById('now-playing-text');
            if (songList[index] && songList[index].title) {
                titleElem.innerText = songList[index].title;
            }
        }

        function startRadio() {
            if (!player) return;
            const state = getCurrentStreamState();
            
            player.seekTo(state.seekTo, true);
            player.playVideo();
            player.unMute();
            player.setVolume(100);
            
            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);
            isStarted = true;

            document.getElementById('visualizer').classList.add('active');
        }

        // SES AYARLARI
        const volumeIconHigh = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
        const volumeIconMute = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';

        function changeVolume(val) {
            if (!player) return;
            const volumeText = document.getElementById('volume-text');
            const icon = document.getElementById('volume-icon');

            player.setVolume(val);
            volumeText.innerText = val + '%';

            if (val == 0) {
                player.mute();
                icon.innerHTML = volumeIconMute;
            } else {
                if (player.isMuted()) player.unMute();
                icon.innerHTML = volumeIconHigh;
                lastVolumeLevel = val;
            }
        }

        function toggleMute() {
            if (!player) return;
            const slider = document.getElementById('volume-slider');
            const icon = document.getElementById('volume-icon');

            if (player.isMuted() || slider.value == 0) {
                const targetVolume = lastVolumeLevel > 0 ? lastVolumeLevel : 50;
                player.unMute();
                player.setVolume(targetVolume);
                slider.value = targetVolume;
                document.getElementById('volume-text').innerText = targetVolume + '%';
                icon.innerHTML = volumeIconHigh;
            } else {
                lastVolumeLevel = slider.value;
                player.mute();
                slider.value = 0;
                document.getElementById('volume-text').innerText = '0%';
                icon.innerHTML = volumeIconMute;
            }
        }

        // CANLI SENKRONİZASYON VE DURAKLATMA / SAPMA ENGELLEYİCİ
        function syncToCurrentStream() {
            if (!player || isChangingSong || !isStarted) return;

            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];

            updateNowPlaying(state.songIndex);

            if (currentLoadedVideoId !== targetSong.id) {
                isChangingSong = true;
                currentLoadedVideoId = targetSong.id;
                
                player.loadVideoById({
                    videoId: targetSong.id,
                    startSeconds: state.seekTo
                });
                
                setTimeout(() => { isChangingSong = false; }, 1800);
            } else {
                const currentTime = player.getCurrentTime ? player.getCurrentTime() : 0;
                // 3 saniyeden fazla sapma varsa zorla senkronize et
                if (Math.abs(currentTime - state.seekTo) > 3) {
                    player.seekTo(state.seekTo, true);
                }
            }
        }

        function onPlayerStateChange(event) {
            // Şarkı bittiğinde VEYA kullanıcı duraklatmaya çalıştığında otomatik canlı senkronizasyonla oynatmaya devam et
            if (event.data === YT.PlayerState.ENDED || (event.data === YT.PlayerState.PAUSED && isStarted)) {
                syncToCurrentStream();
                if (isStarted) {
                    player.playVideo();
                }
            }
        }

        // Her 4 saniyede bir kesintisiz canlıyayın kontrolü yap
        setInterval(syncToCurrentStream, 4000);
    </script>
