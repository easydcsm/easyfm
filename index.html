<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA$Y FM</title>
    <!-- Google Fonts üzerinden Hip-Hop/Sokak tarzına uygun kalın font (Anton) eklendi -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Permanent+Marker&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            background-color: #0b0b0b;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Hip-Hop Tarzı Cool Logo / Başlık */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-family: 'Anton', sans-serif;
            font-size: 52px;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 30%, #ffcc00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 3px 3px 0px #ff2a2a, 6px 6px 20px rgba(255, 42, 42, 0.4);
            transform: skew(-5deg);
        }

        .subtitle {
            font-family: 'Permanent Marker', cursive;
            font-size: 14px;
            color: #888;
            letter-spacing: 4px;
            margin-top: 5px;
            transform: skew(-5deg);
        }

        /* Anlık İzleyici/Dinleyici Rozeti */
        .listener-badge {
            background-color: #161616;
            border: 1px solid #282828;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
        }
        .live-dot {
            width: 10px;
            height: 10px;
            background-color: #ff2a2a;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #ff2a2a;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        .video-container {
            position: relative;
            width: 85%;
            max-width: 800px;
            padding-bottom: 47.8%; /* 16:9 oranı */
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
            border: 2px solid #222;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>

    <!-- Firebase SDK (Anlık Sayaç İçin) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- Şaşalı Hip-Hop Logo Alanı -->
    <div class="logo-container">
        <h1>EA$Y FM</h1>
        <div class="subtitle">24/7 UNDERGROUND VIBES</div>
    </div>

    <!-- İzleyici Sayacı Rozeti -->
    <div class="listener-badge">
        <span class="live-dot"></span>
        <span>Anlık Dinleyici: <strong id="listener-count" style="color: #4cd137;">0</strong></span>
    </div>

    <div class="video-container">
        <div id="player"></div>
    </div>

    <script>
        // -------------------------------------------------------------
        // 1. FIREBASE KURULUMU VE ANLIK İZLEYİCİ TAKİP SİSTEMİ
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyBaTlb6V6e4FMLTYNXAPBgdzsgiclL8Qw8",
            authDomain: "easyfm-37b9e.firebaseapp.com",
            databaseURL: "https://easyfm-37b9e-default-rtdb.firebaseio.com",
            projectId: "easyfm-37b9e",
            storageBucket: "easyfm-37b9e.firebasestorage.app",
            messagingSenderId: "869244564550",
            appId: "1:869244564550:web:f0824148dbcae6b7024647",
            measurementId: "G-7WEFWTKBC7"
        };

        // Firebase'i başlat
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Anlık bağlantı referansları
        const myConnectionsRef = db.ref('online_listeners');
        const connectedRef = db.ref('.info/connected');

        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                const con = myConnectionsRef.push();
                con.onDisconnect().remove();
                con.set(true);
            }
        });

        myConnectionsRef.on('value', (snap) => {
            const count = snap.numChildren();
            document.getElementById('listener-count').innerText = count;
        });


        // -------------------------------------------------------------
        // 2. YOUTUBE OYNATICI VE ŞARKI LİSTESİ KODLARI
        // -------------------------------------------------------------
        const songList = [
            'qAlF70MdfwU', // 1. Şarkı ID
            'L_BpiSsIBFM', // 2. Şarkı ID
        ];

        let currentSongIndex = 0;
        let player;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: songList[currentSongIndex],
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                currentSongIndex = (currentSongIndex + 1) % songList.length;
                player.loadVideoById(songList[currentSongIndex]);
            }
        }
    </script>
</body>
</html>
