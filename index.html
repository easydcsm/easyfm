<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canlı Yayın Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #0d0f17;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: #161926;
      border: 1px solid #2a2e45;
      border-radius: 20px;
      padding: 32px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* 1. DÜNYA İKONU: En yukarıda ve altında belirgin boşluk var */
    .world-container {
      margin-top: 0;
      margin-bottom: 28px; /* Dünya ile altındaki yazı arasındaki boşluk */
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(34, 197, 94, 0.1);
      border-radius: 50%;
      padding: 16px;
      animation: pulse 2s infinite;
    }

    .world-icon {
      width: 48px;
      height: 48px;
      color: #22c55e;
    }

    /* 2. CANLI YAYIN ROZETİ */
    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #ef4444;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 1px;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 12px; /* Canlı yayın ile dinleyici yazısı arası boşluk */
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #ef4444;
      border-radius: 50%;
    }

    /* 3. DİNLEYİCİ BİLGİSİ */
    .listener-info {
      font-size: 18px;
      font-weight: 600;
      color: #e2e8f0;
    }

    .listener-count {
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
      70% { box-shadow: 0 0 0 12px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- En yukarı taşınan ve alt boşluğu artırılan Dünya İkonu -->
    <div class="world-container">
      <svg class="world-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
      </svg>
    </div>

    <!-- Canlı Yayın Rozeti -->
    <div class="live-badge">
      <span class="live-dot"></span>
      CANLI YAYIN
    </div>

    <!-- Dinleyici Sayısı -->
    <div class="listener-info">
      <span class="listener-count">1,420</span> Dinleyici
    </div>
  </div>

</body>
</html>
