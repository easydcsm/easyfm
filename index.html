<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA$Y FM</title>
    <!-- Google Fonts üzerinden keskin ve güçlü hip-hop fontları -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Pırlanta / Kristal Işıltılı Siyah-Beyaz Logo */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            margin: 0;
            font-family: 'Anton', sans-serif;
            font-size: 64px;
            letter-spacing: 4px;
            text-transform: uppercase;
            
            /* Pırlanta Parlaklığı Efekti (Metalik Gümüş-Beyaz Geçiş) */
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #a6a6a6 25%, 
                #ffffff 50%, 
                #737373 75%, 
                #ffffff 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Elmas Işıltısı ve Gölge (Glow/Shine Effect) */
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8),
                0 0 20px rgba(255, 255, 255, 0.4),
                0 0 30px rgba(255, 255, 255, 0.2);
                
            transform: skew(-4deg);
            animation: diamondShine 4s linear infinite;
        }

        /* Pırlanta üzerindeki ışık süzülmesi animasyonu */
        @keyframes diamondShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 13px;
            color: #ffffff;
            letter-spacing: 5px;
            margin-top: 8px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
            opacity: 0.9;
        }

        /* Anlık İzleyici/Dinleyici Rozeti (Siyah-Beyaz Temalı) */
        .listener-badge {
            background-color: #111111;
            border: 1px solid #333333;
            padding: 8px 22px;
            border-radius: 30px;
            font-size: 13px;
            letter-spacing: 1px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
        }
        .live-dot {
            width: 9px;
            height: 9px;
            background-color: #ffffff;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #ffffff, 0 0 15px #ffffff;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .video-container {
            position: relative;
            width: 85%;
            max-width: 800px;
            padding-bottom: 47.8%; /* 16:9 oranı */
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.08);
            border: 1px solid #222222;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>

    <!-- Firebase SDK (Anlık Sayaç İçin) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- Pırlanta Işıltılı Siyah-Beyaz Logo Alanı -->
    <div class="logo-container">
        <h1>EA$Y FM</h1>
        <div class="subtitle">7/24 YÜZDE YÜZ MÜZİK</div>
    </div>

    <!-- İzleyici Sayacı Rozeti -->
    <div class="listener-badge">
        <span class="live-dot"></span>
        <span>Anlık Dinleyici: <strong id="listener-count" style="color: #ffffff;">0</strong></span>
    </div>

    <div class="video-container">
        <div id="player"></div>
    </div>

    <script>
        // -------------------------------------------------------------
        // 1. FIREBASE KURULUMU VE ANLIK İZLEYİCİ TAKİP SİSTEMİ
        // -------------------------------------------------------------
        const firebaseConfig = {
            apiKey: "AIzaSyBaTlb6V6e4FMLTYNXAPBgdzsgiclL8Qw8",
            authDomain: "easyfm-37b9e.firebaseapp.com",
            databaseURL: "https://easyfm-37b9e-default-rtdb.firebaseio.com",
            projectId: "easyfm-37b9e",
            storageBucket: "easyfm-37b9e.firebasestorage.app",
            messagingSenderId: "869244564550",
            appId: "1:869244564550:web:f0824148dbcae6b7024647",
            measurementId: "G-7WEFWTKBC7"
        };

        // Firebase'i başlat
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Anlık bağlantı referansları
        const myConnectionsRef = db.ref('online_listeners');
        const connectedRef = db.ref('.info/connected');

        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                const con = myConnectionsRef.push();
                con.onDisconnect().remove();
                con.set(true);
            }
        });

        myConnectionsRef.on('value', (snap) => {
            const count = snap.numChildren();
            document.getElementById('listener-count').innerText = count;
        });
        
        // -------------------------------------------------------------
        // 2. YOUTUBE OYNATICI VE ŞARKI LİSTESİ KODLARI
        // -------------------------------------------------------------
        const songList = [
            'qAlF70MdfwU', // 1. Şarkı ID
            'L_BpiSsIBFM', // 2. Şarkı ID
            'cTGQrA5HHIU', // 3. Şarkı ID
            'ftaXMKV3ffE', // 4. Şarkı ID
        ];

        let currentSongIndex = 0;
        let player;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: songList[currentSongIndex],
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo();
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                currentSongIndex = (currentSongIndex + 1) % songList.length;
                player.loadVideoById(songList[currentSongIndex]);
            }
        }
    </script>
</body>
</html>
