<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EA$Y FM | CANLI</title>
    <!-- Google Fonts: Anton & Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #030303;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            scroll-behavior: auto !important;
            overscroll-behavior-y: none;
        }

        body {
            min-height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        /* ARKA PLAN CANVAS */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90vw;
            height: 90vh;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(200, 200, 200, 0.03) 45%, rgba(0, 0, 0, 0) 75%);
            z-index: 2;
            pointer-events: none;
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 15px 30px 15px;
            gap: 14px;
            margin: 0 auto;
        }

        /* LOGO & 3D DÜNYA ALANI */
        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
        }

        /* PIRLANTA PATLAMA HALKASI */
        .blast-wave {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 1);
            box-shadow: 0 0 100px rgba(255, 255, 255, 1), inset 0 0 60px rgba(255, 255, 255, 0.9);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }

        .blast-active {
            animation: fastExplode 0.45s cubic-bezier(0.0, 0.9, 0.2, 1) forwards;
        }

        @keyframes fastExplode {
            0% {
                transform: translate(-50%, -50%) scale(0.6);
                opacity: 1;
                border-width: 12px;
            }
            100% {
                transform: translate(-50%, -50%) scale(2.8);
                opacity: 0;
                border-width: 1px;
            }
        }

        #globe-3d-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 0 25px rgba(255, 255, 255, 0.2));
        }

        #globe-3d-container canvas {
            display: block;
            outline: none;
        }

        /* BADGES BAR */
        .status-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 2px;
            margin-bottom: 2px;
        }

        .badge {
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.9), rgba(10, 10, 10, 0.9));
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* Gümüş Işıltı Animasyonu */
        .badge::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
            transform: rotate(30deg);
            animation: shine 4s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(30deg); }
            20% { transform: translateX(100%) rotate(30deg); }
            100% { transform: translateX(100%) rotate(30deg); }
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 12px #ffffff;
            animation: pulse 1.4s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); box-shadow: 0 0 12px #ffffff; }
            50% { opacity: 0.2; transform: scale(0.7); box-shadow: 0 0 2px #ffffff; }
            100% { opacity: 1; transform: scale(1); box-shadow: 0 0 12px #ffffff; }
        }

        /* VİDEO ÇERÇEVESİ VE OVERLAY */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 48%;
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            transition: border-color 0.5s, box-shadow 0.5s;
            background: #000;
            margin: 0;
        }

        .video-container.playing-border {
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9), 0 0 40px rgba(255, 255, 255, 0.2);
        }

        #youtube-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(20, 20, 20, 0.95) 0%, rgba(0, 0, 0, 0.98) 100%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        .start-btn {
            background: #ffffff;
            color: #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 13px;
            padding: 13px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.7);
            transition: transform 0.3s, box-shadow 0.3s, background-color 0.3s;
            position: relative;
            overflow: hidden;
        }

        .start-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 50px rgba(255, 255, 255, 1);
            background-color: #f0f0f0;
        }

        /* NOW PLAYING CARD */
        .now-playing-card {
            width: 100%;
            background: linear-gradient(135deg, rgba(25, 25, 25, 0.85), rgba(10, 10, 10, 0.9));
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            margin: 0;
            position: relative;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
        }

        .track-label {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 2.5px;
            color: #aaa;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .track-title {
            font-size: 14px;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .next-track {
            font-size: 10px;
            color: #bbb;
            text-align: right;
            max-width: 42%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #visualizer-canvas {
            width: 100%;
            height: 24px;
            margin: 0;
            transition: opacity 1s ease;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
        }

        /* MOBİL ÖZEL AYARLAR */
        @media (max-width: 600px) {
            .main-wrapper {
                padding: 5px 12px 25px 12px;
                gap: 10px;
            }

            .logo-container {
                height: 195px;
                width: 100%;
            }

            .video-container {
                padding-bottom: 53%;
            }

            .now-playing-card {
                padding: 10px 14px;
            }

            .start-btn {
                font-size: 11px;
                padding: 11px 24px;
            }
        }
    </style>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div class="ambient-glow"></div>

    <div class="main-wrapper" id="main-wrapper">
        <div class="logo-container">
            <div class="blast-wave" id="blast-wave"></div>
            <div id="globe-3d-container"></div>
        </div>

        <div class="status-bar">
            <div class="badge">
                <span class="live-dot"></span>
                <span>CANLI YAYIN</span>
            </div>
            <div class="badge">
                <span>🎧 DİNLEYİCİ: <strong id="listener-count" style="color: #ffffff; text-shadow: 0 0 8px #fff;">0</strong></span>
            </div>
        </div>

        <div class="video-container" id="video-box">
            <div id="start-overlay">
                <button class="start-btn" id="start-btn-el">CANLI YAYINA KATIL</button>
            </div>
            <div id="youtube-player"></div>
        </div>

        <div class="now-playing-card">
            <div class="track-info">
                <span class="track-label">
                    <span style="display:inline-block; width:6px; height:6px; background:#fff; border-radius:50%;"></span>
                    ŞU AN YAYINDA
                </span>
                <span class="track-title" id="current-track-name">Canlı Yayın Bekleniyor...</span>
            </div>
            <div class="next-track">
                <div class="track-label" style="justify-content: flex-end;">SIRADAKİ</div>
                <span id="next-track-name" style="font-weight:700;">---</span>
            </div>
        </div>

        <canvas id="visualizer-canvas"></canvas>
    </div>

    <script>
        // MOBİL İLK AÇILIŞ KAYMA ENGELLEYİCİ KİLİT
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }

        function forceScrollTop() {
            if (window.scrollY !== 0 || document.documentElement.scrollTop !== 0) {
                window.scrollTo(0, 0);
                document.body.scrollTop = 0;
                document.documentElement.scrollTop = 0;
            }
        }

        forceScrollTop();
        window.addEventListener('DOMContentLoaded', forceScrollTop);
        window.addEventListener('load', forceScrollTop);

        const scrollInterval = setInterval(forceScrollTop, 50);
        setTimeout(() => clearInterval(scrollInterval), 1200);

        let player = null;
        let isPlayerReady = false;
        let isPlayingState = false;
        let currentLoadedVideoId = null;
        let syncCheckInterval = null;

        const baseSongList = [
            { id: '1IEg_3x35go', duration: 120, title: 'FRANCHISE' },
            { id: 'qAlF70MdfwU', duration: 207, title: 'OUT WEST' }, 
            { id: 'L_BpiSsIBFM', duration: 236, title: 'BROTHER STONE' }, 
            { id: 'cTGQrA5HHIU', duration: 204, title: 'WITH THAT' }, 
            { id: 'ftaXMKV3ffE', duration: 160, title: 'BACKR00MS' },
            { id: 'LPTlvQ1Zet0', duration: 188, title: 'RIC FLAIR DRIP' },
            { id: 'EfHNIPXTxy0', duration: 276, title: 'ZEZE' },
            { id: 'yST9RwZNZDw', duration: 169, title: 'VURURUM KAFANDAN' },
            { id: 'JrPBResAG2s', duration: 175, title: 'KÖPEKBALIKLARI BURDA' },
            { id: '-q-XvhV7GFA', duration: 165, title: 'HARBİDEN ŞEKERMİŞ' },
            { id: 'N4nfjhJN6SA', duration: 197, title: 'TAKE IT TO TRIAL' },
            { id: 'kC2nGcgKeX0', duration: 167, title: 'GOSTOSO' },
            { id: 'LcKC9YG-TQY', duration: 150, title: 'MOB GUYS' },
            { id: '-yElvysKMCY', duration: 164, title: 'TRIMSKI' },
            { id: 'pfjy7PhVtMo', duration: 135, title: 'POTATO LOADED' },
            { id: 'bHDWrnlIqfQ', duration: 173, title: 'POPPIN/TALIBAN' },
            { id: 'KPz33BLkvho', duration: 165, title: 'ESCAPE PLAN' },
            { id: 'B9synWjqBn8', duration: 209, title: 'FE!N' },
            { id: 'MKPEZlXY49Q', duration: 244, title: 'JENGA' }
        ];

        const STREAM_START_TIME = 1700000000; 

        function getDeterministicShuffledList(array, seed) {
            let shuffled = [...array];
            let m = shuffled.length, t, i;
            let pseudoRandom = function() {
                let z = (seed += 0x6D2B79F5);
                z = Math.imul(z ^ (z >>> 15), z | 1);
                z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
                return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
            };

            while (m) {
                i = Math.floor(pseudoRandom() * m--);
                t = shuffled[m];
                shuffled[m] = shuffled[i];
                shuffled[i] = t;
            }
            return shuffled;
        }

        const songList = getDeterministicShuffledList(baseSongList, STREAM_START_TIME);
        const totalPlaylistDuration = songList.reduce((acc, song) => acc + song.duration, 0);

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const elapsedTime = (nowInSeconds - STREAM_START_TIME) % totalPlaylistDuration;
            let accumulatedTime = 0;
            for (let i = 0; i < songList.length; i++) {
                if (elapsedTime < accumulatedTime + songList[i].duration) {
                    return {
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += songList[i].duration;
            }
            return { songIndex: 0, seekTo: 0 };
        }

        function updateTrackLabels(currentIndex) {
            const currentSong = songList[currentIndex];
            const nextIndex = (currentIndex + 1) % songList.length;
            const nextSong = songList[nextIndex];

            document.getElementById('current-track-name').innerText = currentSong.title;
            document.getElementById('next-track-name').innerText = nextSong.title;
        }

        const initialState = getCurrentStreamState();
        updateTrackLabels(initialState.songIndex);

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.head.appendChild(tag);

        function onYouTubeIframeAPIReady() {
            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];
            currentLoadedVideoId = targetSong.id;

            player = new YT.Player('youtube-player', {
                videoId: targetSong.id,
                playerVars: {
                    'autoplay': 0,
                    'controls': 1,
                    'rel': 0,
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'start': Math.floor(state.seekTo)
                },
                events: {
                    'onReady': () => { 
                        isPlayerReady = true; 
                        if (document.activeElement) {
                            document.activeElement.blur();
                        }
                        forceScrollTop();
                    },
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerStateChange(event) {
            const vBox = document.getElementById('video-box');
            if (event.data === YT.PlayerState.PLAYING) {
                isPlayingState = true;
                vBox.classList.add('playing-border');
            } else {
                isPlayingState = false;
                vBox.classList.remove('playing-border');
            }
        }

        function syncToLiveStream() {
            if (!isPlayerReady || !player) return;

            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];

            updateTrackLabels(state.songIndex);

            if (currentLoadedVideoId !== targetSong.id) {
                currentLoadedVideoId = targetSong.id;
                player.loadVideoById({
                    videoId: targetSong.id,
                    startSeconds: Math.floor(state.seekTo)
                });
                player.playVideo();
                return;
            }

            if (typeof player.getCurrentTime === 'function') {
                const currentTime = player.getCurrentTime();
                const timeDiff = Math.abs(currentTime - state.seekTo);
                if (timeDiff > 3) {
                    player.seekTo(state.seekTo, true);
                    player.playVideo();
                }
            }
        }

        function handleUserClick() {
            const blast = document.getElementById('blast-wave');
            blast.classList.remove('blast-active');
            void blast.offsetWidth;
            blast.classList.add('blast-active');

            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { 
                overlay.style.visibility = 'hidden'; 
            }, 600);

            const startPlaying = () => {
                const state = getCurrentStreamState();
                const targetSong = songList[state.songIndex];

                updateTrackLabels(state.songIndex);
                currentLoadedVideoId = targetSong.id;

                if (typeof player.unMute === 'function') {
                    player.unMute();
                }

                player.loadVideoById({
                    videoId: targetSong.id,
                    startSeconds: Math.floor(state.seekTo)
                });
                player.playVideo();
                isPlayingState = true;

                if (syncCheckInterval) clearInterval(syncCheckInterval);
                syncCheckInterval = setInterval(syncToLiveStream, 3000);
            };

            if (isPlayerReady && player) {
                startPlaying();
            } else {
                const checkReady = setInterval(() => {
                    if (isPlayerReady && player) {
                        clearInterval(checkReady);
                        startPlaying();
                    }
                }, 100);
            }
        }

        document.getElementById('start-overlay').addEventListener('click', handleUserClick);
        document.getElementById('start-btn-el').addEventListener('click', (e) => {
            e.stopPropagation();
            handleUserClick();
        });

        // THREE.JS 3D DÜNYA + PIRLANTA HALKASI (SATÜRN MODELİ)
        const globeContainer = document.getElementById('globe-3d-container');
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        globeContainer.appendChild(renderer.domElement);

        function resizeThreeJS() {
            const width = globeContainer.clientWidth;
            const height = globeContainer.clientHeight;
            if (width === 0 || height === 0) return;

            camera.aspect = width / height;

            if (window.innerWidth <= 400) {
                camera.position.z = 5.8;
            } else if (window.innerWidth <= 600) {
                camera.position.z = 5.4;
            } else {
                camera.position.z = 5.0;
            }

            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg');

        const baseRadius = 1.65;
        const geometry = new THREE.SphereGeometry(baseRadius, 64, 64);
        const material = new THREE.MeshStandardMaterial({
            map: earthTexture,
            roughness: 0.35,
            metalness: 0.4
        });
        const globeMesh = new THREE.Mesh(geometry, material);
        scene.add(globeMesh);

        // Atmosfer Katmanı
        const atmosGeo = new THREE.SphereGeometry(baseRadius + 0.05, 64, 64);
        const atmosMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide
        });
        const atmosMesh = new THREE.Mesh(atmosGeo, atmosMat);
        scene.add(atmosMesh);

        // Dış İnce Pırlanta Halkası
        const outerRingGeo = new THREE.RingGeometry(baseRadius + 0.4, baseRadius + 0.42, 64);
        const outerRingMat = new THREE.MeshBasicMaterial({
            color: 0xffffff,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.4
        });
        const outerRingMesh = new THREE.Mesh(outerRingGeo, outerRingMat);
        outerRingMesh.rotation.x = Math.PI / 2 + 0.2;
        scene.add(outerRingMesh);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
        dirLight.position.set(5, 4, 5);
        scene.add(dirLight);

        let ringMesh = null;

        function createOrbitRingText() {
            const canvas = document.createElement('canvas');
            canvas.width = 2048;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'transparent';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';

            ctx.shadowColor = '#ffffff';
            ctx.shadowBlur = 40;

            ctx.font = '900 160px "Anton", sans-serif';
            ctx.fillText("EA$Y FM", canvas.width / 2, 160);

            ctx.font = '900 65px "Montserrat", sans-serif';
            ctx.letterSpacing = '6px';
            ctx.fillText("7/24 YÜZDE YÜZ MÜZİK", canvas.width / 2, 340);

            const ringTex = new THREE.CanvasTexture(canvas);
            ringTex.minFilter = THREE.LinearFilter;
            ringTex.magFilter = THREE.LinearFilter;
            ringTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

            const ringGeo = new THREE.CylinderGeometry(baseRadius + 0.28, baseRadius + 0.28, 0.95, 64, 1, true);
            const ringMat = new THREE.MeshBasicMaterial({
                map: ringTex,
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: false
            });

            ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.rotation.z = 0.10;
            scene.add(ringMesh);
        }

        document.fonts.ready.then(() => {
            createOrbitRingText();
        });

        let bassAngle = 0;

        function animateGlobe() {
            requestAnimationFrame(animateGlobe);

            const globeSpeed = isPlayingState ? 0.007 : 0.002;
            const ringSpeed = isPlayingState ? 0.01 : 0.003;

            globeMesh.rotation.y += globeSpeed;
            if (ringMesh) ringMesh.rotation.y -= ringSpeed;
            outerRingMesh.rotation.z += globeSpeed * 0.5;

            if (isPlayingState) {
                bassAngle += 0.09;
                const bassScale = 1 + Math.pow(Math.sin(bassAngle), 6) * 0.06;
                globeMesh.scale.set(bassScale, bassScale, bassScale);
                atmosMesh.scale.set(bassScale, bassScale, bassScale);
            } else {
                globeMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
                atmosMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 0.1);
            }

            renderer.render(scene, camera);
        }
        
        resizeThreeJS();
        animateGlobe();

        // Gelişmiş Pırlanta & Sparkle Parçacık Animasyonu
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function handleResize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            resizeThreeJS();
        }
        window.addEventListener('resize', handleResize);
        handleResize();

        class DiamondParticle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.7 + 0.2;
                this.isSparkle = Math.random() > 0.7; // %30 İhtimalle 4 kollu parıltı
                this.pulseSpeed = Math.random() * 0.03 + 0.01;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;

                this.opacity += Math.sin(Date.now() * this.pulseSpeed) * 0.01;
                if (this.opacity < 0.1) this.opacity = 0.1;
                if (this.opacity > 0.9) this.opacity = 0.9;

                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }

            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;

                if (this.isSparkle) {
                    // 4 Kollu Pırlanta Parıltısı
                    const len = this.size * 2.5;
                    ctx.beginPath();
                    ctx.moveTo(this.x - len, this.y);
                    ctx.lineTo(this.x + len, this.y);
                    ctx.moveTo(this.x, this.y - len);
                    ctx.lineTo(this.x, this.y + len);
                    ctx.lineWidth = 0.8;
                    ctx.stroke();
                } else {
                    // Elmas Kesim Karo
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y - this.size);
                    ctx.lineTo(this.x + this.size, this.y);
                    ctx.lineTo(this.x, this.y + this.size);
                    ctx.lineTo(this.x - this.size, this.y);
                    ctx.closePath();
                    ctx.fill();
                }
            }
        }

        for (let i = 0; i < 60; i++) particlesArray.push(new DiamondParticle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // GELİŞMİŞ MONOKROM VISUALIZER
        const vCanvas = document.getElementById('visualizer-canvas');
        const vCtx = vCanvas.getContext('2d');
        const numBars = 40;
        let barHeights = new Array(numBars).fill(3);
        let peakHeights = new Array(numBars).fill(3);

        function drawVisualizer() {
            vCanvas.width = vCanvas.offsetWidth;
            vCanvas.height = vCanvas.offsetHeight;
            vCtx.clearRect(0, 0, vCanvas.width, vCanvas.height);

            const gap = 3;
            const barWidth = (vCanvas.width / numBars) - gap;

            for (let i = 0; i < numBars; i++) {
                if (isPlayingState) {
                    const target = Math.random() * (vCanvas.height - 6) + 4;
                    barHeights[i] += (target - barHeights[i]) * 0.15;
                } else {
                    barHeights[i] += (3 - barHeights[i]) * 0.1;
                }

                // Pik Noktaları Hesaplama
                if (barHeights[i] > peakHeights[i]) {
                    peakHeights[i] = barHeights[i];
                } else {
                    peakHeights[i] -= 0.4;
                }
                if (peakHeights[i] < 3) peakHeights[i] = 3;

                const x = i * (barWidth + gap);
                const y = vCanvas.height - barHeights[i];

                // Çubuk Gradyanı (Gümüşten Beyaza)
                const grad = vCtx.createLinearGradient(0, vCanvas.height, 0, y);
                grad.addColorStop(0, 'rgba(100, 100, 100, 0.2)');
                grad.addColorStop(1, '#ffffff');

                vCtx.fillStyle = grad;
                vCtx.fillRect(x, y, barWidth, barHeights[i]);

                // Beyaz Tepe Pik Noktası (Pırlanta Dokunuşu)
                vCtx.fillStyle = '#ffffff';
                vCtx.fillRect(x, vCanvas.height - peakHeights[i] - 2, barWidth, 1.5);
            }
            requestAnimationFrame(drawVisualizer);
        }
        drawVisualizer();
    </script>
