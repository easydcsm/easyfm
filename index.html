<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA$Y FM - 24/7 TRAP & HIP-HOP</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --glow-color: rgba(255, 255, 255, 0.8);
            --accent-color: #ffffff;
            --particle-color: #ffffff;
        }

        /* SLIME GREEN NEON MODE */
        body.slime-mode-active {
            --glow-color: rgba(57, 255, 20, 0.8);
            --accent-color: #39ff14;
            --particle-color: #39ff14;
        }

        body {
            margin: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.5s;
        }

        /* ARKA PLAN CANVAS */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.04) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 2;
            pointer-events: none;
            transition: background 0.5s ease;
        }

        /* ÜST SAĞ MOD TOGGLE PANELİ */
        .glow-toggle-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .toggle-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .glow-toggle-label {
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1px;
            color: #fff;
            text-transform: uppercase;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 32px;
            height: 18px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 20px;
            border: 1px solid #555;
        }

        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 10px;
            width: 10px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 0 5px #fff;
        }

        input:checked + .slider-toggle { background-color: var(--accent-color); }
        input:checked + .slider-toggle:before {
            transform: translateX(12px);
            background-color: #000;
        }

        /* DIAMOND & SLIME MODE EFFECTS */
        body.diamond-mode-active .ambient-glow {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(0, 0, 0, 0) 75%);
        }

        body.slime-mode-active .ambient-glow {
            background: radial-gradient(circle, rgba(57, 255, 20, 0.15) 0%, rgba(57, 255, 20, 0.02) 50%, rgba(0, 0, 0, 0) 75%);
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 15px;
            margin-top: 10px;
            transition: transform 0.1s ease;
        }

        /* BEAT BOUNCE EFEKTİ */
        .beat-bounce {
            transform: scale(1.02);
        }

        h1 {
            margin: 0;
            font-family: 'Anton', sans-serif;
            font-size: 64px;
            letter-spacing: 4px;
            text-transform: uppercase;
            
            background: linear-gradient(
                135deg, 
                #ffffff 0%, 
                #a6a6a6 25%, 
                #ffffff 50%, 
                #737373 75%, 
                #ffffff 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            text-shadow: 0 0 15px var(--glow-color);
            transform: skew(-4deg);
            animation: diamondShine 4s linear infinite;
            transition: text-shadow 0.3s;
        }

        body.slime-mode-active h1 {
            background: linear-gradient(135deg, #39ff14 0%, #1c800a 50%, #39ff14 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes diamondShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 12px;
            color: #ffffff;
            letter-spacing: 5px;
            margin-top: 6px;
            text-transform: uppercase;
            opacity: 0.9;
        }

        /* İZLEYİCİ VE CANLI YAYIN BİLGİ ROZETLERİ */
        .badge-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .listener-badge {
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 18px;
            border-radius: 30px;
            font-size: 12px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px var(--accent-color);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* YENİ: DINAMIK PARÇA TICKER */
        .track-ticker-container {
            width: 80%;
            max-width: 650px;
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 6px 15px;
            margin-bottom: 12px;
            overflow: hidden;
            white-space: nowrap;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .track-ticker {
            display: inline-block;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: #aaa;
            text-transform: uppercase;
            animation: marquee 15s linear infinite;
        }

        .track-ticker span {
            color: var(--accent-color);
        }

        @keyframes marquee {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }

        /* VİDEO KONTEYNERİ */
        .video-container {
            position: relative;
            width: 80%;
            max-width: 650px;
            padding-bottom: 36.56%;
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: box-shadow 0.3s, border-color 0.3s, transform 0.1s;
        }

        .video-container.beat-glow {
            box-shadow: 0 0 30px var(--glow-color);
            border-color: var(--accent-color);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .click-toggle-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 15;
            cursor: pointer;
        }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.98);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .start-btn {
            background: var(--accent-color);
            color: #000;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 15px;
            padding: 14px 32px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 20px var(--glow-color);
            transition: transform 0.2s;
        }

        .start-btn:hover { transform: scale(1.05); }

        /* VISUALIZER SPEKTRUMU */
        .visualizer-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
            height: 25px;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        .visualizer-container.active { opacity: 1; }

        .v-bar {
            width: 4px;
            background: linear-gradient(to top, #444, var(--accent-color));
            border-radius: 3px;
            height: 10%;
            transition: height 0.1s ease;
        }

        /* SES KONTROL PANELİ */
        .controls {
            margin-top: 15px;
            margin-bottom: 40px;
            z-index: 20;
        }

        .volume-control-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .mute-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 4px;
        }

        .mute-btn svg { width: 18px; height: 18px; fill: #ffffff; }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 110px;
            height: 4px;
            border-radius: 5px;
            background: #333;
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 0 8px var(--glow-color);
        }

        .volume-percentage {
            font-size: 11px;
            font-weight: 800;
            color: #888;
            min-width: 32px;
            text-align: right;
        }

        /* KISAYOL İPUCU FOOTER */
        .hotkey-hint {
            position: fixed;
            bottom: 12px;
            font-size: 9px;
            color: #555;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 20;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .glow-toggle-container { top: 10px; right: 10px; padding: 6px 12px; }
            h1 { font-size: 38px; }
            .video-container { width: 92%; padding-bottom: 51.75%; }
            .track-ticker-container { width: 92%; }
            .hotkey-hint { display: none; }
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<body>

    <!-- MOD SEÇENEKLERİ -->
    <div class="glow-toggle-container">

            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
            <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>

        <div class="controls">
            <div class="volume-control-panel">
                <button id="mute-btn" class="mute-btn" onclick="toggleMute()">
                    <svg id="volume-icon" viewBox="0 0 24 24">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>

                </button>
                <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="100" oninput="changeVolume(this.value)">
                <span id="volume-text" class="volume-percentage">100%</span>

    <div class="hotkey-hint">[SPACE] OYNAT/DURDUR &nbsp;|&nbsp; [M] MUTE &nbsp;|&nbsp; [▲/▼] SES</div>

    <script>
        // MOD TOGGLE SİSTEMLERİ
        function toggleDiamondGlow(cb) {
            if(cb.checked) {
                document.getElementById('slime-toggle').checked = false;
                document.body.classList.remove('slime-mode-active');
                document.body.classList.add('diamond-mode-active');
            } else {
                document.body.classList.remove('diamond-mode-active');
            }
        }

        function toggleSlimeMode(cb) {
            if(cb.checked) {
                document.getElementById('glow-toggle').checked = false;
                document.body.classList.remove('diamond-mode-active');
                document.body.classList.add('slime-mode-active');
            } else {
                document.body.classList.remove('slime-mode-active');
            }
        }

        // CANVAS PARÇACIK ANİMASYONU
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.5 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.7 + 0.2;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
            }

            draw() {
                const color = getComputedStyle(document.body).getPropertyValue('--particle-color').trim() || '#ffffff';
                ctx.fillStyle = color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        for (let i = 0; i < 45; i++) particlesArray.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // BEAT PULSE & VISUALIZER
        const vBars = document.querySelectorAll('.v-bar');
        const videoBox = document.getElementById('video-box');
        const logoBox = document.getElementById('logo-box');

        function animateVisualizer() {
            if (isStarted && player && player.getPlayerState() === YT.PlayerState.PLAYING && !player.isMuted()) {
                let maxBarHeight = 0;
                vBars.forEach(bar => {
                    const randomHeight = Math.floor(Math.random() * 85) + 15;
                    bar.style.height = randomHeight + '%';
                    if (randomHeight > maxBarHeight) maxBarHeight = randomHeight;
                });

                // Bas Vurma Efekti
                if (maxBarHeight > 75) {
                    videoBox.classList.add('beat-glow');
                    logoBox.classList.add('beat-bounce');
                } else {
                    videoBox.classList.remove('beat-glow');
                    logoBox.classList.remove('beat-bounce');
                }
            } else {
                vBars.forEach(bar => { bar.style.height = '10%'; });
                videoBox.classList.remove('beat-glow');
                logoBox.classList.remove('beat-bounce');
            }
        }
        setInterval(animateVisualizer, 110);

        // FIREBASE İZLEYİCİ TAKİBİ
        const firebaseConfig = {
            apiKey: "AIzaSyBaTlb6V6e4FMLTYNXAPBgdzsgiclL8Qw8",
            authDomain: "easyfm-37b9e.firebaseapp.com",
            databaseURL: "https://easyfm-37b9e-default-rtdb.firebaseio.com",
            projectId: "easyfm-37b9e",
            storageBucket: "easyfm-37b9e.firebasestorage.app",
            messagingSenderId: "869244564550",
            appId: "1:869244564550:web:f0824148dbcae6b7024647"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const myConnectionsRef = db.ref('online_listeners');

        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                const con = myConnectionsRef.push();
                con.onDisconnect().remove();
                con.set(true);
            }
        });

        myConnectionsRef.on('value', (snap) => {
            document.getElementById('listener-count').innerText = snap.numChildren();
        });

        // PLAYLIST VE PARÇA BİLGİLERİ
        const songList = [
            { id: '1IEg_3x35go', duration: 120, title: "JackBoys - GANG GANG" },
            { id: 'qAlF70MdfwU', duration: 207, title: "Travis Scott - HIGHEST IN THE ROOM" }, 
            { id: 'L_BpiSsIBFM', duration: 236, title: "Young Thug - Solid ft. Drake" }, 
            { id: 'cTGQrA5HHIU', duration: 204, title: "Kodak Black - Super Gremlin" }, 
            { id: 'ftaXMKV3ffE', duration: 160, title: "NLE Choppa - Walk Em Down" },
            { id: 'LPTlvQ1Zet0', duration: 188, title: "Future - Mask Off" },
            { id: 'EfHNIPXTxy0', duration: 276, title: "Playboi Carti - Sky" }
        ];

        const STREAM_START_TIME = 1700000000; 
        const totalPlaylistDuration = songList.reduce((acc, song) => acc + song.duration, 0);

        let player;
        let currentLoadedVideoId = null;
        let isChangingSong = false;
        let isStarted = false;
        let lastVolumeLevel = 100;

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const elapsedTime = (nowInSeconds - STREAM_START_TIME) % totalPlaylistDuration;

            let accumulatedTime = 0;
            for (let i = 0; i < songList.length; i++) {
                if (elapsedTime < accumulatedTime + songList[i].duration) {
                    return {
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime,
                        title: songList[i].title
                    };
                }
                accumulatedTime += songList[i].duration;
            }
            return { songIndex: 0, seekTo: 0, title: songList[0].title };
        }

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        document.getElementsByTagName('script')[0].parentNode.insertBefore(tag, document.getElementsByTagName('script')[0]);

        function onYouTubeIframeAPIReady() {
            const state = getCurrentStreamState();
            currentLoadedVideoId = songList[state.songIndex].id;
            updateTickerTitle(state.title);

            player = new YT.Player('player', {
                videoId: currentLoadedVideoId,
                playerVars: {
                    'autoplay': 0, 'controls': 0, 'disablekb': 1, 'modestbranding': 1, 'rel': 0, 'playsinline': 1
                },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function updateTickerTitle(title) {
            document.getElementById('current-track-name').innerText = title;
        }

        function startRadio() {
            if (!player) return;
            const state = getCurrentStreamState();
            player.seekTo(state.seekTo, true);
            player.playVideo();
            player.unMute();
            player.setVolume(100);
            
            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);
            isStarted = true;

            document.getElementById('visualizer').classList.add('active');
        }

        function togglePlayPause() {
            if (!player || !isStarted) return;
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                syncToCurrentStream();
                player.playVideo();
            }
        }

        function changeVolume(val) {
            if (!player) return;
            player.setVolume(val);
            document.getElementById('volume-text').innerText = val + '%';
            if (val == 0) player.mute();
            else if (player.isMuted()) player.unMute();
        }

        function toggleMute() {
            if (!player) return;
            const slider = document.getElementById('volume-slider');
            if (player.isMuted() || slider.value == 0) {
                const target = lastVolumeLevel > 0 ? lastVolumeLevel : 50;
                player.unMute();
                player.setVolume(target);
                slider.value = target;
                document.getElementById('volume-text').innerText = target + '%';
            } else {
                lastVolumeLevel = slider.value;
                player.mute();
                slider.value = 0;
                document.getElementById('volume-text').innerText = '0%';
            }
        }

        function syncToCurrentStream() {
            if (!player || isChangingSong || !isStarted) return;
            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];

            updateTickerTitle(state.title);

            if (currentLoadedVideoId !== targetSong.id) {
                isChangingSong = true;
                currentLoadedVideoId = targetSong.id;
                player.loadVideoById({ videoId: targetSong.id, startSeconds: state.seekTo });
                setTimeout(() => { isChangingSong = false; }, 2000);
            } else {
                const currentTime = player.getCurrentTime ? player.getCurrentTime() : 0;
                if (Math.abs(currentTime - state.seekTo) > 3) {
                    player.seekTo(state.seekTo, true);
                }
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED && isStarted) {
                syncToCurrentStream();
                player.playVideo();
            }
        }

        setInterval(() => {
            if (player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                syncToCurrentStream();
            }
        }, 5000);

        // KLAVYE KISAYOLLARI (HOTKEYS)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                togglePlayPause();
            } else if (e.code === 'KeyM') {
                toggleMute();
            } else if (e.code === 'ArrowUp') {
                e.preventDefault();
                const slider = document.getElementById('volume-slider');
                const newVal = Math.min(100, parseInt(slider.value) + 5);
                slider.value = newVal;
                changeVolume(newVal);
            } else if (e.code === 'ArrowDown') {
                e.preventDefault();
                const slider = document.getElementById('volume-slider');
                const newVal = Math.max(0, parseInt(slider.value) - 5);
                slider.value = newVal;
                changeVolume(newVal);
            }
        });
    </script>
</body>
</html>
