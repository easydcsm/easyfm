<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EA$Y FM | CANLI</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow-x: hidden;
            scroll-behavior: auto !important;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100%;
            background-color: #000000;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            display: block; /* Flex ortalaması kaldırıldı, üstte kalması garanti edildi */
        }

        /* ARKA PLAN CANVAS */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(0, 0, 0, 0) 75%);
            z-index: 2;
            pointer-events: none;
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px 15px 30px 15px;
            gap: 12px;
            margin: 0 auto;
        }

        /* LOGO & 3D DÜNYA ALANI */
        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 440px;
            height: 230px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
        }

        /* ANLIK PIRLANTA PATLAMA HALKASI */
        .blast-wave {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.6);
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 1);
            box-shadow: 0 0 80px rgba(255, 255, 255, 1), inset 0 0 50px rgba(255, 255, 255, 0.9);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
        }

        .blast-active {
            animation: fastExplode 0.4s cubic-bezier(0.0, 0.9, 0.2, 1) forwards;
        }
