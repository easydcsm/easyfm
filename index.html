<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EA$Y FM | 7/24 YÜZDE YÜZ MÜZİK</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Syne:wght@800;900&family=Montserrat:wght@400;700;900&family=Permanent+Marker&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.55);
            --bg-glow: rgba(180, 220, 255, 0.1);
            --border-glow: rgba(255, 255, 255, 0.35);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #020202;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden !important;
            touch-action: none;
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* CRT TARAMA & VIGNETTE SİNEMATİK EFEKTI */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 25%, #000000 120%);
            z-index: 45;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
            z-index: 50;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            opacity: 0.6;
        }

        /* ARKA PLAN GRAFFITI / GOTIK ARKA PLAN YAZILARI */
        .trap-bg-text {
            position: fixed;
            font-family: 'UnifrakturCook', cursive;
            color: rgba(255, 255, 255, 0.04);
            font-size: 22vw;
            z-index: 1;
            pointer-events: none;
            text-transform: uppercase;
            white-space: nowrap;
            letter-spacing: -3px;
            text-shadow: 0 0 35px var(--glow-color);
            filter: blur(1px);
            transition: transform 0.08s ease, color 0.3s ease;
            will-change: transform;
        }

        .trap-bg-text.top-left {
            top: -6%;
            left: -12%;
            transform: rotate(-10deg);
        }

        .trap-bg-text.bottom-right {
            bottom: -10%;
            right: -12%;
            transform: rotate(8deg);
        }

        .spray-tag {
            position: fixed;
            font-family: 'Permanent Marker', cursive;
            color: var(--accent-color);
            opacity: 0.12;
            font-size: 10vw;
            z-index: 1;
            pointer-events: none;
            transition: color 0.4s ease, opacity 0.4s ease, transform 0.08s ease;
            text-shadow: 0 0 20px var(--glow-color);
            will-change: transform;
        }

        .spray-tag.tag1 { top: 35%; left: 2%; transform: rotate(-25deg); }
        .spray-tag.tag2 { top: 15%; right: 3%; transform: rotate(15deg); }

        #bg-canvas, #slime-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        #slime-canvas {
            z-index: 5;
        }

        /* DİNAMİK BASS LIGHTNING FLASH */
        #lightning-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--accent-color);
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: overlay;
            will-change: opacity;
        }

        /* AMBIENT NEON GLOW */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95vw;
            height: 95vh;
            background: radial-gradient(circle, var(--glow-color) 0%, var(--bg-glow) 50%, rgba(0, 0, 0, 0) 80%);
            z-index: 4;
            pointer-events: none;
            transition: transform 0.08s ease-out, opacity 0.08s ease-out, background 0.4s ease;
            will-change: transform, opacity;
            filter: blur(70px);
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(12px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom)) 14px;
            gap: 6px;
            margin: 0 auto;
            box-sizing: border-box;
            transition: transform 0.05s ease, filter 0.05s ease;
        }

        .wrapper-shake {
            animation: trapBassShake 0.07s ease-in-out infinite alternate;
        }

        .rage-shake-mode {
            animation: rageShake 0.03s ease-in-out infinite alternate !important;
        }

        @keyframes rageShake {
            0% { transform: scale(1.02) translate(-4px, 3px) rotate(-1deg); }
            100% { transform: scale(0.98) translate(4px, -3px) rotate(1deg); }
        }

        .wrapper-glitch {
            filter: drop-shadow(-2px 0 0 rgba(255,0,0,0.6)) drop-shadow(2px 0 0 rgba(0,255,255,0.6));
        }

        @keyframes trapBassShake {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.008) translate(-1.5px, 1.5px); }
            100% { transform: scale(0.992) translate(1.5px, -1.5px); }
        }

        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 420px;
            height: clamp(160px, 25vh, 240px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
            flex-shrink: 0;
        }

        @media (min-width: 769px) {
            .logo-container {
                max-width: 620px;
                height: clamp(220px, 30vh, 320px);
            }
        }

        #globe-3d-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #globe-3d-container canvas {
            display: block;
            outline: none;
            filter: drop-shadow(0 0 40px var(--glow-color));
        }

        /* STATUS BAR */
        .status-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 100%;
            flex-shrink: 0;
            padding: 0 2px;
        }

        .badge {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), inset 0 0 12px rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .theme-selector {
            display: flex;
            gap: 6px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--border-glow);
            padding: 5px 10px;
            border-radius: 40px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .theme-btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
            position: relative;
        }

        .theme-btn:active { transform: scale(0.6); }

        .theme-ice { background: #ffffff; box-shadow: 0 0 14px #fff; }
        .theme-slime { background: #39ff14; box-shadow: 0 0 14px #39ff14; }
        .theme-opium { background: #ff0000; box-shadow: 0 0 14px #ff0000; }
        .theme-purple { background: #a855f7; box-shadow: 0 0 14px #a855f7; }
        .theme-gold { background: #ffd700; box-shadow: 0 0 14px #ffd700; }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 14px var(--accent-color);
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.1; transform: scale(0.3); }
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--border-glow);
            padding: 5px 12px;
            border-radius: 40px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            pointer-events: none;
        }

        .badge-bass-pulse {
            transform: scale(1.04);
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 20px var(--glow-color) !important;
        }

        .volume-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 45px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-color);
        }

        /* TRAP SOUNDBOARD / PRODUCER SOUND PADS */
        .soundboard-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            flex-shrink: 0;
            margin: 2px 0;
        }

        .pad-btn {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 8px 4px;
            color: #fff;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            text-transform: uppercase;
            backdrop-filter: blur(15px);
            transition: all 0.1s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .pad-btn:active {
            transform: scale(0.92);
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 20px var(--accent-color);
        }

        .pad-icon {
            font-size: 12px;
        }

        /* YENİ INTERAKTİF KONTROL BAR */
        .utility-bar {
            display: flex;
            gap: 6px;
            width: 100%;
            justify-content: center;
            flex-shrink: 0;
        }

        .util-btn {
            background: rgba(18, 18, 18, 0.85);
            border: 1px solid var(--border-glow);
            border-radius: 30px;
            padding: 6px 12px;
            color: #fff;
            font-size: 8.5px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 1px;
            backdrop-filter: blur(20px);
            transition: all 0.2s ease;
        }

        .util-btn:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px var(--glow-color);
        }

        /* VIDEO CONTAINER & CYBER BORDER */
        .video-container {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 120px;
            max-height: 32vh;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.95);
            border: 1px solid var(--border-glow);
            transition: border-color 0.3s, box-shadow 0.3s, transform 0.08s ease;
            background: #000;
            margin: 2px 0;
        }

        .video-container.playing-border {
            border-color: var(--accent-color);
            box-shadow: 0 0 40px var(--glow-color), inset 0 0 25px var(--glow-color);
        }

        #youtube-player {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: none; pointer-events: auto;
        }

        .yt-shield-top-main { position: absolute; top: 0; left: 0; width: 100%; height: 82%; z-index: 15; background: transparent; }
        .yt-shield-bottom-left { position: absolute; bottom: 0; left: 0; width: 78%; height: 18%; z-index: 15; background: transparent; }
        .yt-shield-bottom-edge { position: absolute; bottom: 0; right: 0; width: 2%; height: 18%; z-index: 15; background: transparent; }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(10, 10, 10, 0.96) 0%, rgba(0, 0, 0, 0.99) 100%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .start-btn {
            background: var(--accent-color);
            color: #000;
            font-family: 'Syne', sans-serif;
            font-weight: 900;
            font-size: 11px;
            padding: 16px 42px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 3.5px;
            box-shadow: 0 0 45px var(--accent-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
        }

        .start-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 65px var(--accent-color);
        }

        /* NOW PLAYING CARD */
        .now-playing-card {
            width: 100%;
            background: rgba(12, 12, 12, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.95);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
            max-width: 58%;
        }

        .track-label {
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .track-title {
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .next-track {
            font-size: 8.5px;
            color: #aaa;
            text-align: right;
            max-width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .wave-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            margin-left: 4px;
        }

        .wave-bar {
            width: 2.5px;
            background: var(--accent-color);
            border-radius: 1px;
            box-shadow: 0 0 8px var(--accent-color);
            animation: waveAnim 0.5s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 35%; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 90%; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 55%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }

        #visualizer-canvas {
            width: 100%;
            height: 20px;
            min-height: 16px;
            margin: 0;
            flex-shrink: 0;
            display: block;
        }

        /* GRAFFITI MODAL SYSTEM */
        #tag-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            z-index: 100;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .tag-input {
            background: #111;
            border: 2px solid var(--accent-color);
            color: #fff;
            padding: 12px 20px;
            border-radius: 30px;
            font-family: 'Permanent Marker', cursive;
            font-size: 20px;
            outline: none;
            text-align: center;
            box-shadow: 0 0 20px var(--glow-color);
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="trap-bg-text top-left" id="bg-text-1">EA$Y WORLDWIDE</div>
    <div class="trap-bg-text bottom-right" id="bg-text-2">OPIUM 808</div>

    <div class="spray-tag tag1" id="tag1">YSL</div>
    <div class="spray-tag tag2" id="tag2">TRAPHOUSE</div>

    <canvas id="bg-canvas"></canvas>
    <canvas id="slime-canvas"></canvas>
    <div id="lightning-flash"></div>
    <div class="ambient-glow" id="ambient-glow"></div>

    <div class="main-wrapper" id="main-wrapper">
        <div class="logo-container">
            <div id="globe-3d-container"></div>
        </div>

        <div class="status-bar">
            <div class="badge" id="badge-live">
                <span class="live-dot"></span>
                <span>CANLI</span>
            </div>
            <div class="badge" id="badge-listener">
                <span>🎧 DİNLEYİCİ: <strong id="listener-count" style="color: #ffffff; text-shadow:0 0 10px #fff;">0</strong></span>
            </div>
            <div class="theme-selector" id="theme-selector-box">
                <div class="theme-btn theme-ice" onclick="setRadioTheme('ICE')" title="ICE White"></div>
                <div class="theme-btn theme-slime" onclick="setRadioTheme('SLIME')" title="SLIME Green"></div>
                <div class="theme-btn theme-opium" onclick="setRadioTheme('OPIUM')" title="OPIUM Red"></div>
                <div class="theme-btn theme-purple" onclick="setRadioTheme('PURPLE')" title="LEAN Purple"></div>
                <div class="theme-btn theme-gold" onclick="setRadioTheme('GOLD')" title="CHAMPAGNE Gold"></div>
            </div>
            <div class="volume-control-box" id="volume-box">
                <button class="volume-btn" id="mute-btn">🔊</button>
                <input type="range" class="volume-slider" id="volume-range" min="0" max="100" value="100">
            </div>
        </div>

        <div class="soundboard-container">
            <button class="pad-btn" onclick="playAdlib('metro')">
                <span class="pad-icon">🎙️</span>
                <span>METRO!!</span>
            </button>
            <button class="pad-btn" onclick="playAdlib('damn')">
                <span class="pad-icon">🔊</span>
                <span>DAMN SON!</span>
            </button>
            <button class="pad-btn" onclick="playAdlib('siren')">
                <span class="pad-icon">🚨</span>
                <span>TRAP SIREN</span>
            </button>
            <button class="pad-btn" onclick="playAdlib('gun')">
                <span class="pad-icon">💥</span>
                <span>808 GUN</span>
            </button>
        </div>

        <div class="video-container" id="video-box">
            <div class="yt-shield-top-main"></div>
            <div class="yt-shield-bottom-left"></div>
            <div class="yt-shield-bottom-edge"></div>

            <div id="start-overlay">
                <button class="start-btn" id="start-btn-el">CANLI YAYINA KATIL</button>
            </div>
            <div id="youtube-player"></div>
        </div>

        <div class="utility-bar">
            <button class="util-btn" onclick="toggleSlimeRain()">
                <span>🐍</span>
                <span>SLIME RAIN</span>
            </button>
            <button class="util-btn" onclick="triggerRageMode()">
                <span>🔥</span>
                <span>RAGE SHAKE</span>
            </button>
            <button class="util-btn" onclick="openTagModal()">
                <span>🎨</span>
                <span>SPRAY TAG</span>
            </button>
        </div>

        <div class="now-playing-card">
            <div class="track-info">
                <span class="track-label">
                    <span style="display:inline-block; width:6px; height:6px; background:var(--accent-color); border-radius:50%; box-shadow:0 0 10px var(--accent-color);"></span>
                    YAYINDA
                    <div class="wave-bars" id="wave-bars" style="opacity: 0;">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>
                </span>
                <span class="track-title" id="current-track-name">Canlı Yayın Bekleniyor...</span>
            </div>
            <div class="next-track">
                <div class="track-label" style="justify-content: flex-end;">SIRADAKİ</div>
                <span id="next-track-name" style="font-weight:700;">---</span>
            </div>
        </div>

        <canvas id="visualizer-canvas"></canvas>

        /* TRAP AD-LIB SOUNDBOARD AUDIO SYNTHESIZER & SAMPLES */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playAdlib(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const now = audioCtx.currentTime;

            if (type === 'metro') {
                // Synthesized Voice/Shout Simulation
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.exponentialRampToValueAtTime(440, now + 0.15);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.4);
                gain.gain.setValueAtTime(0.8, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'damn') {
                // Drop Synth Sweep
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, now);
                osc.frequency.exponentialRampToValueAtTime(80, now + 0.5);
                gain.gain.setValueAtTime(0.7, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'siren') {
                // Trap Siren Pitch Slide
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.25);
                osc.frequency.linearRampToValueAtTime(600, now + 0.5);
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'gun') {
                // Sub-808 Gunshot Sub Boom
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(30, now + 0.3);
                gain.gain.setValueAtTime(1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }

        const STREAM_START_TIME = 1700000000; 

        function getDeterministicShuffledList(array, seed) {
            let shuffled = [...array];
            let m = shuffled.length, t, i;
            let pseudoRandom = function() {
                let z = (seed += 0x6D2B79F5);
                z = Math.imul(z ^ (z >>> 15), z | 1);
                z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
                return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
            };

            while (m) {
                i = Math.floor(pseudoRandom() * m--);
                t = shuffled[m];
                shuffled[m] = shuffled[i];
                shuffled[i] = t;
            }
            return shuffled;
        }

        const songList = getDeterministicShuffledList(baseSongList, STREAM_START_TIME);
        const totalPlaylistDuration = songList.reduce((acc, song) => acc + song.duration, 0);

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const elapsedTime = (nowInSeconds - STREAM_START_TIME) % totalPlaylistDuration;
            let accumulatedTime = 0;
            for (let i = 0; i < songList.length; i++) {
                if (elapsedTime < accumulatedTime + songList[i].duration) {
                    return {
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += songList[i].duration;
            }
            return { songIndex: 0, seekTo: 0 };
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {

        }

        function syncToLiveStream() {
            if (!isPlayerReady || !player || !userHasClicked) return;

            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];

            updateTrackLabels(state.songIndex);

            if (currentLoadedVideoId !== targetSong.id) {
                currentLoadedVideoId = targetSong.id;
                player.loadVideoById({
                    videoId: targetSong.id,
                    startSeconds: Math.floor(state.seekTo)
                });
                player.playVideo();
                return;
            }

            if (typeof player.getCurrentTime === 'function') {
                const currentTime = player.getCurrentTime();
                const timeDiff = Math.abs(currentTime - state.seekTo);
                
                if (timeDiff > 1.5) {
                    player.seekTo(state.seekTo, true);
                    if (typeof player.getPlayerState === 'function' && player.getPlayerState() !== YT.PlayerState.PLAYING) {
                        player.playVideo();
                    }
                }
            }
        }

        function handleUserClick(e) {

                if (syncCheckInterval) clearInterval(syncCheckInterval);

        for (let i = 0; i < ringBarsCount; i++) {
            const barGeo = new THREE.BoxGeometry(0.04, 0.45, 0.04);

            const bar = new THREE.Mesh(barGeo, barMat);
            
            const angle = (i / ringBarsCount) * Math.PI * 2;

        function animateGlobe(currentTime) {
            requestAnimationFrame(animateGlobe);

            const deltaTime = (currentTime - lastTime) / 1000;

            const globeSpeed = isPlayingState ? 0.6 : 0.15;

                if (bgText1El && bgText2El) {
                    bgText1El.style.transform = `rotate(-10deg) scale(${1 + bassPower * 0.03})`;
                    bgText2El.style.transform = `rotate(8deg) scale(${1 + bassPower * 0.03})`;
                }

                if (bassPower > 0.6) {
                    badgeLiveEl.classList.add('badge-bass-pulse');
                    badgeListenerEl.classList.add('badge-bass-pulse');
                    themeSelectorEl.classList.add('badge-bass-pulse');
                    volumeBoxEl.classList.add('badge-bass-pulse');
                } else {
                    badgeLiveEl.classList.remove('badge-bass-pulse');
                    badgeListenerEl.classList.remove('badge-bass-pulse');
                    themeSelectorEl.classList.remove('badge-bass-pulse');
                    volumeBoxEl.classList.remove('badge-bass-pulse');
                }

                if (bassPower > 0.8) {
                    mainWrapper.classList.add('wrapper-glitch');
                } else {
                    mainWrapper.classList.remove('wrapper-glitch');
                }

                if (bassPower > 0.85) {
                    lightningEl.style.opacity = (Math.random() > 0.35 ? (0.3 + (bassPower - 0.85) * 1.2) : 0).toString();
                } else {
                    lightningEl.style.opacity = '0';
                }

                ringBarMeshes.forEach((bar, idx) => {
                    const rnd = Math.sin(bassAngle * 3 + idx) * 0.5 + 0.5;
                    const scaleY = 0.5 + rnd * 2.5 * (bassPower + 0.35);
                    bar.scale.set(1, scaleY, 1);
                    bar.material.opacity = 0.5 + rnd * 0.5;
                });

            } else {
                globeMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 10 * deltaTime);
                dirLight.intensity = 2.2;
                ambientGlowEl.style.transform = `translate(-50%, -50%) scale(1)`;
                ambientGlowEl.style.opacity = '0.4';
                lightningEl.style.opacity = '0';
                videoBoxEl.style.transform = `scale(1)`;
                mainWrapper.classList.remove('wrapper-glitch');
                badgeLiveEl.classList.remove('badge-bass-pulse');
                badgeListenerEl.classList.remove('badge-bass-pulse');
                themeSelectorEl.classList.remove('badge-bass-pulse');
                volumeBoxEl.classList.remove('badge-bass-pulse');

                if (tag1El && tag2El) {
                    tag1El.style.transform = `rotate(-25deg) scale(1)`;
                    tag2El.style.transform = `rotate(15deg) scale(1)`;
                    tag1El.style.opacity = '0.12';
                    tag2El.style.opacity = '0.12';
                }

                if (bgText1El && bgText2El) {
                    bgText1El.style.transform = `rotate(-10deg) scale(1)`;
                    bgText2El.style.transform = `rotate(8deg) scale(1)`;
                }

                ringBarMeshes.forEach((bar) => {
                    bar.scale.set(1, 0.4, 1);
                    bar.material.opacity = 0.2;
                });
            }

            renderer.render(scene, camera);
        }
        
        resizeThreeJS();
        requestAnimationFrame(animateGlobe);

        /* TRAP SPARKLE / PARÇACIK EFEKTİ */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function handleResize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            resizeThreeJS();
        }
        window.addEventListener('resize', handleResize);
        handleResize();

        class CleanDotParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.8 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.pulseSpeed = Math.random() * 0.05 + 0.02;
            }
            update() {
                const speedMult = isPlayingState ? 2.0 : 1.0;
                this.x += this.speedX * speedMult;
                this.y += this.speedY * speedMult;
                this.opacity += Math.sin(Date.now() * this.pulseSpeed) * 0.025;
                if (this.opacity < 0.1) this.opacity = 0.1;
                if (this.opacity > 0.85) this.opacity = 0.85;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = currentAccentColor;
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        const particleCount = isMobileDevice ? 35 : 70;
        for (let i = 0; i < particleCount; i++) particlesArray.push(new CleanDotParticle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

            if (snap.val() === true) {
                const con = myConnectionsRef.push();
                con.onDisconnect().remove();
                con.set(true);
            }

        myConnectionsRef.on('value', (snap) => {
            document.getElementById('listener-count').innerText = snap.numChildren();
        });

        /* TRAP CANLI VISUALIZER BARLARI */
        const vCanvas = document.getElementById('visualizer-canvas');
        const vCtx = vCanvas.getContext('2d');
        const numBars = isMobileDevice ? 32 : 60;
        let barHeights = new Array(numBars).fill(2);
        let peakHeights = new Array(numBars).fill(2);

        function drawVisualizer() {
            vCanvas.width = vCanvas.offsetWidth;
            vCanvas.height = vCanvas.offsetHeight;
            vCtx.clearRect(0, 0, vCanvas.width, vCanvas.height);

            const gap = 2;
            const barWidth = (vCanvas.width / numBars) - gap;

            for (let i = 0; i < numBars; i++) {
                if (isPlayingState) {
                    const centerFactor = 1 - Math.abs((i - numBars / 2) / (numBars / 2)) * 0.35;
                    const target = (Math.random() * (vCanvas.height - 2) + 2) * centerFactor;
                    barHeights[i] += (target - barHeights[i]) * 0.42;
                } else {
                    barHeights[i] += (2 - barHeights[i]) * 0.15;
                }

                if (barHeights[i] > peakHeights[i]) {
                    peakHeights[i] = barHeights[i];
                } else {
                    peakHeights[i] -= 0.5;
                }
                if (peakHeights[i] < 2) peakHeights[i] = 2;

                const x = i * (barWidth + gap);
                const y = vCanvas.height - barHeights[i];

                const grad = vCtx.createLinearGradient(0, vCanvas.height, 0, 0);
                grad.addColorStop(0, 'rgba(255, 255, 255, 0.15)');
                grad.addColorStop(1, currentAccentColor);

                vCtx.fillStyle = grad;
                vCtx.fillRect(x, y, barWidth, barHeights[i]);

                vCtx.fillStyle = currentAccentColor;
                vCtx.shadowColor = currentAccentColor;
                vCtx.shadowBlur = 10;
                vCtx.fillRect(x, vCanvas.height - peakHeights[i] - 1, barWidth, 1.5);
                vCtx.shadowBlur = 0;
            }
            requestAnimationFrame(drawVisualizer);
        }
        drawVisualizer();
    </script>
