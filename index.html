<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EA$Y FM | 7/24 YÜZDE YÜZ MÜZİK</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Syne:wght@800;900&family=Montserrat:wght@400;700;900&family=Permanent+Marker&family=UnifrakturCook:wght@700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --accent-color: #ffffff;
            --glow-color: rgba(255, 255, 255, 0.55);
            --bg-glow: rgba(180, 220, 255, 0.1);
            --border-glow: rgba(255, 255, 255, 0.35);
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            background-color: #020202;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden !important;
            touch-action: none;
            position: fixed;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* CRT TARAMA & VIGNETTE EFEKTI */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 25%, #000000 120%);
            z-index: 45;
            pointer-events: none;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.45) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
            z-index: 50;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            opacity: 0.6;
        }

        /* ARKA PLAN GRAFFITI / GOTIK ARKA PLAN YAZILARI */
        .trap-bg-text {
            position: fixed;
            font-family: 'UnifrakturCook', cursive;
            color: rgba(255, 255, 255, 0.04);
            font-size: 22vw;
            z-index: 1;
            pointer-events: none;
            text-transform: uppercase;
            white-space: nowrap;
            letter-spacing: -3px;
            text-shadow: 0 0 35px var(--glow-color);
            filter: blur(1px);
            transition: color 0.1s ease, transform 0.1s ease;
            will-change: transform;
            transform-origin: center center;
        }

        .trap-bg-text.top-left {
            top: -6%;
            left: -12%;
            transform: rotate(-10deg);
        }

        .trap-bg-text.bottom-right {
            bottom: -10%;
            right: -12%;
            transform: rotate(8deg);
        }

        .spray-tag {
            position: fixed;
            font-family: 'Permanent Marker', cursive;
            color: var(--accent-color);
            opacity: 0.12;
            font-size: 10vw;
            z-index: 1;
            pointer-events: none;
            text-shadow: 0 0 20px var(--glow-color);
            will-change: transform, opacity;
            transform-origin: center center;
            transition: transform 0.08s ease, opacity 0.08s ease;
        }

        .spray-tag.tag1 { top: 35%; left: 2%; transform: rotate(-25deg); }
        .spray-tag.tag2 { top: 15%; right: 3%; transform: rotate(15deg); }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* DİNAMİK BASS LIGHTNING FLASH */
        #lightning-flash {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--accent-color);
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            mix-blend-mode: overlay;
            will-change: opacity;
            transition: opacity 0.05s ease;
        }

        /* AMBIENT NEON GLOW */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95vw;
            height: 95vh;
            background: radial-gradient(circle, var(--glow-color) 0%, var(--bg-glow) 50%, rgba(0, 0, 0, 0) 80%);
            z-index: 4;
            pointer-events: none;
            will-change: transform, opacity;
            filter: blur(70px);
            transition: transform 0.08s ease, opacity 0.08s ease;
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 680px;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom)) 14px;
            gap: 8px;
            margin: 0 auto;
            box-sizing: border-box;
            will-change: transform, filter;
        }

        .wrapper-shake {
            animation: trapBassShake 0.05s ease-in-out infinite alternate;
        }

        .wrapper-glitch {
            filter: drop-shadow(-2px 0 0 rgba(255,0,0,0.5)) drop-shadow(2px 0 0 rgba(0,255,255,0.5));
        }

        @keyframes trapBassShake {
            0% { transform: scale(1) translate(0, 0); }
            50% { transform: scale(1.01) translate(-2px, 2px); }
            100% { transform: scale(0.99) translate(2px, -2px); }
        }

        .logo-container {
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 420px;
            height: clamp(160px, 26vh, 250px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: visible;
            margin: 0 auto;
            flex-shrink: 0;
        }

        @media (min-width: 769px) {
            .logo-container {
                max-width: 620px;
                height: clamp(220px, 32vh, 340px);
            }
        }

        #globe-3d-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
            overflow: visible;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #globe-3d-container canvas {
            display: block;
            outline: none;
            filter: drop-shadow(0 0 40px var(--glow-color));
        }

        /* STATUS BAR */
        .status-bar {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 100%;
            flex-shrink: 0;
            padding: 0 2px;
        }

        .badge {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            padding: 6px 12px;
            border-radius: 40px;
            font-size: 9px;
            font-weight: 900;
            letter-spacing: 1.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), inset 0 0 12px rgba(255, 255, 255, 0.08);
            white-space: nowrap;
            transition: transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
        }

        .theme-selector {
            display: flex;
            gap: 6px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--border-glow);
            padding: 5px 10px;
            border-radius: 40px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
            transition: transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
        }

        .theme-btn {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.2s ease;
            position: relative;
        }

        .theme-btn:active { transform: scale(0.6); }

        .theme-ice { background: #ffffff; box-shadow: 0 0 14px #fff; }
        .theme-slime { background: #39ff14; box-shadow: 0 0 14px #39ff14; }
        .theme-opium { background: #ff0000; box-shadow: 0 0 14px #ff0000; }
        .theme-purple { background: #a855f7; box-shadow: 0 0 14px #a855f7; }
        .theme-gold { background: #ffd700; box-shadow: 0 0 14px #ffd700; }

        .live-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 14px var(--accent-color);
            animation: pulse 0.8s infinite alternate;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0.1; transform: scale(0.3); }
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(10, 10, 10, 0.85);
            border: 1px solid var(--border-glow);
            padding: 5px 12px;
            border-radius: 40px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9);
            transition: transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease;
            pointer-events: none;
        }

        .badge-bass-pulse {
            transform: scale(1.05) !important;
            border-color: var(--accent-color) !important;
            box-shadow: 0 0 25px var(--glow-color), inset 0 0 15px var(--glow-color) !important;
        }

        .volume-btn {
            background: none;
            border: none;
            color: #fff;
            cursor: pointer;
            font-size: 11px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 45px;
            height: 3px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            cursor: pointer;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 12px var(--accent-color);
        }

        /* TRAP SOUNDBOARD / PRODUCER SOUND PADS */
        .soundboard-container {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            flex-shrink: 0;
            margin: 2px 0;
        }

        .pad-btn {
            background: rgba(15, 15, 15, 0.85);
            border: 1px solid var(--border-glow);
            border-radius: 12px;
            padding: 8px 4px;
            color: #fff;
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            text-transform: uppercase;
            backdrop-filter: blur(15px);
            transition: transform 0.08s ease, border-color 0.08s ease, box-shadow 0.08s ease, background 0.1s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }

        .pad-btn:active {
            transform: scale(0.92) !important;
            background: var(--accent-color);
            color: #000;
            box-shadow: 0 0 25px var(--accent-color) !important;
        }

        .pad-icon {
            font-size: 12px;
        }

        /* VIDEO CONTAINER & CYBER BORDER */
        .video-container {
            position: relative;
            width: 100%;
            flex: 1 1 auto;
            min-height: 130px;
            max-height: 35vh;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 16px 50px rgba(0, 0, 0, 0.95);
            border: 1px solid var(--border-glow);
            transition: border-color 0.08s, box-shadow 0.08s, transform 0.08s ease;
            background: #000;
            margin: 2px 0;
            will-change: transform;
        }

        .video-container.playing-border {
            border-color: var(--accent-color);
            box-shadow: 0 0 40px var(--glow-color), inset 0 0 25px var(--glow-color);
        }

        #stream-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }

        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(10, 10, 10, 0.96) 0%, rgba(0, 0, 0, 0.99) 100%);
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .start-btn {
            background: var(--accent-color);
            color: #000;
            font-family: 'Syne', sans-serif;
            font-weight: 900;
            font-size: 11px;
            padding: 16px 42px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 3.5px;
            box-shadow: 0 0 45px var(--accent-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
        }

        .start-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 65px var(--accent-color);
        }

        /* NOW PLAYING CARD */
        .now-playing-card {
            width: 100%;
            background: rgba(12, 12, 12, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glow);
            border-radius: 16px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.95);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
            will-change: transform;
            transition: transform 0.08s ease;
        }

        .track-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
            max-width: 58%;
        }

        .track-label {
            font-size: 8px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #888;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .track-title {
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            font-weight: 900;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
            letter-spacing: 0.5px;
        }

        .next-track {
            font-size: 8.5px;
            color: #aaa;
            text-align: right;
            max-width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .wave-bars {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
            margin-left: 4px;
        }

        .wave-bar {
            width: 2.5px;
            background: var(--accent-color);
            border-radius: 1px;
            box-shadow: 0 0 8px var(--accent-color);
            animation: waveAnim 0.5s ease-in-out infinite alternate;
        }

        .wave-bar:nth-child(1) { height: 35%; animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { height: 90%; animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { height: 55%; animation-delay: 0.2s; }
        .wave-bar:nth-child(4) { height: 100%; animation-delay: 0.4s; }

        @keyframes waveAnim {
            0% { transform: scaleY(0.2); }
            100% { transform: scaleY(1); }
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="trap-bg-text top-left" id="bg-text-1">EA$Y WORLDWIDE</div>
    <div class="trap-bg-text bottom-right" id="bg-text-2">OPIUM 808</div>

    <div class="spray-tag tag1" id="tag1">YSL</div>

    <div class="ambient-glow" id="ambient-glow"></div>

    <div class="main-wrapper" id="main-wrapper">

    <script>
        document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

        /* TEMA KONTROLÜ */
        let currentAccentColor = '#ffffff';
        const THEMES = {
            ICE: { accent: '#ffffff', glow: 'rgba(255, 255, 255, 0.55)', bgGlow: 'rgba(180, 220, 255, 0.1)', borderGlow: 'rgba(255, 255, 255, 0.35)' },
            SLIME: { accent: '#39ff14', glow: 'rgba(57, 255, 20, 0.6)', bgGlow: 'rgba(0, 255, 50, 0.12)', borderGlow: 'rgba(57, 255, 20, 0.4)' },
            OPIUM: { accent: '#ff0000', glow: 'rgba(255, 0, 0, 0.65)', bgGlow: 'rgba(255, 0, 0, 0.12)', borderGlow: 'rgba(255, 0, 0, 0.4)' },
            PURPLE: { accent: '#a855f7', glow: 'rgba(168, 85, 247, 0.65)', bgGlow: 'rgba(168, 85, 247, 0.12)', borderGlow: 'rgba(168, 85, 247, 0.4)' },
            GOLD: { accent: '#ffd700', glow: 'rgba(255, 215, 0, 0.65)', bgGlow: 'rgba(255, 215, 0, 0.12)', borderGlow: 'rgba(255, 215, 0, 0.4)' }
        };

        function setRadioTheme(mode) {
            const t = THEMES[mode];
            currentAccentColor = t.accent;
            document.documentElement.style.setProperty('--accent-color', t.accent);
            document.documentElement.style.setProperty('--glow-color', t.glow);
            document.documentElement.style.setProperty('--bg-glow', t.bgGlow);
            document.documentElement.style.setProperty('--border-glow', t.borderGlow);

            document.querySelectorAll('.spray-tag').forEach(el => {
                el.style.color = t.accent;
            });

            if (ringBarMeshes) {
                const hexColor = parseInt(t.accent.replace('#', '0x'));
                ringBarMeshes.forEach(b => b.material.color.setHex(hexColor));
            }
        }

        /* SOUNDBOARD SES EFEKTLERİ */
        const adlibUrls = {
            metro: 'https://raw.githubusercontent.com/easydcsm/easyfm/main/Metroboomin%20producer%20tags%20-%20Every%20tags%20clean%20(mp3cut%20(mp3cut.net).mp3',
            damn: 'https://raw.githubusercontent.com/easydcsm/easyfm/main/Damn%20Son%20Whered%20You%20Find%20This%20(Sound%20Effect)%20(mp3cut.net).mp3',
            wheezy: 'https://raw.githubusercontent.com/easydcsm/easyfm/main/WHEEZY%20OUTTA%20HERE%20OFFICIAL%20PRODUCER%20TAG%20(ORIGINAL)%20(mp3cut.net).mp3',
            f1lthy: "https://raw.githubusercontent.com/easydcsm/easyfm/main/F1LTHY%20'WAKE%20UP%20FILTHY'%20OFFICIAL%20PRODUCER%20TAG%20(mp3cut.net).mp3"
        };

        const adlibBuffers = {};

        async function preloadAdlib(type, url) {
            try {
                const response = await fetch(url);
                const arrayBuffer = await response.arrayBuffer();
                if (audioCtx) {
                    adlibBuffers[type] = await audioCtx.decodeAudioData(arrayBuffer);
                }
            } catch (e) {}
        }

        function playAdlib(type) {
            if (!audioCtx) initAudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            if (adlibBuffers[type]) {
                const source = audioCtx.createBufferSource();
                source.buffer = adlibBuffers[type];
                const gain = audioCtx.createGain();
                gain.gain.value = 1.8;
                source.connect(gain);
                gain.connect(audioCtx.destination);
                source.start(0);
            } else {
                preloadAdlib(type, adlibUrls[type]).then(() => {
                    if (adlibBuffers[type]) {
                        const source = audioCtx.createBufferSource();
                        source.buffer = adlibBuffers[type];
                        const gain = audioCtx.createGain();
                        gain.gain.value = 1.8;
                        source.connect(gain);
                        gain.connect(audioCtx.destination);
                        source.start(0);
                    }
                });
            }
        }

        /* GITHUB RASTGELE CANLI YAYIN ALGORİTMASI */
        const baseSongList = [
            { url: 'https://raw.githubusercontent.com/easydcsm/easyfm/main/franchise.mp4', duration: 120, title: 'FRANCHISE' },
            { url: 'https://raw.githubusercontent.com/easydcsm/easyfm/main/outwest.mp4', duration: 207, title: 'OUT WEST' }, 
            { url: 'https://raw.githubusercontent.com/easydcsm/easyfm/main/brotherstone.mp4', duration: 236, title: 'BROTHER STONE' }, 
            { url: 'https://raw.githubusercontent.com/easydcsm/easyfm/main/withthat.mp4', duration: 204, title: 'WITH THAT' }
        ];

        const STREAM_START_TIME = 1700000000; 

        function getPseudoRandomNumber(seed) {
            let z = (seed += 0x6D2B79F5);
            z = Math.imul(z ^ (z >>> 15), z | 1);
            z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
            return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
        }

        function generateStreamSequence() {
            let sequence = [];
            let lastPlayed = [];
            let currentSeed = STREAM_START_TIME;

            for (let i = 0; i < 500; i++) {
                let availableIndices = [];
                for (let j = 0; j < baseSongList.length; j++) {
                    if (!lastPlayed.includes(j)) {
                        availableIndices.push(j);
                    }
                }
                
                if (availableIndices.length === 0) {
                    availableIndices = baseSongList.map((_, idx) => idx);
                }

                let rnd = getPseudoRandomNumber(currentSeed++);
                let chosenIndex = availableIndices[Math.floor(rnd * availableIndices.length)];
                
                sequence.push(baseSongList[chosenIndex]);
                
                lastPlayed.push(chosenIndex);
                if (lastPlayed.length > 4) {
                    lastPlayed.shift();
                }
            }
            return sequence;
        }

        const songList = generateStreamSequence();
        const totalPlaylistDuration = songList.reduce((acc, song) => acc + song.duration, 0);

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const elapsedTime = (nowInSeconds - STREAM_START_TIME) % totalPlaylistDuration;
            let accumulatedTime = 0;
            for (let i = 0; i < songList.length; i++) {
                if (elapsedTime < accumulatedTime + songList[i].duration) {
                    return {
                        songIndex: i,
                        seekTo: elapsedTime - accumulatedTime
                    };
                }
                accumulatedTime += songList[i].duration;
            }
            return { songIndex: 0, seekTo: 0 };
        }

        function updateTrackLabels(currentIndex) {
            const currentSong = songList[currentIndex];
            const nextIndex = (currentIndex + 1) % songList.length;
            const nextSong = songList[nextIndex];

            document.getElementById('current-track-name').innerText = currentSong.title;
            document.getElementById('next-track-name').innerText = nextSong.title;
        }

        const videoPlayer = document.getElementById('stream-player');
        let audioCtx = null;
        let analyser = null;
        let audioSource = null;
        let dataArray = null;
        let liveBassLevel = 0;

        let userHasClicked = false;
        let isPlayingState = false;
        let currentLoadedUrl = null;
        let syncCheckInterval = null;

        /* TEMİZ, BOZULMASIZ VE TAM UYUMLU AUDIO CONTEXT */
        function initAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                audioSource = audioCtx.createMediaElementSource(videoPlayer);

                // Ses bozucu ve patlatıcı tüm ekstra filtreler kaldırıldı.
                // Ses doğrudan hoparlörlere/kulaklığa pürüzsüz aktarılıyor.
                audioSource.connect(audioCtx.destination);

                /* ANALİZÖR: RİTMİK VE AKICI BAS TEPKİSİ */
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 256;
                analyser.smoothingTimeConstant = 0.8; // Görsel dalgalanmaların akıcı olması için yumuşatıldı

                const bassFilter = audioCtx.createBiquadFilter();
                bassFilter.type = 'lowpass';
                bassFilter.frequency.setValueAtTime(140, audioCtx.currentTime); // Gerçek 808 ve Sub-Bass bandı

                audioSource.connect(bassFilter);
                bassFilter.connect(analyser);

                dataArray = new Uint8Array(analyser.frequencyBinCount);

                Object.keys(adlibUrls).forEach(k => preloadAdlib(k, adlibUrls[k]));
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        const initialState = getCurrentStreamState();
        updateTrackLabels(initialState.songIndex);

        const mainWrapper = document.getElementById('main-wrapper');

        function updateAudioVisualState() {
            const vBox = document.getElementById('video-box');
            const waveBars = document.getElementById('wave-bars');

            if (!userHasClicked || videoPlayer.muted || videoPlayer.paused) {
                isPlayingState = false;
                vBox.classList.remove('playing-border');
                waveBars.style.opacity = '0';
                mainWrapper.classList.remove('wrapper-shake');
            } else {
                isPlayingState = true;
                vBox.classList.add('playing-border');
                waveBars.style.opacity = '1';
            }
        }

        function syncToLiveStream() {
            if (!userHasClicked) return;

            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];

            updateTrackLabels(state.songIndex);

            if (currentLoadedUrl !== targetSong.url) {
                currentLoadedUrl = targetSong.url;
                videoPlayer.src = targetSong.url;
                videoPlayer.currentTime = state.seekTo;
                videoPlayer.play().catch(() => {});
                return;
            }

            const timeDiff = Math.abs(videoPlayer.currentTime - state.seekTo);
            if (timeDiff > 1.5) {
                videoPlayer.currentTime = state.seekTo;
                if (videoPlayer.paused) {
                    videoPlayer.play().catch(() => {});
                }
            }
        }

        function handleUserClick(e) {
            if (e) e.preventDefault();
            if (userHasClicked) return;
            userHasClicked = true;

            initAudioContext();
            document.getElementById('volume-box').style.pointerEvents = 'auto';

            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            setTimeout(() => { overlay.style.display = 'none'; }, 300);

            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];

            updateTrackLabels(state.songIndex);

            currentLoadedUrl = targetSong.url;
            videoPlayer.src = targetSong.url;
            videoPlayer.currentTime = state.seekTo;
            videoPlayer.volume = Number(volumeRange.value) / 100;
            videoPlayer.muted = false;

            videoPlayer.play().then(() => {
                updateAudioVisualState();
            }).catch(() => {});

            if (syncCheckInterval) clearInterval(syncCheckInterval);
            syncCheckInterval = setInterval(syncToLiveStream, 1000);
        }

        const startOverlay = document.getElementById('start-overlay');
        const startBtnEl = document.getElementById('start-btn-el');

        startOverlay.addEventListener('click', handleUserClick, { passive: false });
        startOverlay.addEventListener('touchstart', handleUserClick, { passive: false });
        startBtnEl.addEventListener('click', handleUserClick, { passive: false });
        startBtnEl.addEventListener('touchstart', handleUserClick, { passive: false });

        videoPlayer.addEventListener('play', updateAudioVisualState);
        videoPlayer.addEventListener('pause', updateAudioVisualState);
        videoPlayer.addEventListener('ended', syncToLiveStream);

        const volumeRange = document.getElementById('volume-range');
        const muteBtn = document.getElementById('mute-btn');
        let isMuted = false;

        volumeRange.addEventListener('input', (e) => {
            const val = Number(e.target.value);
            videoPlayer.volume = val / 100;
            if (val === 0) {
                videoPlayer.muted = true;
                muteBtn.innerText = '🔇';
                isMuted = true;
            } else {
                videoPlayer.muted = false;
                muteBtn.innerText = '🔊';
                isMuted = false;
            }
            updateAudioVisualState();
        });

        muteBtn.addEventListener('click', () => {
            if (isMuted) {
                videoPlayer.muted = false;
                muteBtn.innerText = '🔊';
                let currentVol = Number(volumeRange.value);
                if (currentVol === 0) {
                    currentVol = 100;
                    volumeRange.value = 100;
                }
                videoPlayer.volume = currentVol / 100;
                isMuted = false;
            } else {
                videoPlayer.muted = true;
                muteBtn.innerText = '🔇';
                volumeRange.value = 0;
                isMuted = true;
            }
            updateAudioVisualState();
        });

        /* THREE.JS DÜNYA & TRAP HALKASI */
        const globeContainer = document.getElementById('globe-3d-container');
        
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
        
        const isMobileDevice = window.innerWidth <= 768;
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: !isMobileDevice, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        globeContainer.appendChild(renderer.domElement);

        function resizeThreeJS() {
            const width = globeContainer.clientWidth;
            const height = globeContainer.clientHeight;
            if (width === 0 || height === 0) return;

            camera.aspect = width / height;

            if (window.innerWidth > 768) {
                camera.position.z = 5.2;
            } else if (window.innerHeight <= 650) {
                camera.position.z = 5.8;
            } else if (window.innerWidth <= 600) {
                camera.position.z = 5.5;
            } else {
                camera.position.z = 5.0;
            }

            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/textures/planets/earth_atmos_2048.jpg');

        const baseRadius = 1.5;
        const segments = isMobileDevice ? 32 : 64;
        const geometry = new THREE.SphereGeometry(baseRadius, segments, segments);
        const material = new THREE.MeshStandardMaterial({
            map: earthTexture,
            roughness: 0.35,
            metalness: 0.55
        });
        const globeMesh = new THREE.Mesh(geometry, material);
        scene.add(globeMesh);

        /* 3D TRAP HALKASI */
        const ringBarsCount = isMobileDevice ? 44 : 80;
        const ringBarsGroup = new THREE.Group();
        const ringBarMeshes = [];

        for (let i = 0; i < ringBarsCount; i++) {
            const barGeo = new THREE.BoxGeometry(0.035, 0.35, 0.035);
            const barMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 });
            const bar = new THREE.Mesh(barGeo, barMat);
            
            const angle = (i / ringBarsCount) * Math.PI * 2;
            const radius = baseRadius + 0.28;
            bar.position.set(Math.cos(angle) * radius, Math.sin(angle) * radius, -0.2);
            bar.rotation.z = angle - Math.PI / 2;
            
            ringBarsGroup.add(bar);
            ringBarMeshes.push(bar);
        }
        scene.add(ringBarsGroup);

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 3.2);
        dirLight.position.set(5, 4, 5);
        scene.add(dirLight);

        let ringMesh = null;

        function createOrbitRingText() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'transparent';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffffff';

            ctx.font = '900 70px "Montserrat", sans-serif';
            ctx.fillText("EA$Y FM", canvas.width / 2, 85);

            ctx.font = '800 28px "Space Grotesk", sans-serif';
            ctx.fillText("7/24 YÜZDE YÜZ MÜZİK", canvas.width / 2, 165);

            const ringTex = new THREE.CanvasTexture(canvas);
            ringTex.minFilter = THREE.LinearFilter;
            ringTex.magFilter = THREE.LinearFilter;

            const ringGeo = new THREE.CylinderGeometry(baseRadius + 0.35, baseRadius + 0.35, 0.75, isMobileDevice ? 32 : 64, 1, true);
            const ringMat = new THREE.MeshBasicMaterial({
                map: ringTex,
                transparent: true,
                side: THREE.DoubleSide,
                depthWrite: false
            });

            ringMesh = new THREE.Mesh(ringGeo, ringMat);
            ringMesh.rotation.z = 0.08;
            scene.add(ringMesh);
        }

        document.fonts.ready.then(() => { createOrbitRingText(); });

        const ambientGlowEl = document.getElementById('ambient-glow');
        const lightningEl = document.getElementById('lightning-flash');
        const badgeLiveEl = document.getElementById('badge-live');
        const badgeListenerEl = document.getElementById('badge-listener');
        const themeSelectorEl = document.getElementById('theme-selector-box');
        const volumeBoxEl = document.getElementById('volume-box');
        const videoBoxEl = document.getElementById('video-box');
        const nowPlayingCardEl = document.getElementById('now-playing-card-el');
        const tag1El = document.getElementById('tag1');
        const tag2El = document.getElementById('tag2');
        const bgText1El = document.getElementById('bg-text-1');
        const bgText2El = document.getElementById('bg-text-2');
        const soundboardPads = document.querySelectorAll('.soundboard-pad');

        let lastTime = performance.now();

        function animateGlobe(currentTime) {
            requestAnimationFrame(animateGlobe);

            const deltaTime = Math.min((currentTime - lastTime) / 1000, 0.1); 
            lastTime = currentTime;

            if (analyser && isPlayingState) {
                analyser.getByteFrequencyData(dataArray);
                
                // Bas frekanslarının (ilk 6 frekans kanalı) ortalamasını al
                let bassSum = 0;
                const bassBinsCount = 6;
                for (let i = 0; i < bassBinsCount; i++) {
                    bassSum += dataArray[i];
                }
                let rawBass = (bassSum / bassBinsCount) / 255.0;

                // Doğal ve yumuşak bas eşiği
                const HARD_BASS_THRESHOLD = 0.25; 

                if (rawBass > HARD_BASS_THRESHOLD) {
                    liveBassLevel = (rawBass - HARD_BASS_THRESHOLD) / (1.0 - HARD_BASS_THRESHOLD);
                } else {
                    liveBassLevel = 0;
                }
            } else {
                liveBassLevel = 0;
            }

            const globeSpeed = isPlayingState ? 0.6 : 0.15;
            const ringSpeed = isPlayingState ? 0.75 : 0.22;

            globeMesh.rotation.y += globeSpeed * deltaTime;
            if (ringMesh) ringMesh.rotation.y -= ringSpeed * deltaTime;
            ringBarsGroup.rotation.z += (isPlayingState ? 0.4 : 0.05) * deltaTime;

            if (isPlayingState) {
                const bassPower = liveBassLevel; 
                
                /* DÜNYA VE DENGELİ BASS RİTİMLERİ */
                const bassScale = 1 + bassPower * 0.18;
                globeMesh.scale.set(bassScale, bassScale, bassScale);
                ringBarsGroup.scale.set(1 + bassPower * 0.15, 1 + bassPower * 0.15, 1 + bassPower * 0.15);

                dirLight.intensity = 2.2 + bassPower * 4.0;

                const glowScale = 1 + bassPower * 0.35;
                ambientGlowEl.style.transform = `translate(-50%, -50%) scale(${glowScale})`;
                ambientGlowEl.style.opacity = (0.35 + bassPower * 0.35).toString();

                /* KUTULARIN ORANTILI TİTREŞİMİ */
                videoBoxEl.style.transform = `scale(${1 + bassPower * 0.02})`;
                if (nowPlayingCardEl) {
                    nowPlayingCardEl.style.transform = `scale(${1 + bassPower * 0.015})`;
                }

                /* GRAFFITI VE ARKA PLAN TEXTLERİ */
                if (tag1El && tag2El) {
                    tag1El.style.transform = `rotate(-25deg) scale(${1 + bassPower * 0.15})`;
                    tag2El.style.transform = `rotate(15deg) scale(${1 + bassPower * 0.15})`;
                    tag1El.style.opacity = (0.12 + bassPower * 0.4).toString();
                    tag2El.style.opacity = (0.12 + bassPower * 0.4).toString();
                }

                if (bgText1El && bgText2El) {
                    bgText1El.style.transform = `rotate(-10deg) scale(${1 + bassPower * 0.08})`;
                    bgText2El.style.transform = `rotate(8deg) scale(${1 + bassPower * 0.08})`;
                    bgText1El.style.color = bassPower > 0.4 ? 'rgba(255, 255, 255, 0.15)' : 'rgba(255, 255, 255, 0.04)';
                    bgText2El.style.color = bassPower > 0.4 ? 'rgba(255, 255, 255, 0.15)' : 'rgba(255, 255, 255, 0.04)';
                }

                /* BUTON & BADGE PARLAMALARI */
                if (bassPower > 0.35) {
                    badgeLiveEl.classList.add('badge-bass-pulse');
                    badgeListenerEl.classList.add('badge-bass-pulse');
                    themeSelectorEl.classList.add('badge-bass-pulse');
                    volumeBoxEl.classList.add('badge-bass-pulse');
                    soundboardPads.forEach(pad => pad.classList.add('badge-bass-pulse'));
                } else {
                    badgeLiveEl.classList.remove('badge-bass-pulse');
                    badgeListenerEl.classList.remove('badge-bass-pulse');
                    themeSelectorEl.classList.remove('badge-bass-pulse');
                    volumeBoxEl.classList.remove('badge-bass-pulse');
                    soundboardPads.forEach(pad => pad.classList.remove('badge-bass-pulse'));
                }

                /* Sadece Çok Sert Vuruşlarda Ekran Sallanması */
                if (bassPower > 0.75) {
                    mainWrapper.classList.add('wrapper-glitch');
                    mainWrapper.classList.add('wrapper-shake');
                } else {
                    mainWrapper.classList.remove('wrapper-glitch');
                    mainWrapper.classList.remove('wrapper-shake');
                }

                /* YILDIRIM ÇAKMASI */
                if (bassPower > 0.65) {
                    lightningEl.style.opacity = ((bassPower - 0.65) * 1.5).toString();
                } else {
                    lightningEl.style.opacity = '0';
                }

                /* HALKA ÇUBUKLARI - MÜKEMMEL ORANTILI BASS YÜKSELMESİ */
                ringBarMeshes.forEach((bar, idx) => {
                    // Her çubuğa frekans indeksine göre ritmik fark eklendi
                    const freqVal = (dataArray[idx % bassBinsCount] || 0) / 255.0;
                    const scaleY = 0.4 + freqVal * 2.8; 
                    bar.scale.set(1 + freqVal * 0.2, scaleY, 1 + freqVal * 0.2);
                    bar.material.opacity = 0.3 + freqVal * 0.7;
                });

            } else {
                globeMesh.scale.lerp(new THREE.Vector3(1, 1, 1), 10 * deltaTime);
                ringBarsGroup.scale.set(1, 1, 1);
                dirLight.intensity = 2.2;
                ambientGlowEl.style.transform = `translate(-50%, -50%) scale(1)`;
                ambientGlowEl.style.opacity = '0.4';
                lightningEl.style.opacity = '0';
                videoBoxEl.style.transform = `scale(1)`;
                if (nowPlayingCardEl) nowPlayingCardEl.style.transform = `scale(1)`;
                mainWrapper.classList.remove('wrapper-glitch');
                mainWrapper.classList.remove('wrapper-shake');
                badgeLiveEl.classList.remove('badge-bass-pulse');
                badgeListenerEl.classList.remove('badge-bass-pulse');
                themeSelectorEl.classList.remove('badge-bass-pulse');
                volumeBoxEl.classList.remove('badge-bass-pulse');
                soundboardPads.forEach(pad => pad.classList.remove('badge-bass-pulse'));

                if (tag1El && tag2El) {
                    tag1El.style.transform = `rotate(-25deg) scale(1)`;
                    tag2El.style.transform = `rotate(15deg) scale(1)`;
                    tag1El.style.opacity = '0.12';
                    tag2El.style.opacity = '0.12';
                }

                if (bgText1El && bgText2El) {
                    bgText1El.style.transform = `rotate(-10deg) scale(1)`;
                    bgText2El.style.transform = `rotate(8deg) scale(1)`;
                    bgText1El.style.color = 'rgba(255, 255, 255, 0.04)';
                    bgText2El.style.color = 'rgba(255, 255, 255, 0.04)';
                }

                ringBarMeshes.forEach((bar) => {
                    bar.scale.set(1, 0.4, 1);
                    bar.material.opacity = 0.2;
                });
            }

            renderer.render(scene, camera);
        }
        
        resizeThreeJS();
        requestAnimationFrame(animateGlobe);

        /* TRAP SPARKLE / PARÇACIK EFEKTİ */
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        function handleResize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            resizeThreeJS();
        }
        window.addEventListener('resize', handleResize);
        handleResize();

        class CleanDotParticle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2.8 + 0.8;
                this.speedX = (Math.random() - 0.5) * 0.6;
                this.speedY = (Math.random() - 0.5) * 0.6;
                this.opacity = Math.random() * 0.6 + 0.2;
                this.pulseSpeed = Math.random() * 0.05 + 0.02;
            }
            update() {
                const speedMult = isPlayingState ? 1.0 + liveBassLevel * 2.0 : 1.0;
                this.x += this.speedX * speedMult;
                this.y += this.speedY * speedMult;
                this.opacity += Math.sin(Date.now() * this.pulseSpeed) * 0.025;
                if (this.opacity < 0.1) this.opacity = 0.1;
                if (this.opacity > 0.85) this.opacity = 0.85;
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
            }
            draw() {
                ctx.fillStyle = currentAccentColor;
                ctx.globalAlpha = this.opacity;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        const particleCount = isMobileDevice ? 35 : 70;
        for (let i = 0; i < particleCount; i++) particlesArray.push(new CleanDotParticle());

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        /* FIREBASE DİNLENME TAKİBİ */
        const firebaseConfig = {
            apiKey: "AIzaSyBaTlb6V6e4FMLTYNXAPBgdzsgiclL8Qw8",
            authDomain: "easyfm-37b9e.firebaseapp.com",
            databaseURL: "https://easyfm-37b9e-default-rtdb.firebaseio.com",
            projectId: "easyfm-37b9e",
            storageBucket: "easyfm-37b9e.firebasestorage.app",
            messagingSenderId: "869244564550",
            appId: "1:869244564550:web:f0824148dbcae6b7024647"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const myConnectionsRef = db.ref('online_listeners');
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                const con = myConnectionsRef.push();
                con.onDisconnect().remove();
                con.set(true);
            }
        });
        myConnectionsRef.on('value', (snap) => {
            document.getElementById('listener-count').innerText = snap.numChildren();
        });
    </script>
