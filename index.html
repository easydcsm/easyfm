<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EA$Y FM - 24/7 TRAP RADIO</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #050505;
            color: #fff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw;
            height: 80vh;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.04) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* TOP BAR KONTROLLERİ */
        .top-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .glow-toggle-container, .airhorn-btn {
            background: rgba(17, 17, 17, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: #fff;
            font-weight: 900;
            font-size: 11px;
            letter-spacing: 1px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .airhorn-btn:hover {
            transform: scale(1.05);
            border-color: #fff;
        }

        .glow-toggle-label {
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #fff;
            text-transform: uppercase;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }

        .switch input { opacity: 0; width: 0; height: 0; }

        .slider-toggle {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 20px;
            border: 1px solid #555;
        }

        .slider-toggle:before {
            position: absolute;
            content: "";
            height: 12px;
            width: 12px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
            box-shadow: 0 0 5px #fff;
        }

        input:checked + .slider-toggle { background-color: #ffffff; }
        input:checked + .slider-toggle:before { transform: translateX(15px); background-color: #000; }

        body.diamond-mode-active .ambient-glow {
            background: radial-gradient(circle, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.02) 50%, rgba(0, 0, 0, 0) 75%);
        }
        body.diamond-mode-active h1 {
            text-shadow: 0 0 15px rgba(255, 255, 255, 1), 0 0 30px rgba(255, 255, 255, 0.8);
        }

        /* ANA LAYOUT: RADYO + CHAT GRID */
        .app-container {
            position: relative;
            z-index: 10;
            display: grid;
            grid-template-columns: 1fr 360px;
            max-width: 1300px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 40px 20px;
            gap: 30px;
            align-items: center;
        }

        .radio-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            margin: 0;
            font-family: 'Anton', sans-serif;
            font-size: 72px;
            letter-spacing: 5px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #a6a6a6 25%, #ffffff 50%, #737373 75%, #ffffff 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 20px rgba(255, 255, 255, 0.4);
            transform: skew(-4deg);
            animation: diamondShine 4s linear infinite;
        }

        @keyframes diamondShine {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 12px;
            color: #ffffff;
            letter-spacing: 6px;
            margin-top: 5px;
            text-transform: uppercase;
            opacity: 0.85;
        }

        .listener-badge {
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
            100% { opacity: 1; transform: scale(1); }
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            padding-bottom: 48%;
            height: 0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(255, 255, 255, 0.08);
            border: 1px solid #222222;
        }

        .video-container iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .click-toggle-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 15;
            cursor: pointer;
        }

        #start-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(5, 5, 5, 0.98);
            z-index: 30;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.5s ease;
        }

        .start-btn {
            background: #ffffff;
            color: #000;
            font-weight: 900;
            font-size: 15px;
            padding: 14px 36px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.4);
            transition: transform 0.2s;
        }

        .start-btn:hover { transform: scale(1.05); }

        .visualizer-container {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 5px;
            height: 25px;
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .visualizer-container.active { opacity: 1; }
        .v-bar {
            width: 4px;
            background: linear-gradient(to top, #666, #fff);
            border-radius: 3px;
            height: 10%;
            transition: height 0.1s ease;
        }

        .controls { margin-top: 15px; }

        .volume-control-panel {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(17, 17, 17, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 18px;
            border-radius: 30px;
        }

        .mute-btn {
            background: transparent;
            border: none;
            color: #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .mute-btn svg { width: 18px; height: 18px; fill: #ffffff; }

        .volume-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100px;
            height: 4px;
            border-radius: 5px;
            background: #333333;
            outline: none;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .volume-percentage { font-size: 11px; font-weight: 800; color: #888; min-width: 30px; text-align: right; }

        /* CANLI CHAT PANELİ STİLLERİ */
        .chat-section {
            background: rgba(12, 12, 12, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            height: 540px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .chat-header {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-weight: 900;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
        }

        .chat-header span { color: #888; font-size: 10px; }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .chat-messages::-webkit-scrollbar { width: 4px; }
        .chat-messages::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }

        .msg-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 12px;
            line-height: 1.4;
            word-break: break-word;
        }

        .msg-author {
            font-weight: 900;
            color: #fff;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .msg-badge {
            font-size: 9px;
            background: #fff;
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 900;
        }

        .msg-text { color: #ccc; }

        .chat-input-area {
            padding: 12px 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(0,0,0,0.4);
        }

        .chat-user-row {
            display: flex;
            gap: 8px;
        }

        .chat-input, .nickname-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-family: inherit;
            font-size: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        .nickname-input { width: 110px; font-weight: 800; }
        .chat-input { flex: 1; }

        .chat-input:focus, .nickname-input:focus {
            border-color: #fff;
        }

        .send-btn {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: 900;
            font-size: 11px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.15s;
        }

        .send-btn:hover { transform: scale(1.05); }

        /* RESPONSIVE DESIGN */
        @media (max-width: 950px) {
            .app-container {
                grid-template-columns: 1fr;
                padding-top: 80px;
            }
            .chat-section {
                height: 400px;
            }
        }

        @media (max-width: 600px) {
            h1 { font-size: 46px; }
            .top-controls { top: 12px; right: 12px; }
        }
    </style>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <!-- TOP CONTROL BAR -->

    <!-- Background Layers -->
    <canvas id="bg-canvas"></canvas>

    <div class="app-container">
        
        <!-- RADYO PLAYER ALANI -->
        <div class="radio-section">

                <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
                <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
                <div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div><div class="v-bar"></div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <div class="volume-control-panel">
                    <button id="mute-btn" class="mute-btn" onclick="toggleMute()" title="Sesi Aç / Kapat">
                        <svg id="volume-icon" viewBox="0 0 24 24">
                            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                        </svg>
                    </button>
                    <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="100" oninput="changeVolume(this.value)">
                    <span id="volume-text" class="volume-percentage">100%</span>

        <!-- CANLI CHAT ALANI -->
        <div class="chat-section">
            <div class="chat-header">
                LIVE CHAT <span>LIVE FEED</span>
            </div>
            <div class="chat-messages" id="chat-messages">
                <!-- Mesajlar Firebase üzerinden buraya dolacak -->
            </div>
            <div class="chat-input-area">
                <div class="chat-user-row">
                    <input type="text" id="nickname-input" class="nickname-input" placeholder="Rumuz..." maxlength="12">
                    <input type="text" id="chat-input" class="chat-input" placeholder="Mesaj yazın..." onkeypress="handleKeyPress(event)">
                    <button class="send-btn" onclick="sendChatMessage()">GÖNDER</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // DIAMOND GLOW SYSTEM
        function toggleDiamondGlow(checkbox) {
            if (checkbox.checked) {
                document.body.classList.add('diamond-mode-active');
            } else {
                document.body.classList.remove('diamond-mode-active');
            }
        }

        // BACKGROUND PARTICLES
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];
        const numberOfParticles = 40;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.speedY = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.7 + 0.2;
                this.pulseSpeed = Math.random() * 0.02 + 0.005;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;

                this.opacity += Math.sin(Date.now() * this.pulseSpeed) * 0.01;
                if (this.opacity < 0.1) this.opacity = 0.1;
                if (this.opacity > 0.9) this.opacity = 0.9;
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#ffffff";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        function initParticles() {
            particlesArray = [];
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particlesArray.length; i++) {
                particlesArray[i].update();
                particlesArray[i].draw();
            }
            requestAnimationFrame(animateParticles);
        }
        initParticles();
        animateParticles();

        // VISUALIZER SPECTRUM
        const vBars = document.querySelectorAll('.v-bar');
        function animateVisualizer() {
            if (isStarted && player && player.getPlayerState() === YT.PlayerState.PLAYING && !player.isMuted()) {
                vBars.forEach(bar => {
                    const randomHeight = Math.floor(Math.random() * 85) + 15;
                    bar.style.height = randomHeight + '%';
                });
            } else {
                vBars.forEach(bar => { bar.style.height = '10%'; });
            }
        }
        setInterval(animateVisualizer, 120);

        // FIREBASE SETUP & REALTIME CHAT / COUNTER
        const firebaseConfig = {
            apiKey: "AIzaSyBaTlb6V6e4FMLTYNXAPBgdzsgiclL8Qw8",
            authDomain: "easyfm-37b9e.firebaseapp.com",
            databaseURL: "https://easyfm-37b9e-default-rtdb.firebaseio.com",
            projectId: "easyfm-37b9e",
            storageBucket: "easyfm-37b9e.firebasestorage.app",
            messagingSenderId: "869244564550",
            appId: "1:869244564550:web:f0824148dbcae6b7024647",
            measurementId: "G-7WEFWTKBC7"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ONLINE COUNTER
        const myConnectionsRef = db.ref('online_listeners');
        const connectedRef = db.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                const con = myConnectionsRef.push();
                con.onDisconnect().remove();
                con.set(true);
            }
        });
        myConnectionsRef.on('value', (snap) => {
            document.getElementById('listener-count').innerText = snap.numChildren();
        });

        // CHAT SYSTEM
        const chatRef = db.ref('chat_messages');
        const chatContainer = document.getElementById('chat-messages');

        chatRef.limitToLast(40).on('child_added', (snapshot) => {
            const data = snapshot.val();
            appendMessage(data.name, data.message);
        });

        function appendMessage(name, text) {
            const msgCard = document.createElement('div');
            msgCard.className = 'msg-card';
            msgCard.innerHTML = `
                <div class="msg-author"><span class="msg-badge">MEMBER</span> ${escapeHtml(name)}</div>
                <div class="msg-text">${escapeHtml(text)}</div>
            `;
            chatContainer.appendChild(msgCard);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function sendChatMessage() {
            const nickInput = document.getElementById('nickname-input');
            const msgInput = document.getElementById('chat-input');

            const name = nickInput.value.trim() || 'Guest';
            const message = msgInput.value.trim();

            if (!message) return;

            chatRef.push({
                name: name,
                message: message,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            msgInput.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendChatMessage();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // AIRHORN SOUND EFFECT
        function playAirhorn() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(280, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(380, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }

        // RADIO STREAM SYNC
        const songList = [
            { id: '1IEg_3x35go', duration: 120 },
            { id: 'qAlF70MdfwU', duration: 207 }, 
            { id: 'L_BpiSsIBFM', duration: 236 }, 
            { id: 'cTGQrA5HHIU', duration: 204 }, 
            { id: 'ftaXMKV3ffE', duration: 160 },
            { id: 'LPTlvQ1Zet0', duration: 188 },
            { id: 'EfHNIPXTxy0', duration: 276 }
        ];

        const STREAM_START_TIME = 1700000000; 
        const totalPlaylistDuration = songList.reduce((acc, song) => acc + song.duration, 0);

        let player;
        let currentLoadedVideoId = null;
        let isChangingSong = false;
        let isStarted = false;
        let lastVolumeLevel = 100;

        function getCurrentStreamState() {
            const nowInSeconds = Math.floor(Date.now() / 1000);
            const elapsedTime = (nowInSeconds - STREAM_START_TIME) % totalPlaylistDuration;
            let accumulatedTime = 0;

            for (let i = 0; i < songList.length; i++) {
                if (elapsedTime < accumulatedTime + songList[i].duration) {
                    return { songIndex: i, seekTo: elapsedTime - accumulatedTime };
                }
                accumulatedTime += songList[i].duration;
            }
            return { songIndex: 0, seekTo: 0 };
        }

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            const state = getCurrentStreamState();
            currentLoadedVideoId = songList[state.songIndex].id;

            player = new YT.Player('player', {
                videoId: currentLoadedVideoId,
                playerVars: {
                    'autoplay': 0, 'controls': 0, 'disablekb': 1,
                    'modestbranding': 1, 'rel': 0, 'loop': 0, 'playsinline': 1
                },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function startRadio() {
            if (!player) return;
            const state = getCurrentStreamState();
            player.seekTo(state.seekTo, true);
            player.playVideo();
            player.unMute();
            player.setVolume(100);
            
            const overlay = document.getElementById('start-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 500);
            isStarted = true;
            document.getElementById('visualizer').classList.add('active');
        }

        function togglePlayPause() {
            if (!player || !isStarted) return;
            if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                player.pauseVideo();
            } else {
                syncToCurrentStream();
                player.playVideo();
            }
        }

        // VOLUME LOGIC
        const volumeIconHigh = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
        const volumeIconMute = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';

        function changeVolume(val) {
            if (!player) return;
            const volumeText = document.getElementById('volume-text');
            const icon = document.getElementById('volume-icon');
            player.setVolume(val);
            volumeText.innerText = val + '%';
            if (val == 0) {
                player.mute();
                icon.innerHTML = volumeIconMute;
            } else {
                if (player.isMuted()) player.unMute();
                icon.innerHTML = volumeIconHigh;
                lastVolumeLevel = val;
            }
        }

        function toggleMute() {
            if (!player) return;
            const slider = document.getElementById('volume-slider');
            const icon = document.getElementById('volume-icon');

            if (player.isMuted() || slider.value == 0) {
                const targetVolume = lastVolumeLevel > 0 ? lastVolumeLevel : 50;
                player.unMute();
                player.setVolume(targetVolume);
                slider.value = targetVolume;
                document.getElementById('volume-text').innerText = targetVolume + '%';
                icon.innerHTML = volumeIconHigh;
            } else {
                lastVolumeLevel = slider.value;
                player.mute();
                slider.value = 0;
                document.getElementById('volume-text').innerText = '0%';
                icon.innerHTML = volumeIconMute;
            }
        }

        function syncToCurrentStream() {
            if (!player || isChangingSong || !isStarted) return;
            const state = getCurrentStreamState();
            const targetSong = songList[state.songIndex];

            if (currentLoadedVideoId !== targetSong.id) {
                isChangingSong = true;
                currentLoadedVideoId = targetSong.id;
                player.loadVideoById({ videoId: targetSong.id, startSeconds: state.seekTo });
                setTimeout(() => { isChangingSong = false; }, 2000);
            } else {
                const currentTime = player.getCurrentTime ? player.getCurrentTime() : 0;
                if (Math.abs(currentTime - state.seekTo) > 3) {
                    player.seekTo(state.seekTo, true);
                }
            }
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED && isStarted) {
                syncToCurrentStream();
                player.playVideo();
            }
        }

        setInterval(() => {
            if (player && player.getPlayerState() === YT.PlayerState.PLAYING) {
                syncToCurrentStream();
            }
        }, 5000);
    </script>
